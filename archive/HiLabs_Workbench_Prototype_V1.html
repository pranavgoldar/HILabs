function assessmentPage(p){if(!M.can(p,state,'write'))return accessPage(p);const a=state.assessments[p.member_id]||{};const select=(id,title,options)=>`<div class="form-group"><label for="a-${id}">${title}</label><select id="a-${id}" name="${id}" class="form-input">${options.map(v=>`<option ${a[id]===v?'selected':''}>${v}</option>`).join('')}</select></div>`;return panel('Capture once · current assessment','Plan-specific required fields must be mapped in discovery; these are prototype field groups.',`<form data-form="assessment" data-id="${p.member_id}"><div class="record-fields"><div>${select('contactOutcome','Current contact outcome',['Not asked / not reached','Connected','Declined'])}${select('currentSetting','Current care setting',['Unknown','Home — verified','Inpatient — verified','Facility — verified'])}${select('safety','Current safety review',['Unknown / not assessed','Reviewed by qualified clinician','Escalation required'])}${select('meds','Medication clarification',['Unknown / not confirmed','Confirmed with responsible clinician','Not applicable to this review'])}</div><div><div class="form-group"><label for="a-goal">Member-stated goal</label><textarea id="a-goal" class="form-input textarea" name="memberGoal" placeholder="Keep not-asked information blank.">${E(a.memberGoal||'')}</textarea></div><div class="form-group"><label for="a-barrier">Current barrier / agreed intervention</label><textarea id="a-barrier" class="form-input textarea" name="barrier">${E(a.barrier||'')}</textarea></div><div class="form-group"><label for="a-outcome">Verified outcome and confirming source</label><textarea id="a-outcome" class="form-input textarea" name="outcome" placeholder="Who confirmed what, and when?">${E(a.outcome||'')}</textarea></div></div></div><label class="checkbox-label"><input type="checkbox" name="goalConfirmed" ${a.goalConfirmed?'checked':''}>Member goal and outcome were confirmed in this simulated review.</label><label class="checkbox-label"><input type="checkbox" name="settingVerified" ${a.settingVerified?'checked':''}>Current care setting has been verified with an appropriate source.</label><label class="checkbox-label"><input type="checkbox" name="supportVerified" ${a.supportVerified?'checked':''}>Required support/equipment delivery was confirmed, where applicable.</label><label class="checkbox-label"><input type="checkbox" name="reviewComplete" ${a.reviewComplete?'checked':''}>Assigned plan-RN post-transition review is complete. An inbound report alone does not establish this.</label><p class="form-hint">Saved fields can be reused in the care goal and documentation. Unknown, declined and not asked are preserved. A safety concern needs the plan escalation process.</p><div class="modal-actions"><button class="btn primary">Save assessment / goal</button></div></form>`);}
function closurePage(p){const blocks=M.closureBlocks(p,state);const status=state.caseStatus[p.member_id];return panel('Close or transition','An action or note is not the same as the case outcome.',`<div class="guide-note"><strong>Scenario-specific closure criteria</strong><br>${E(p.closure_criteria)}</div>${status?`<div class="alert" style="margin-top:18px"><div><strong>${E(status)}</strong><p>${E(state.closureDetails?.[p.member_id]?.reason||'Disposition recorded in this browser.')}</p></div></div>`:''}<div class="divider"></div><h3 class="section-title">Normal closure checks</h3>${blocks.length?blocks.map(b=>`<div class="check-step">${icon('alert')}<span>${E(b)}</span></div>`).join(''):`<div class="check-step">${icon('check')}Required prototype closure checks are satisfied.</div>`}<div class="button-stack" style="margin-top:20px"><button class="btn primary" data-close-case="${p.member_id}" ${blocks.length||status?'disabled':''}>Close with confirmed outcome</button><button class="btn" data-transition="${p.member_id}" ${!M.can(p,state,'write')||status?'disabled':''}>Record accepted transition</button></div><p class="form-hint">A transition requires a reason and an accepted receiving handover. Unresolved work transfers with its owner and deadline. It is not counted as completed care.</p>`);}
function teamPage(){if(state.actor!=='Team lead, RN')return head('Team review','Team-level assignment is demonstrated from the clinical lead role.')+panel('Clinical team-lead access','',`<button class="btn primary" data-role="Team lead, RN" data-next="team">Switch to simulated team lead</button>`);const unowned=P.filter(p=>M.band(p,state)==='P1'&&!M.owner(p,state)),late=P.filter(p=>M.overdue(p,state));return head('Team review & shift cover','Unowned needs, overdue work and handover acceptance stay visible.',`<button class="btn" data-action="simulate-unowned">Simulate an unowned P1</button>`)+`<div class="stats"><div class="stat"><div class="stat-head">Unowned P1</div><div class="stat-value">${unowned.length}</div><div class="stat-note">Needs qualified ownership</div></div><div class="stat highlight"><div class="stat-head">Overdue work slots</div><div class="stat-value">${late.length}</div><div class="stat-note">At the selected demo clock</div></div><div class="stat"><div class="stat-head">Pending handovers</div><div class="stat-value">${state.handovers.filter(h=>h.status==='Pending').length}</div><div class="stat-note">Original owner / lead accountable</div></div><div class="stat"><div class="stat-head">RN overrides</div><div class="stat-value">${Object.keys(state.bandOverrides).length}</div><div class="stat-note">Inspect the rationale in activity</div></div></div>`+panel('Assigned members and open work','Counts derive from the five cases; no invented full-shift capacity estimate.',`<div class="table-scroll"><table><thead><tr><th>Member / program</th><th>Current owner</th><th>Work state</th><th>Action</th></tr></thead><tbody>${M.ordered(P,state).map(p=>`<tr><td><button class="member-name" data-nav="member/${p.member_id}">${E(p.name)}</button><span class="reason-meta">${E(p.plan)}</span></td><td>${E(M.owner(p,state)||'UNOWNED')}</td><td>${badge(M.overdue(p,state)?'Overdue':M.band(p,state),M.overdue(p,state)?'red':'amber')}<span class="reason-meta">${openTasks(p.member_id).length} open tasks</span></td><td><button class="btn small" data-handover="${p.member_id}">Arrange cover</button></td></tr>`).join('')}</tbody></table></div>`)+`<div style="margin-top:20px">${handoverPanel()}</div>`;}
function handoverPanel(){const list=state.handovers.filter(h=>state.actor==='Team lead, RN'||h.from===state.actor||h.to===state.actor);return panel('Shift handovers','Acceptance precedes release of prior ownership.',list.length?list.map(h=>`<div class="fact"><p><strong>${E(patient(h.memberId).name)}</strong> · ${E(h.from||'Team lead / unowned')} → ${E(h.to)}<br><span class="reason-meta">${E(h.reason)} · ${E(h.status)}</span></p>${h.status==='Pending'?(state.actor===h.to?`<button class="btn small" data-accept-handover="${h.id}">Accept receiving ownership</button>`:`<button class="text-button" data-role="${E(h.to)}" data-next="tasks">Switch to receiver to accept ${icon('arrow')}</button>`):badge('Acceptance recorded','green')}</div>`).join(''):'<p class="compact-info">No handover has been requested.</p>');}
function operationsPage(){const admin=['Team lead, RN','Administrator'].includes(state.actor),dq=state.actor==='Data-quality reviewer',qs=state.syncQueue.filter(q=>admin||M.can(patient(q.memberId),state,'view'));return head('Data, identity & acknowledgment','Failure states are simulated. External systems are not connected.')+`<div class="detail-grid">${panel('Source health','Coverage is different from clinical truth.',`<div class="fact"><p><strong>Vraj · appointment source unavailable</strong><br>Current heartbeat: unavailable<br>Last success: 31 Oct, 06:00 ET</p>${M.can(patient('SYN-003'),state,'view')?sourceButton('ACC-003'):''}</div><div class="fact"><p><strong>Shruti · lab feed stale</strong><br>Last refresh: 30 Oct, 16:00 ET<br>Dated results are contextual.</p>${M.can(patient('SYN-005'),state,'view')?sourceButton('LAB-005'):''}</div>`)}${panel('Scenario controls','For prototype review only.',admin?`<div class="form-group"><label for="demo-clock">Demo clock</label><select class="form-input" id="demo-clock"><option value="${M.SNAPSHOT}" ${state.now===M.SNAPSHOT?'selected':''}>2 Nov · 08:00 ET (base snapshot)</option><option value="2026-11-02T12:30:00-05:00" ${state.now.includes('12:30')?'selected':''}>2 Nov · 12:30 ET (overdue state)</option></select></div><label class="checkbox-label"><input type="checkbox" data-system="writebackFail" ${state.systems.writebackFail?'checked':''}>Simulate failed writeback</label><label class="checkbox-label"><input type="checkbox" data-system="aiPaused" ${state.systems.aiPaused?'checked':''}>Pause optional assistance; manual note remains</label><button class="btn small" data-action="source-change">Simulate source revision</button><button class="btn small" data-action="start-loading" style="margin-top:8px">Show loading state</button><p class="form-hint">Drafts generated against an older source revision must be reviewed again. No new clinical fact is invented by this control.</p>`:'<p class="compact-info">Switch to the simulated team lead or administrator to operate failure controls.</p>')}</div><div style="margin-top:20px">${panel('Signed artifact acknowledgment','Retry uses the same artifact and idempotency key.',qs.length?qs.map(q=>`<div class="fact"><p><strong>${state.actor==='Administrator'?E(q.memberId):E(patient(q.memberId).name)}</strong> · ${E(q.status)}<br><span class="reason-meta">Key: ${E(q.idempotencyKey)} · ${q.attempts} attempt(s)<br>${q.receipt?E(q.receipt):'No destination receipt yet'}</span></p>${q.status!=='Acknowledged'?`<div class="button-stack"><button class="btn small" data-retry="${E(q.id)}">Retry same artifact</button><button class="btn small" data-ack="${E(q.id)}">Simulate destination receipt</button></div>`:badge('Demo acknowledgment','green')}</div>`).join(''):'<p class="compact-info">No signed artifacts queued. Save a reviewed note from an assigned RN workspace.</p>')}</div><div style="margin-top:20px">${panel('Identity quarantine · Q-001','No canonical member join or clinical action is performed.',`<div class="guide-note">An external record has conflicting phone / date-of-birth identity evidence. Candidate IDs are SYN-003 and SYN-005; neither is selected automatically. Canonical member IDs remain unique.</div>${state.identityReviews.length?state.identityReviews.map(i=>`<div class="fact"><p>${E(i.decision)} · ${E(i.memberId||'No link')}<br>${E(i.reason)}</p>${badge('Local reviewer decision only','blue')}</div>`).join(''):''}${dq?`<button class="btn" data-action="review-identity" style="margin-top:15px">Record link / reject review</button>`:`<button class="text-button" data-role="Data-quality reviewer" data-next="operations" style="margin-top:15px">Switch to data-quality reviewer ${icon('arrow')}</button>`}<p class="form-hint">Production high-risk links require independent review before any join. The prototype never merges external records.</p>` )}</div>`;}
function handoverModal(id){if(state.actor!=='Team lead, RN')return toast('Team-lead access required.',true);const p=patient(id);modal('Arrange qualified cover · '+E(p.name),'Open needs transfer only after the receiver accepts.',`<form data-form="handover" data-id="${id}"><p class="compact-info">Current owner: ${E(M.owner(p,state)||'Unowned; lead accountable')}<br>Open tasks: ${openTasks(id).length} · deadline ${E(fmt(p.due_at,'full'))} ET</p><div class="form-group"><label for="cover-owner">Eligible receiving owner</label><select class="form-input" id="cover-owner" name="to"><option>Cover RN (qualified)</option>${M.owner(p,state)!==p.owner?`<option>${E(p.owner)}</option>`:''}</select></div><div class="form-group"><label for="cover-reason">Reason and handover context</label><textarea id="cover-reason" class="form-input textarea" name="reason" required placeholder="Include unresolved needs, due work and relevant contact restrictions."></textarea></div><label class="checkbox-label"><input type="checkbox" name="eligible" required>For this simulation, the receiving RN has the required Ohio licence, program competence and language support.</label><div class="modal-actions"><button class="btn primary">Request handover</button></div></form>`);}
function transitionModal(id){const p=patient(id);modal('Record an accepted transition','Do not mark unresolved care as completed.',`<form data-form="transition" data-id="${id}"><div class="form-group"><label for="transition-type">Disposition</label><select class="form-input" id="transition-type" name="type">${['Transfer to receiving team','Member declines services','Disenrolled / out of state','Facility / hospice transition','Other verified exception'].map(t=>`<option>${t}</option>`).join('')}</select></div><div class="form-group"><label for="transition-reason">Verified reason, source and receiving arrangement</label><textarea id="transition-reason" class="form-input textarea" name="reason" required></textarea></div><p class="form-hint">An accepted handover and acknowledged signed note are required. Open tasks stay with the accepted receiving owner.</p><div class="modal-actions"><button class="btn primary">Record transition</button></div></form>`);}
// New V1 handlers are bounded to their own controls/forms.
document.addEventListener('click',e=>{const b=e.target.closest('button,a');if(!b)return;const p=patient(route().id);if(b.dataset.page){ui.page=Number(b.dataset.page);render();return;}if(b.dataset.role){state.actor=b.dataset.role;save();if(document.getElementById('modal').open)close();go(b.dataset.next||'dashboard');render();toast('Simulated role: '+state.actor);return;}if(b.dataset.handover){handoverModal(b.dataset.handover);return;}if(b.dataset.acceptHandover){try{const h=M.acceptHandover(state,b.dataset.acceptHandover);log('Handover accepted',h.memberId,h.to);render();toast('Receiving ownership accepted. Open task owners updated.');}catch(err){toast(err.message,true);}return;}if(b.dataset.retry||b.dataset.ack){try{const id=b.dataset.retry||b.dataset.ack,q=state.syncQueue.find(q=>q.id===id);if(!q||!M.can(patient(q.memberId),state,'view')&&state.actor!=='Administrator')throw Error('Artifact access is not permitted for this demo role.');if(b.dataset.retry)M.retryArtifact(state,id);else M.acknowledgeArtifact(state,id);log(b.dataset.retry?'Same artifact retried':'Simulated CM receipt',q.memberId,q.idempotencyKey);render();toast('Demo sync state updated; no external record was changed.');}catch(err){toast(err.message,true);}return;}if(b.dataset.closeCase){const q=patient(b.dataset.closeCase),blocks=M.closureBlocks(q,state);if(blocks.length)return toast(blocks[0],true);state.caseStatus[q.member_id]='Closed';state.closureDetails??={};state.closureDetails[q.member_id]={reason:state.assessments[q.member_id].outcome,at:new Date().toISOString()};log('Case closed with confirmed outcome',q.member_id,state.closureDetails[q.member_id].reason);render();toast('Case closure recorded in this demo.');return;}if(b.dataset.transition){transitionModal(b.dataset.transition);return;}if(b.dataset.action==='manual-note'){if(!M.can(p,state,'write'))return toast('Use the assigned RN workspace.',true);const n=session(p);n.manual=true;n.draftText='MANUAL COORDINATION NOTE · DEMO\n'+p.name+' / '+p.member_id+'\n\nKnown source facts:\n\nActual contact outcome:\n\nVerified findings / unknowns:\n\nProposed next step:\n';n.draftRevision=n.revision;n.sourceVersion=state.systems.sourceVersion;render();return;}if(b.dataset.action==='source-change'){state.systems.sourceVersion++;log('Source revision simulated','','Draft review must be repeated; seed facts are unchanged.');render();return;}if(b.dataset.action==='start-loading'){state.systems.loading=true;save();go('queue');render();return;}if(b.dataset.action==='stop-loading'){state.systems.loading=false;save();render();return;}if(b.dataset.action==='simulate-unowned'){if(state.actor!=='Team lead, RN')return;state.ownerOverrides['SYN-003']='';log('Unowned P1 simulated','SYN-003','Team lead remains accountable until qualified cover accepts.');render();return;}if(b.dataset.action==='review-identity'){if(state.actor!=='Data-quality reviewer')return toast('Data-quality reviewer access required.',true);modal('Identity review · Q-001','No canonical join or external merge is performed.',`<form data-form="identity"><div class="form-group"><label for="identity-decision">Reviewer recommendation</label><select id="identity-decision" name="decision" class="form-input"><option>Propose link after independent review</option><option>Reject external match</option></select></div><div class="form-group"><label for="identity-member">Candidate, if proposing link</label><select id="identity-member" name="memberId" class="form-input"><option value="">No link</option><option value="SYN-003">SYN-003</option><option value="SYN-005">SYN-005</option></select></div><div class="form-group"><label for="identity-evidence">Approved identifiers / evidence and rationale</label><textarea id="identity-evidence" name="reason" class="form-input textarea" required></textarea></div><label class="checkbox-label"><input type="checkbox" name="checked" required>I checked the approved identity evidence; the record remains held pending any required independent review.</label><button class="btn primary">Save reviewer recommendation</button></form>`);return;}if(b.dataset.action==='opt-out'){if(!M.can(p,state,'write'))return toast('Use the assigned RN workspace.',true);state.optOut[p.member_id]=!state.optOut[p.member_id];log('Contact preference updated',p.member_id,state.optOut[p.member_id]?'Member outreach opted out; no blind retries.':'Member outreach permission requires reconfirmation.');render();return;}});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='actor-select'){state.actor=el.value;ui.query='';ui.filter='all';ui.page=1;save();if(['Administrator','Data-quality reviewer'].includes(state.actor))go('operations');render();}else if(el.id==='demo-clock'){state.now=el.value;log('Demo clock changed','','Overdue is separate from clinical severity.');render();}else if(el.dataset.system){state.systems[el.dataset.system]=el.checked;save();render();}else if(el.id==='task-member'){const t=document.getElementById('task-owner');if(t)t.value=M.owner(patient(el.value),state)||'';}});
document.addEventListener('submit',e=>{const form=e.target,k=form.dataset.form;if(!['assessment','handover','identity','transition'].includes(k))return;e.preventDefault();if(e.stopImmediatePropagation)e.stopImmediatePropagation();const f=new FormData(form),p=patient(form.dataset.id);try{if(k==='assessment'){if(!M.can(p,state,'write'))throw Error('Assigned RN access required.');const a={};for(const key of ['contactOutcome','currentSetting','safety','meds','memberGoal','barrier','outcome'])a[key]=(f.get(key)||'').trim();for(const key of ['goalConfirmed','settingVerified','supportVerified','reviewComplete'])a[key]=f.has(key);if(a.goalConfirmed&&!a.memberGoal)throw Error('Record the confirmed member goal.');if(a.reviewComplete&&!a.outcome)throw Error('Record review evidence and the confirming source.');if(a.safety==='Escalation required'&&a.reviewComplete)throw Error('Unresolved escalation cannot be marked as completed review.');state.assessments[p.member_id]={...a,actor:state.actor,at:new Date().toISOString()};if(sessions[p.member_id])sessions[p.member_id].revision++;log('Assessment / care goal saved',p.member_id,a.reviewComplete?'Assigned RN review completed with entered evidence.':'Partial assessment retained; unknown fields remain.');render();toast('Assessment saved. Member goal is reused in the care plan.');}else if(k==='handover'){if(state.actor!=='Team lead, RN')throw Error('Team-lead access required.');if(!f.has('eligible')||!f.get('reason')?.trim())throw Error('Confirm eligible cover and document the reason.');if(state.handovers.some(h=>h.memberId===p.member_id&&h.status==='Pending'))throw Error('A handover is already awaiting acceptance.');state.handovers.push({id:'handover-'+Date.now(),memberId:p.member_id,from:M.owner(p,state),to:f.get('to'),reason:f.get('reason').trim(),status:'Pending',openTasks:openTasks(p.member_id).map(t=>t.id)});log('Cover requested',p.member_id,'Receiving owner must accept before ownership changes.');close();render();}else if(k==='identity'){if(state.actor!=='Data-quality reviewer')throw Error('Data-quality reviewer access required.');if(!f.has('checked')||!f.get('reason')?.trim())throw Error('Document approved matching evidence.');if(f.get('decision').startsWith('Propose')&&!f.get('memberId'))throw Error('Choose the proposed candidate.');state.identityReviews.push({decision:f.get('decision'),memberId:f.get('memberId'),reason:f.get('reason').trim(),actor:state.actor,at:new Date().toISOString()});log('Identity review recommendation','','Q-001 remains separate from canonical member records.');close();render();}else if(k==='transition'){if(!M.can(p,state,'write'))throw Error('Assigned RN access required.');const hand=state.handovers.find(h=>h.memberId===p.member_id&&h.status==='Accepted');if(!hand)throw Error('Arrange and accept the receiving handover first.');const ns=state.notes.filter(n=>n.memberId===p.member_id);if(!ns.length||ns.some(n=>!state.syncQueue.some(q=>q.noteId===n.id&&q.status==='Acknowledged')))throw Error('A reviewed disposition note and simulated CM acknowledgment are required.');if(!f.get('reason')?.trim())throw Error('Record the verified reason and accepting team.');state.caseStatus[p.member_id]='Transitioned';state.closureDetails??={};state.closureDetails[p.member_id]={reason:f.get('type')+': '+f.get('reason').trim(),at:new Date().toISOString()};log('Accepted transition recorded',p.member_id,state.closureDetails[p.member_id].reason);close();render();}}catch(err){errorInModal(err.message);}});

document.addEventListener('click',e=>{const b=e.target.closest('button,a');if(!b)return;
if(b.dataset.nav){ui.sourceGroup='all';go(b.dataset.nav);return;}
if(b.dataset.filter){ui.page=1;ui.filter=b.dataset.filter;render();return;}
if(b.dataset.taskFilter){ui.taskFilter=b.dataset.taskFilter;render();return;}
if(b.dataset.source){recordModal(b.dataset.source);return;}
if(b.dataset.score){scoreModal(patient(b.dataset.score));return;}
if(b.dataset.newTask){newTaskModal(b.dataset.newTask);return;}
if(b.dataset.complete){completeModal(b.dataset.complete);return;}
if(b.dataset.override){if(document.getElementById('modal').open)close();overrideModal(b.dataset.override);return;}
if(b.dataset.note){noteModal(b.dataset.note);return;}
if(b.dataset.exportNote){const n=state.notes.find(n=>n.id===b.dataset.exportNote);if(n)download(patient(n.memberId).name+'-demo-note.txt',n.text);return;}
if(b.dataset.reopen){const t=state.tasks.find(t=>t.id===b.dataset.reopen);if(!M.can(patient(t.memberId),state,'write'))return toast('Assigned RN access required.',true);t.status='open';log('Task reopened',t.memberId,t.label);render();toast('Task reopened. Prior completion evidence is retained.');return;}
switch(b.dataset.action){case'guide':guide();break;case'policy':if(document.getElementById('modal').open)close();policyModal();break;case'close-modal':close();break;case'new-task':newTaskModal(route().id);break;case'clear-filters':ui.query='';ui.filter='all';ui.program='all';render();break;case'start-tour':state.actor='Maria, RN';save();close();go('member/SYN-001');break;case'draft':{if(state.systems.aiPaused){toast('Optional assistance is paused. Use the manual note path.',true);break;}const p=patient(route().id),en=session(p),d=M.draft(p,en,state);if(d.error){toast(d.error,true);break;}const a=state.assessments[p.member_id];en.draftText=d.text+(a?'\n\nRN-ENTERED ASSESSMENT REUSE\nGoal: '+(a.memberGoal||'Not asked')+'\nBarrier / intervention: '+(a.barrier||'Unknown')+'\nReview evidence: '+(a.outcome||'Not entered')+'\nSaved by '+a.actor+'; confirmation scope stays explicit.':'');en.draftRevision=en.revision;en.sourceVersion=state.systems.sourceVersion;log('Source-template note prepared',p.member_id,'Sources: '+d.sources.join(', '));render();toast('Draft prepared from sources and your entries. RN review required.');break;}case'review-note':reviewModal();break;case'reset':close();modal('Reset this browser’s demo?','This removes locally created tasks, notes, activity and priority overrides.',`<form data-form="reset"><p class="compact-info">The five fictional member records remain available. Download any notes you want to keep before resetting.</p><div class="modal-actions"><button type="button" class="btn" data-action="close-modal">Cancel</button><button class="btn danger" type="submit">Reset demo</button></div></form>`);break;}
});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='global-search'){ui.page=1;const start=el.selectionStart;ui.query=el.value;if(!['dashboard','queue'].includes(route().page)){location.hash='queue';render();}else render();const q=document.getElementById('global-search');q.focus();q.setSelectionRange(start,start);return;}if(el.dataset.session){const en=session(patient(route().id));en[el.dataset.session]=el.type==='checkbox'?el.checked:el.value;if(el.dataset.session!=='draftText'){en.revision++;const hint=document.getElementById('draft-state');if(hint)hint.textContent='Inputs changed. Regenerate the draft before review.';const btn=document.getElementById('review-draft');if(btn)btn.disabled=true;}}});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='program-filter'){ui.page=1;ui.program=el.value;render();}else if(el.id==='sort-order'){ui.sort=el.value;render();}else if(el.id==='source-group'){ui.sourceGroup=el.value;render();}else if(el.dataset.session==='route'){const en=session(patient(route().id));en.route=el.value;if(en.route==='Neutral callback'&&!['preparation','callback','unreached'].includes(en.outcome))en.outcome='preparation';render();}});
document.addEventListener('submit',e=>{const form=e.target;if(!form.dataset.form)return;e.preventDefault();const f=new FormData(form);try{switch(form.dataset.form){case'task':{const target=patient(f.get('memberId'));if(!M.can(target,state,'write')&&state.actor!=='Team lead, RN')throw Error('Only the assigned RN or team lead can assign this task.');if(!M.owner(target,state))throw Error('Assign qualified ownership through team review first.');const v=M.addTask(state,{memberId:f.get('memberId'),label:f.get('label'),due:M.parseEastern(f.get('due')),owner:M.owner(target,state)});log(v.duplicate?'Existing task reused':'Follow-up task created',v.task.memberId,v.task.label);close();render();toast(v.duplicate?'That open task already exists. No duplicate created.':'Follow-up task created and assigned.');break;}case'complete':{const task=state.tasks.find(t=>t.id===form.dataset.id);if(!M.can(patient(task.memberId),state,'write'))throw Error('Switch to the assigned RN to complete clinical work.');const t=M.completeTask(state,form.dataset.id,f.get('outcome')||'',f.has('verified'));log('Task completed with evidence',t.memberId,t.outcome);close();render();toast('Task completed. The clinical case remains open.');break;}case'override':{if(!M.can(patient(form.dataset.id),state,'write')&&state.actor!=='Team lead, RN')throw Error('Only the assigned RN or clinical team lead may override.');const reason=(f.get('reason')||'').trim();if(!reason)throw Error('Document the reason for the override.');state.bandOverrides[form.dataset.id]={band:f.get('band'),reason,actor:state.actor,policyVersion:'V1',at:new Date().toISOString()};log('RN priority override',form.dataset.id,f.get('band')+' · '+reason);close();render();toast('Priority override saved with its rationale.');break;}case'sign':{const p=patient(form.dataset.id),en=session(p);if(en.revision!==en.draftRevision||en.sourceVersion!==state.systems.sourceVersion)throw Error('Inputs changed. Regenerate the note draft.');const n=M.saveNote(state,p,en,en.draftText,f.has('reviewed'));M.queueArtifact(state,n);if(f.has('task'))M.addTask(state,{memberId:p.member_id,label:en.plan||p.monday_action,due:p.due_at});log('Demo note signed',p.member_id,'RN approval recorded; local save only. No external writeback.');close();sessions[p.member_id]=null;go('member/'+p.member_id+'/plan');render();toast('Signed locally; simulated CM acknowledgment is pending. Inspect Data & sync.');break;}case'reset':state=M.seed(DATA);sessions={};save();close();ui.query='';ui.filter='all';ui.program='all';go('dashboard');render();toast('Demo reset to the original five member cases.');break;}}catch(err){errorInModal(err.message);}});
window.addEventListener('hashchange',()=>{if(document.getElementById('modal').open)close();render();window.scrollTo({top:0,behavior:'instant'});});
render();
window.CareDemo={render,route,patient,getState:()=>JSON.parse(JSON.stringify(state))};

</script><script>document.addEventListener('click',function(e){const a=e.target.closest('[data-action=save-html]');if(a){e.preventDefault();const u=URL.createObjectURL(new Blob(['<!doctype html>'+document.documentElement.outerHTML],{type:'text/html'}));const l=document.createElement('a');l.href=u;l.download='HiLabs_Workbench_Prototype_V1.html';l.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}if(location.protocol==='file:')setTimeout(function(){document.querySelectorAll('a[href="prototype-source.zip"],a[href="synthetic-members.json"]').forEach(function(a){a.hidden=true;});},0);});</script></body></html>
