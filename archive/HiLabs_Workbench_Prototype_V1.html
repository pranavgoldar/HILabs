<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Interactive HiLabs case-management workbench prototype with fictional member data."><meta name="robots" content="noindex,nofollow"><title>Care Workbench V1 · HiLabs</title><style>:root{
  --bg:#f3f4f6;--surface:#ffffff;--surface-2:#f9fafb;
  --ink:#111827;--ink-2:#374151;--line:#d1d5db;--line-strong:#9ca3af;
  --primary:#0f5132;--primary-hover:#0a3d26;--primary-soft:#e6f2ec;
  --link:#0b4f8a;--focus:#1d4ed8;
  --amber-bg:#fef3c7;--amber-ink:#713f12;--amber-line:#f59e0b;
  --green-bg:#dcfce7;--green-ink:#14532d;
  --red-bg:#fee2e2;--red-ink:#7f1d1d;--red-line:#dc2626;
  --blue-bg:#dbeafe;--blue-ink:#1e3a8a;
  --gray-bg:#e5e7eb;--gray-ink:#1f2937;
  --purple-bg:#ede9fe;--purple-ink:#4c1d95;
  color-scheme:light;
  font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:15px;line-height:1.55;color:var(--ink);background:var(--bg);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.55}
a{color:var(--link)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
svg{width:18px;height:18px;flex-shrink:0;vertical-align:middle}
h1,h2,h3{color:var(--ink)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}

/* ---------- Header + navigation ---------- */
.topbar{background:var(--primary);color:#fff;position:sticky;top:0;z-index:30;box-shadow:0 1px 0 rgba(0,0,0,.15)}
.topbar-inner{max-width:1240px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;color:#fff;margin-right:auto}
.brand-mark{background:#fff;color:var(--primary);width:32px;height:32px;border-radius:8px;display:grid;place-items:center}
.top-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.global-search{display:flex;align-items:center;gap:8px;background:#fff;color:var(--ink-2);border-radius:8px;padding:8px 12px;width:280px;max-width:100%}
.global-search input{border:0;outline:none;background:none;width:100%;font-size:15px;color:var(--ink)}
.global-search input::placeholder{color:#4b5563}
.role-pick{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:#fff}
.role-pick .select{background:#fff;color:var(--ink);border-color:#fff}
.topbar .icon-button{background:transparent;border-color:rgba(255,255,255,.7);color:#fff}
.topbar .icon-button:hover{background:rgba(255,255,255,.15)}
.main-nav{background:var(--surface);border-bottom:1px solid var(--line)}
.nav-inner{max-width:1240px;margin:0 auto;padding:0 24px;display:flex;gap:4px;overflow-x:auto}
.nav-item{display:flex;align-items:center;gap:8px;border:0;background:none;padding:14px 14px 12px;font-size:15px;font-weight:600;color:var(--ink-2);border-bottom:3px solid transparent;white-space:nowrap}
.nav-item:hover{color:var(--ink);background:var(--surface-2)}
.nav-item.active{color:var(--primary);border-bottom-color:var(--primary)}
.nav-item .count{background:var(--primary);color:#fff;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px}

/* ---------- Page ---------- */
.content{max-width:1240px;margin:0 auto;padding:28px 24px 32px}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.page-head h1{font-size:28px;line-height:1.25;margin:0 0 6px;letter-spacing:-.3px}
.page-head p,.section-sub{margin:0;color:var(--ink-2);font-size:15px}
.head-actions{display:flex;gap:10px;flex-wrap:wrap}
.footnote{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:28px;padding-top:16px;border-top:1px solid var(--line);font-size:14px;color:var(--ink-2)}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-size:15px;font-weight:600;line-height:1.3;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--surface-2);border-color:var(--ink-2)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-hover)}
.btn.soft{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
.btn.small{padding:7px 12px;font-size:14px}
.btn.danger{color:var(--red-ink);border-color:var(--red-line)}
.btn svg{width:16px;height:16px}
.text-button{border:0;background:none;padding:2px 0;color:var(--link);font-size:14px;font-weight:600;text-decoration:underline;text-underline-offset:2px;display:inline-flex;align-items:center;gap:4px}
.text-button:hover{color:#06315a}
.text-button svg{width:14px;height:14px}
.icon-button{width:38px;height:38px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);display:grid;place-items:center}
.select{font-size:14px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 10px;max-width:220px}

/* ---------- Cards / stats ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0;overflow:hidden}
.panel-header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 20px 12px;flex-wrap:wrap}
.panel-header h2,.section-title{font-size:18px;margin:0 0 4px;font-weight:700}
.panel-header p{margin:0;font-size:14px;color:var(--ink-2)}
.panel-body{padding:4px 20px 20px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.stat-head{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.stat-head svg{color:var(--primary)}
.stat-value{font-size:30px;font-weight:700;line-height:1.2;color:var(--ink)}
.stat-value small{font-size:14px;font-weight:500;color:var(--ink-2)}
.stat-note{font-size:13px;color:var(--ink-2);margin-top:4px}
.stat.highlight{border-color:var(--primary);border-width:2px}
.stat.highlight .stat-value{color:var(--primary)}
.focus-card{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;background:var(--primary-soft);border:2px solid var(--primary);border-radius:12px;padding:18px 20px;margin-bottom:20px}
.focus-card .focus-label{font-size:13px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--primary);margin-bottom:4px}
.focus-card h3{font-size:19px;margin:0 0 4px}
.focus-card p{margin:0;font-size:15px;color:var(--ink-2);max-width:760px}
.dashboard-grid,.side-stack{display:block}

/* ---------- Filters + table ---------- */
.filters{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:0 20px 14px}
.filter-tabs{display:flex;flex-wrap:wrap;gap:6px}
.filter-tab{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;white-space:nowrap}
.filter-tab:hover{border-color:var(--ink-2)}
.filter-tab.active{background:var(--ink);border-color:var(--ink);color:#fff}
.filter-tab span{margin-left:6px;font-weight:700;opacity:.85}
.table-scroll{overflow-x:auto;position:relative}
table{border-collapse:collapse;width:100%;text-align:left}
thead{background:var(--surface-2)}
th{padding:10px 16px;font-size:13px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.4px;border-block:1px solid var(--line);white-space:nowrap}
td{padding:14px 16px;border-bottom:1px solid var(--line);font-size:15px;vertical-align:middle;color:var(--ink)}
tr:last-child td{border-bottom:0}
.member-row:hover{background:var(--surface-2)}
.member-cell{display:flex;align-items:center;gap:12px;min-width:160px}
.avatar{width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;background:var(--primary);color:#fff;flex-shrink:0}
.avatar.sage{background:#3f6212}.avatar.blue{background:#1e40af}.avatar.violet{background:#5b21b6}.avatar.peach{background:#9a3412}.avatar.rose{background:#9f1239}
.member-name{border:0;background:none;padding:0;font-size:16px;font-weight:700;color:var(--link);text-align:left;text-decoration:underline;text-underline-offset:2px}
.member-name:hover{color:#06315a}
.member-meta,.reason-meta{display:block;font-size:13px;color:var(--ink-2);margin-top:3px;line-height:1.45}
.reason-title{display:block;font-size:15px;font-weight:600;max-width:340px;line-height:1.4}
.due-date{display:block;font-weight:700;white-space:nowrap}
.due-time{display:block;font-size:13px;color:var(--ink-2);white-space:nowrap}
.score-button{border:0;background:none;padding:0;display:flex;align-items:center;gap:8px}
.score-button strong{font-size:15px;color:var(--ink)}
.row-arrow{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px;display:grid;place-items:center}
.row-arrow:hover{background:var(--primary);border-color:var(--primary);color:#fff}
.table-footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 20px;border-top:1px solid var(--line);font-size:14px;color:var(--ink-2)}

/* ---------- Badges ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;line-height:1.3;border-radius:6px;padding:3px 9px;white-space:nowrap;border:1px solid transparent}
.badge.amber{background:var(--amber-bg);color:var(--amber-ink);border-color:#fcd34d}
.badge.green{background:var(--green-bg);color:var(--green-ink);border-color:#86efac}
.badge.blue{background:var(--blue-bg);color:var(--blue-ink);border-color:#93c5fd}
.badge.red{background:var(--red-bg);color:var(--red-ink);border-color:#fca5a5}
.badge.gray{background:var(--gray-bg);color:var(--gray-ink);border-color:#d1d5db}
.badge.purple{background:var(--purple-bg);color:var(--purple-ink);border-color:#c4b5fd}
.inline-count{font-size:13px;font-weight:700;background:var(--gray-bg);color:var(--gray-ink);padding:2px 8px;border-radius:6px;margin-left:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:#15803d;margin-right:6px}.dot.warning{background:#b45309}

/* ---------- Member workspace ---------- */
.back-button{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:0;margin:0 0 16px;font-size:15px;font-weight:600;color:var(--link);text-decoration:underline}
.member-banner{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;padding:20px;margin-bottom:16px}
.member-identity{display:flex;align-items:center;gap:16px}
.member-banner .avatar{width:56px;height:56px;font-size:22px}
.member-identity h1{font-size:26px;margin:0 0 4px}
.member-identity p{margin:0;font-size:15px;color:var(--ink-2)}
.member-chips{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
.member-banner-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.member-banner-right small{font-size:14px;color:var(--ink-2)}
.alert{display:flex;gap:12px;align-items:flex-start;background:var(--amber-bg);border:1px solid var(--amber-line);border-left:6px solid var(--amber-line);border-radius:10px;padding:14px 16px;margin-bottom:18px;color:var(--amber-ink)}
.alert>svg{width:22px;height:22px;margin-top:2px}
.alert strong{display:block;font-size:16px;color:#451a03;margin-bottom:4px}
.alert p{margin:0 0 8px;font-size:15px;color:#451a03}
.member-tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:20px;overflow-x:auto}
.member-tab{border:0;background:none;padding:10px 14px;font-size:15px;font-weight:600;color:var(--ink-2);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.member-tab:hover{color:var(--ink);background:var(--surface-2)}
.member-tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.detail-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px}
.detail-lower{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:18px}
.fact{padding:12px 0;border-bottom:1px solid var(--line)}
.fact:last-child{border-bottom:0}
.fact p{margin:0 0 8px;font-size:15px}
.source-link{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line-strong);background:var(--surface);color:var(--link);border-radius:6px;padding:3px 8px;font-size:13px;font-weight:600}
.source-link:hover{background:var(--blue-bg);border-color:var(--blue-ink)}
.source-link svg{width:12px;height:12px}
.check-step{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:15px;color:var(--ink)}
.check-step svg{color:var(--amber-ink);margin-top:2px}
.step-num{width:26px;height:26px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;flex-shrink:0}
.info-card{padding:18px}
.info-card h3{display:flex;align-items:center;gap:8px;font-size:16px;margin:0 0 10px}
.info-card h3 svg{color:var(--primary)}
.info-card p{margin:0 0 10px;font-size:15px;color:var(--ink-2)}
.info-card strong{color:var(--ink)}
.timeline{padding:0 20px 18px}
.timeline-item{position:relative;padding:12px 0 12px 24px;border-left:2px solid var(--line);margin-left:6px}
.timeline-item:before{content:'';position:absolute;left:-7px;top:18px;width:12px;height:12px;border-radius:50%;background:var(--primary);border:2px solid #fff}
.timeline-item h3{font-size:16px;margin:0 0 4px}
.timeline-item p{margin:0 0 8px;font-size:14px;color:var(--ink-2)}
.records-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.record-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.record-card header{display:flex;justify-content:space-between;align-items:center;gap:10px}
.record-card h3{font-size:16px;margin:8px 0 6px}
.record-card p{font-size:14px;color:var(--ink-2);margin:0 0 10px}
.record-id{font-size:13px;font-weight:700;color:var(--ink-2)}
.record-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.record-field{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
.record-field.wide{grid-column:1/-1}
.record-field dt{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-2);margin-bottom:4px}
.record-field dd{margin:0;font-size:15px;color:var(--ink);overflow-wrap:anywhere}
.record-clocks{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.record-clocks div{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:15px}
.record-clocks small{display:block;font-size:13px;font-weight:600;color:var(--ink-2)}
.empty{padding:40px 20px;text-align:center;font-size:15px;color:var(--ink-2)}
.empty svg{display:block;margin:0 auto 12px;width:28px;height:28px;color:var(--ink-2)}

/* ---------- Outreach + forms ---------- */
.outreach-banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--blue-bg);border:1px solid #93c5fd;color:var(--blue-ink);border-radius:10px;padding:12px 16px;font-size:15px;font-weight:500;margin-bottom:18px}
.outreach-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:start}
.form-group{margin:0 0 16px}
.form-group label{display:block;font-size:15px;font-weight:700;margin-bottom:6px;color:var(--ink)}
.form-input{width:100%;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:15px;line-height:1.5}
.form-input:focus{border-color:var(--focus);outline:2px solid var(--focus);outline-offset:0}
.form-input.textarea{min-height:100px;resize:vertical}
.form-input[readonly]{background:var(--surface-2)}
.form-hint{font-size:14px;color:var(--ink-2);margin:6px 0 0}
.checkbox-label{display:flex;align-items:flex-start;gap:10px;font-size:15px;color:var(--ink);margin:0 0 12px;line-height:1.45}
.checkbox-label input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--primary);flex-shrink:0}
.divider{height:1px;background:var(--line);margin:16px 0}
.contact-number{font-size:22px;font-weight:700;margin:6px 0 8px}
.tiny-title{display:block;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-2);margin:0 0 8px}
.compact-info{font-size:15px;color:var(--ink-2);margin:8px 0}
.compact-info strong{color:var(--ink)}
.note-review{background:var(--surface-2);border:1px solid var(--line);border-left:4px solid var(--ink-2);border-radius:8px;padding:10px 12px;font-size:14px;color:var(--ink);margin:12px 0}
.draft-box{width:100%;min-height:360px;border:1px solid var(--line-strong);border-radius:8px;padding:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;line-height:1.6;color:var(--ink);background:var(--surface);resize:vertical}
.draft-placeholder{text-align:center;border:2px dashed var(--line-strong);border-radius:10px;padding:24px 16px;font-size:15px;color:var(--ink-2);margin-bottom:14px}
.draft-placeholder svg{display:block;margin:0 auto 10px;width:26px;height:26px;color:var(--primary)}
.button-stack{display:flex;gap:10px;flex-wrap:wrap}
.button-stack .btn{flex:1}

/* ---------- Tasks + activity ---------- */
.task-list,.activity-list{padding:0 20px 8px}
.task-item,.activity-row{display:flex;gap:14px;align-items:flex-start;padding:16px 0;border-bottom:1px solid var(--line)}
.task-item:last-child,.activity-row:last-child{border-bottom:0}
.task-icon,.mini-icon{width:34px;height:34px;border-radius:8px;border:1px solid var(--line-strong);display:grid;place-items:center;flex-shrink:0;color:var(--ink-2);background:var(--surface)}
.task-icon.done{background:var(--green-bg);border-color:#86efac;color:var(--green-ink)}
.mini-icon svg,.task-icon svg{width:16px;height:16px}
.task-main{flex:1;min-width:0}
.task-main h3{font-size:16px;margin:0 0 4px}
.task-main p{font-size:14px;color:var(--ink-2);margin:0 0 6px}
.task-item .btn{align-self:center}
.task-outcome{margin-top:8px;background:var(--green-bg);color:var(--green-ink);border-radius:8px;padding:8px 10px;font-size:14px}
.activity-row strong{font-size:15px}
.activity-row p{font-size:14px;color:var(--ink-2);margin:4px 0 0}
.activity-row time{margin-left:auto;font-size:13px;color:var(--ink-2);white-space:nowrap}
.mini-list,.feed-summary{padding:0 20px 14px}
.mini-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.feed-line{display:flex;justify-content:space-between;font-size:14px;padding:6px 0}

/* ---------- Dialog + toast ---------- */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);max-width:min(560px,calc(100% - 32px));background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;font-size:15px;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:.2s;z-index:200}
#toast.visible{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.error{background:#991b1b}
dialog{border:0;border-radius:14px;padding:0;width:680px;max-width:calc(100vw - 32px);max-height:90vh;color:var(--ink);background:var(--surface);box-shadow:0 25px 70px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(17,24,39,.6)}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding:20px 22px;border-bottom:1px solid var(--line)}
.modal-head h2{font-size:21px;margin:0 0 4px}
.modal-head p{margin:0;font-size:15px;color:var(--ink-2)}
.modal-content{padding:20px 22px;overflow:auto}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:18px}
.guide-step{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.guide-step h3{font-size:16px;margin:0 0 2px}
.guide-step p{margin:0;font-size:15px;color:var(--ink-2)}
.guide-downloads{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.guide-note,.notice{font-size:14px;color:var(--ink-2)}
.guide-note{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.notice{margin-top:14px}
.score-total{font-size:40px;font-weight:800;color:var(--primary);margin-bottom:12px;display:flex;align-items:baseline;gap:8px}
.score-total span{font-size:16px;font-weight:500;color:var(--ink-2)}
.score-factor{display:grid;grid-template-columns:110px 1fr 56px;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.score-factor span{color:var(--ink-2)}
.score-factor b{text-align:right}
.error-message{margin-top:12px;background:var(--red-bg);color:var(--red-ink);border:1px solid #fca5a5;border-radius:8px;padding:10px 12px;font-size:15px}

@media (max-width:1000px){

  .detail-lower{grid-template-columns:1fr 1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
}

  .topbar-inner,.nav-inner,.content{padding-left:16px;padding-right:16px}
  .brand{width:100%}
  .top-actions{width:100%}

  .score-factor{grid-template-columns:80px 1fr 44px}
  .task-item{flex-wrap:wrap}
}

function queuePanel(full=false){const all=M.filter(P,state,ui),pg=M.paginate(all,ui.page,10),list=pg.items;return `<section class="panel"><div class="panel-header"><div><h2>${full?'All members':'Members to review'}</h2><p>Highest priority first. Click a score to see why.</p></div><button class="text-button" data-action="policy">Priority rules ${icon('help')}</button></div>${filters()}<div class="table-scroll"><table><thead><tr><th>Member</th><th>Why now</th><th>Priority</th><th>Due</th><th><span class="sr-only">Review</span></th></tr></thead><tbody>${list.length?list.map(p=>`<tr class="member-row"><td><div class="member-cell">${avatar(p)}<div><button class="member-name" data-nav="member/${p.member_id}">${E(p.name)}</button><div class="member-meta">${p.age} yrs · ${E(p.member_id)}</div></div></div></td><td><span class="reason-title">${E(p.short)}</span><span class="reason-meta">${E(p.trigger)} · ${E(M.owner(p,state)||'UNOWNED')} · ${openTasks(p.member_id).length} open task${openTasks(p.member_id).length===1?'':'s'}</span></td><td><button class="score-button" data-score="${p.member_id}" title="Explain ${p.name}’s priority">${badge(M.overdue(p,state)?'Overdue':M.band(p,state),M.overdue(p,state)?'red':M.band(p,state)==='P1'?'amber':'green')}<strong>${M.score(p,state.now,state)}</strong></button></td><td>${due(p.due_at)}</td><td><button class="row-arrow" data-nav="member/${p.member_id}" aria-label="Review ${E(p.name)}">${icon('arrow')}</button></td></tr>`).join(''):`<tr><td colspan="5"><div class="empty">${icon('search')}No members match these filters.<br><button class="text-button" data-action="clear-filters">Clear filters</button></div></td></tr>`}</tbody></table></div><div class="table-footer"><span>Showing ${list.length} of ${pg.total} members</span><span><button class="text-button" data-page="${pg.page-1}" ${pg.page===1?'disabled':''}>Previous</button> · ${pg.page}/${pg.pages} · <button class="text-button" data-page="${pg.page+1}" ${pg.page===pg.pages?'disabled':''}>Next</button> </span></div></section>`;}
function focusCard(){const p=M.ordered(P.filter(p=>M.can(p,state,'view')&&!['Closed','Transitioned'].includes(state.caseStatus[p.member_id])),state)[0];if(!p)return '<section class="focus-card"><div><div class="focus-label">Start here</div><h3>No active case for this role.</h3><p>Switch role in the header, or open Data & sync.</p></div></section>';return `<section class="focus-card"><div><div class="focus-label">Start here</div><h3>${E(p.name)} — ${E(p.attention)}</h3><p>${E(p.summary)}</p></div><button class="btn primary" data-nav="member/${p.member_id}">Open ${E(p.name)} ${icon('arrow')}</button></section>`;}
function dashboard(){const vis=P.filter(p=>M.can(p,state,'view')),active=vis.filter(p=>!['Closed','Transitioned'].includes(state.caseStatus[p.member_id])).length,today=vis.filter(p=>p.due_at.slice(0,10)===DATA.snapshot.slice(0,10)).length,open=state.tasks.filter(t=>t.status==='open'&&M.can(patient(t.memberId),state,'view')).length,done=state.tasks.filter(t=>t.status==='done'&&M.can(patient(t.memberId),state,'view')).length;return head('Today’s work','Five fictional members. Open the first case below, or pick any member from the queue.',`<button class="btn primary" data-action="new-task">${icon('plus')}New task</button>`)+`<div class="stats">${[[active,'Active cases','users',''],[today,'Due today','clock','highlight'],[open,'Open tasks','tasks',''],[done,'Tasks completed','check','']].map(([v,t,i,c])=>`<div class="stat ${c}"><div class="stat-head">${t}${icon(i)}</div><div class="stat-value">${v}</div></div>`).join('')}</div>${focusCard()}${queuePanel()}`;}
function memberHeader(p,outreach=false){return `<button class="back-button" data-nav="${outreach?'member/'+p.member_id:'queue'}">${icon('back')}${outreach?'Back to member':'Back to work queue'}</button><section class="panel member-banner"><div class="member-identity">${avatar(p,true)}<div><h1>${E(p.name)}</h1><p>${E(p.member_id)} · ${p.age} years · ${E(p.plan)}<br>${E(p.short)} · ${E(p.language)} · Owner: ${E(M.owner(p,state)||'UNOWNED')}</p><div class="member-chips">${badge(M.band(p,state)+(M.band(p,state)==='P1'?' · Today':' · Within 3 days'),M.band(p,state)==='P1'?'amber':'green')}<button class="text-button" data-score="${p.member_id}">${M.score(p,state.now,state)} points · explain</button>${state.bandOverrides[p.member_id]?badge('RN override','blue'):''}</div></div></div><div class="member-banner-right">${outreach?badge('Simulated outreach','blue'):`<button class="btn primary" data-nav="outreach/${p.member_id}">${icon('phone')}Prepare outreach</button>`}<small>Next action due ${E(fmt(p.due_at,'full'))} ET</small></div></section>`;}
function issue(p){return `<div class="alert">${icon(p.member_id==='SYN-004'?'shield':'alert')}<div><strong>${E(p.issue)}</strong><p>${E(p.issueDetail)}</p>${p.sourceRefs.slice(0,3).map(id=>sourceButton(id)).join(' ')}</div></div>`;}
function panel(title,sub,body,extra=''){return `<section class="panel"><div class="panel-header"><div><h2>${title}</h2>${sub?`<p>${sub}</p>`:''}</div>${extra}</div><div class="panel-body">${body}</div></section>`;}
function memberOverview(p){const acc=p.records['Care Access'][0],out=p.records['Outreach History'].at(-1),social=p.records.SDOH.at(-1),lab=p.records['Lab Results'];return `<div class="detail-grid">${panel('What matters now','Source-reported facts. Verify what has changed.',p.facts.map(([fact,id])=>`<div class="fact"><p>${E(fact)}</p>${sourceButton(id,'View '+id)}</div>`).join('')+`<div class="note-review">${E(p.sourceNote)}</div>`)}${panel('Recommended next action','Maria, RN · clinical decisions remain with the care team.',p.checks.map((step,i)=>`<div class="check-step"><span class="step-num">${i+1}</span><span>${E(step)}</span></div>`).join('')+`<div class="divider"></div><div class="button-stack"><button class="btn primary" data-nav="outreach/${p.member_id}">${icon('phone')}Prepare outreach</button><button class="btn" data-override="${p.member_id}">Review priority</button></div>`)}</div><div class="detail-lower"><section class="panel info-card"><h3>${icon('phone')}Contact & preferences</h3><p><strong>${E(p.contactState)}</strong><br>${E(p.channel)}<br>${E(p.contactWindow)} · ET</p>${sourceButton(out.record_id)}<p class="form-hint">${E(p.contactCaution)}</p><button class="text-button" data-action="opt-out">${state.optOut[p.member_id]?'Member outreach opted out · reconfirm':'Record member outreach opt-out'}</button></section><section class="panel info-card"><h3>${icon('calendar')}Care team & follow-up</h3><p><strong>${E(acc.provider_name)}</strong><br>${E(acc.provider_phone)}<br>${acc.appointment_at?E(fmt(acc.appointment_at,'full'))+' ET':'Appointment status unknown'}<br>${E(acc.appointment_status)}</p>${sourceButton(acc.record_id)}</section><section class="panel info-card"><h3>${icon('home')}Social needs & support</h3><p>${E(social.housing_or_support)}<br>${E(social.transport_or_mobility)}<br>${E(social.food_or_affordability)}</p>${sourceButton(social.record_id)}</section></div><div style="margin-top:19px">${panel('Recent labs & clinical context','Dates and units remain attached to every value.',(lab.length?lab.map(r=>`<div class="fact"><p>${E(r.test_name||r.status||'Lab availability')}: <strong>${E(r.value??'Unknown')} ${E(r.unit||'')}</strong> <span class="reason-meta">${E(fmt(r.source_observed_at))} · ${E(r.result_status||r.evidence_status)}</span></p>${sourceButton(r.record_id)}</div>`).join(''):'<p class="compact-info">No current lab results are supplied in this demo case. This is an information gap, not a normal result.</p>'))}</div>`;}
function medications(p){const rows=p.records['Clinical Records'];return panel('Medication statements','Source statements stay separate until reconciliation is confirmed.',`<div class="table-scroll"><table><thead><tr><th>Statement</th><th>Source</th><th>Date</th><th>Evidence</th></tr></thead><tbody>${rows.map(r=>`<tr><td><span class="reason-title">${E(r.medication_statement)}</span> ${badge(M.medicationState(r),r.med_change_type==='Unexplained discrepancy'?'amber':'gray')}<span class="reason-meta">${E(r.clinical_context)}</span></td><td>${E(r.document_type)}</td><td>${E(fmt(r.source_observed_at))}</td><td>${sourceButton(r.record_id)}</td></tr>`).join('')}</tbody></table></div><div class="note-review">${E(p.sourceNote)} The workbench does not select a dose or change treatment.</div>`)+`<div style="margin-top:20px">${panel('Dispensing history','A paid dispense does not establish ingestion.',(p.records.Pharmacy.length?p.records.Pharmacy.map(r=>`<div class="fact"><p><strong>${E(r.drug||'No current dispensing record')}</strong> ${E(r.strength||'')} · ${E(r.days_supply??'Unknown')} days’ supply<br><span class="reason-meta">${E(r.transaction_status||r.evidence_status)} · ${E(fmt(r.source_observed_at))}</span></p>${sourceButton(r.record_id)}</div>`).join(''):'<p class="compact-info">No dispensing records are supplied in this demo case. Do not infer medication use or nonuse.</p>'))}</div>`;}
function timeline(p){const rs=records(p).filter(x=>['Hospital ADT','Clinical Records','Outreach History','Care Access','Services and Auth'].includes(x.group)).sort((a,b)=>new Date(b.r.source_observed_at)-new Date(a.r.source_observed_at));return `<section class="panel"><div class="panel-header"><div><h2>Member timeline</h2><p>Event time and receipt time are shown separately.</p></div></div><div class="timeline">${rs.map(({group,r})=>`<div class="timeline-item"><h3>${E(r.document_type||r.event_type||r.channel||r.service||group)} ${r.event_handling?.startsWith('Duplicate')?badge('Duplicate · no second task','gray'):''}</h3><p>${E(r.reason||r.notes||r.clinical_context||r.fulfillment_status||r.appointment_status||'Source record')}<br>Event / observed: ${E(fmt(r.source_observed_at,'full'))} ET · Received: ${E(fmt(r.ingested_at,'full'))} ET</p>${sourceButton(r.record_id)}</div>`).join('')}</div></section>`;}
function sources(p){const rs=records(p).filter(x=>ui.sourceGroup==='all'||x.group===ui.sourceGroup);return `<div class="panel-header" style="padding:0 0 18px"><div><h2>Evidence library <span class="inline-count">${records(p).length} records</span></h2><p>Inspect the original source fields before making a decision.</p></div><select class="select" id="source-group" aria-label="Filter source records"><option value="all">All datasets</option>${Object.keys(p.records).map(k=>`<option ${ui.sourceGroup===k?'selected':''}>${E(k)}</option>`).join('')}</select></div><div class="records-grid">${rs.map(({group,r})=>`<article class="record-card"><header><span class="record-id">${E(r.record_id)}</span>${badge(r.evidence_state||'Unknown',r.evidence_state==='Conflicting'?'amber':r.evidence_state==='Confirmed'?'green':r.evidence_state==='Single-source'?'blue':'gray')}</header><h3>${E(r.document_type||r.event_type||r.test_name||r.service||group)}</h3>${r.feed_state==='Unavailable'?badge('Feed down','red'):r.feed_state==='Stale'?badge('Stale feed','amber'):''}<p>${E(group)}<br>Observed ${E(fmt(r.source_observed_at,'full'))} ET<br>Received ${E(fmt(r.ingested_at,'full'))} ET</p><button class="text-button" data-source="${E(r.record_id)}">Inspect record ${icon('arrow')}</button></article>`).join('')}</div>`;}
function tasksList(tasks){return tasks.length?`<div class="task-list">${tasks.map(t=>{const p=patient(t.memberId);return `<article class="task-item"><span class="task-icon ${t.status==='done'?'done':''}">${icon(t.status==='done'?'check':'tasks')}</span><div class="task-main"><h3>${E(t.label)}</h3><p><button class="text-button" data-nav="member/${p.member_id}">${E(p.name)}</button> · ${E(t.owner)} · ${E(fmt(t.due,'full'))} ET</p>${badge(t.status==='done'?'Completed':M.deadlineBucket(t.due,state.now),t.status==='done'?'green':M.deadlinePoints(t.due,state.now)===3?'amber':'gray')}${t.outcome?`<div class="task-outcome"><strong>Completion evidence:</strong> ${E(t.outcome)}</div>`:''}</div>${t.status==='open'?`<button class="btn small" data-complete="${E(t.id)}">${icon('check')}Complete</button>`:`<button class="text-button" data-reopen="${E(t.id)}">Reopen</button>`}</article>`;}).join('')}</div>`:`<div class="empty">${icon('check')}No tasks in this view. Switch to the assigned RN to inspect clinical work.</div>`;}
function careplan(p){const cp=p.records['Care Plan'][0],notes=state.notes.filter(n=>n.memberId===p.member_id);return `<div class="detail-grid">${panel('Care goal','The case stays open until an RN confirms the outcome.',`<div class="fact"><p>${E(state.assessments[p.member_id]?.memberGoal||cp.case_goal)}</p>${sourceButton(cp.record_id)}</div><p class="compact-info">${E(cp.member_goal_status)}<br>Closure: ${E(cp.closure_criteria)}</p>`)}${panel('Documentation','Signed demo notes are retained as separate records.',notes.length?notes.map(n=>`<div class="fact"><p>${E(n.status)} · ${E(state.syncQueue.find(q=>q.noteId===n.id)?.status||'Pending')} · ${E(n.route)}<br><span class="reason-meta">${E(fmtSession(n.signedAt))} IST · ${E(n.signedBy)}</span></p><button class="text-button" data-note="${E(n.id)}">Read signed note ${icon('arrow')}</button></div>`).join(''):'<p class="compact-info">No signed demo notes yet. Prepare outreach to create a reviewed note.</p>')}</div><section class="panel" style="margin-top:20px"><div class="panel-header"><div><h2>Owned follow-up tasks</h2><p>A completed task does not automatically close the clinical case.</p></div><button class="btn small" data-new-task="${p.member_id}">${icon('plus')}Add task</button></div>${tasksList(state.tasks.filter(t=>t.memberId===p.member_id))}</section>`;}
function member(p,tab){const tabs=[['overview','Overview'],['meds','Medications'],['timeline','Timeline'],['sources','Source records'],['assessment','Assessment'],['plan','Care plan & notes'],['closure','Close / transition']];return memberHeader(p)+issue(p)+`<nav class="member-tabs" aria-label="Member views">${tabs.map(([k,t])=>`<button class="member-tab ${k===tab?'active':''}" data-nav="member/${p.member_id}/${k}">${t}</button>`).join('')}</nav>`+({overview:()=>memberOverview(p),meds:()=>medications(p),timeline:()=>timeline(p),sources:()=>sources(p),plan:()=>careplan(p),assessment:()=>assessmentPage(p),closure:()=>closurePage(p)}[tab]||(()=>memberOverview(p)))();}
function session(p){if(!sessions[p.member_id])sessions[p.member_id]={route:p.route,outcome:'preparation',findings:'',plan:p.monday_action,permission:false,privacy:false,draftText:'',revision:0,draftRevision:-1};return sessions[p.member_id];}
function outreach(p){const en=session(p),acc=p.records['Care Access'][0],phone=en.route==='Facility team'?'216-555-0133':en.route==='PCP team'?acc.provider_phone:p.member_id==='SYN-005'&&en.route==='Caregiver'?'216-555-0106':p.phone;const outcomes=en.route==='Neutral callback'?[['preparation','Preparation only'],['callback','Neutral callback requested'],['unreached','No contact']]:[['preparation','Preparation only'],['connected','Connected with selected recipient'],['unreached','No contact'],['voicemail','Voicemail, where permitted']];return memberHeader(p,true)+`<div class="outreach-banner">${icon('shield')}V1 simulation · no calls/messages or external writeback · <button class="text-button" data-action="manual-note">Start a manual note</button></div><div class="outreach-grid">${panel('Contact plan','Use a working, permitted route.',`<span class="tiny-title">${E(en.route)} · ${E(p.language)}</span><div class="contact-number">${E(phone)}</div>${badge(p.contactState,p.member_id==='SYN-003'?'red':p.member_id==='SYN-004'?'amber':'green')}<p class="compact-info">Preferred window: ${E(p.contactWindow)} ET</p><div class="divider"></div><div class="form-group"><label for="contact-route">Contact route</label><select id="contact-route" class="form-input" data-session="route">${M.routes(p).map(v=>`<option ${en.route===v?'selected':''}>${E(v)}</option>`).join('')}</select></div><div class="note-review">${E(p.contactCaution)}</div>${p.member_id==='SYN-003'?'<p class="form-hint">Member number 216-555-0103 is blocked in this prototype. The treating-facility verification route is selected.</p>':''}${en.route==='Neutral callback'?'<div class="note-review"><strong>Suggested neutral message</strong><br>Please ask Pranav to call Maria at 216-555-0190. No clinical details.</div>':''}<label class="checkbox-label"><input type="checkbox" data-session="permission" ${en.permission?'checked':''}>I have checked identity, contact permission and disclosure scope for this simulated interaction.</label>${en.route==='Private member callback'?`<label class="checkbox-label"><input type="checkbox" data-session="privacy" ${en.privacy?'checked':''}>The member is on a private callback and can speak safely.</label>`:''}<div class="divider"></div><div class="tiny-title">Previous contact evidence</div>${p.records['Outreach History'].map(r=>`<div class="fact"><p class="compact-info">${E(fmt(r.source_observed_at))} · ${E(r.outcome)}</p>${sourceButton(r.record_id)}</div>`).join('')}`)}${panel('Conversation & assessment','Capture only what was actually verified.',`<div class="form-group"><label for="outcome">Contact outcome</label><select id="outcome" class="form-input" data-session="outcome">${outcomes.map(([v,t])=>`<option value="${v}" ${en.outcome===v?'selected':''}>${t}</option>`).join('')}</select><p class="form-hint">“Preparation only” does not record a successful contact or completed assessment.</p></div><div class="form-group"><label for="findings">New findings / RN-entered context</label><textarea id="findings" class="form-input textarea" data-session="findings" placeholder="What did you verify? Leave unknown information unresolved.">${E(en.findings)}</textarea></div><div class="form-group"><label for="follow-plan">Proposed follow-up</label><textarea id="follow-plan" class="form-input textarea" data-session="plan">${E(en.plan)}</textarea></div><div class="tiny-title">Source context</div>${p.facts.map(([t,id])=>`<div class="fact"><p class="compact-info">${E(t)}</p>${sourceButton(id)}</div>`).join('')}`)}${panel('Structured documentation','Template-first · optional AI is not connected.',en.draftText?`<textarea id="note-draft" class="draft-box" aria-label="Editable note draft" data-session="draftText">${E(en.draftText)}</textarea><div class="note-review" id="draft-state">${en.draftRevision===en.revision&&en.sourceVersion===state.systems.sourceVersion?'Draft ready for RN review. Check every statement before saving.':'Inputs changed. Regenerate the draft before review.'}</div><div class="button-stack"><button class="btn" data-action="draft">${icon('spark')}Regenerate</button><button id="review-draft" class="btn primary" data-action="review-note" ${en.draftRevision!==en.revision||en.sourceVersion!==state.systems.sourceVersion?'disabled':''}>Review & save</button></div>`:`<div class="draft-placeholder">${icon('spark')}A draft will appear here after you confirm the contact scope.<br>Sources and unknowns stay visible.</div><button class="btn primary" style="width:100%" data-action="draft">${icon('spark')}Prepare template</button><p class="form-hint">Preparation notes can be drafted before a call. Contact findings are never invented.</p>`)} </div>`;}
function taskPage(){const list=state.tasks.filter(t=>M.can(patient(t.memberId),state,'view')).filter(t=>ui.taskFilter==='all'||t.status===ui.taskFilter).sort((a,b)=>new Date(a.due)-new Date(b.due));return head('Follow-up tasks','Keep the next step owned, scheduled and supported by evidence.',`<button class="btn primary" data-action="new-task">${icon('plus')}New task</button>`)+`<section class="panel"><div class="panel-header"><div><h2>Your task list</h2><p>Deadlines use 1-, 3-, 5- and 10-day calendar buckets.</p></div><div class="filter-tabs">${[['open','Open'],['done','Completed'],['all','All']].map(([k,t])=>`<button class="filter-tab ${ui.taskFilter===k?'active':''}" data-task-filter="${k}">${t}</button>`).join('')}</div></div>${tasksList(list)}</section><div style="margin-top:20px">${handoverPanel()}</div>`;}
function activityPage(){const base=[{title:'Five fictional cases ready for review',detail:'Unique member IDs and source records loaded for the Monday snapshot.',at:DATA.snapshot},{title:'Daily deadline policy applied',detail:'Within 1 / 3 / 5 / 10 calendar days. Pranav has a BH verification floor; Mmridul100, Vraj90 and Shruti90 follow. Overdue work is pinned within band.',at:DATA.snapshot},{title:'Duplicate discharge alert grouped',memberId:'SYN-001',detail:'ADT-001A and ADT-001B represent one event; no duplicate task.',at:'2026-10-30T14:07:00-04:00'}];return head('Activity log','See what changed, who acted and what still needs follow-up.')+`<section class="panel"><div class="panel-header"><div><h2>Traceable actions</h2><p>Local demo activity is separate from the historical source evidence.</p></div>${badge('Saved in this browser','green')}</div><div class="activity-list">${[...state.activity,...base].filter(a=>!a.memberId||M.can(patient(a.memberId),state,'view')).map(a=>`<article class="activity-row"><span class="mini-icon">${icon('activity')}</span><div><strong>${E(a.title)}</strong><p>${a.actor?E(a.actor)+' · V1 · ':''}${a.memberId?`${E(patient(a.memberId).name)} · `:''}${E(a.detail)}</p></div><time>${a.id?E(fmtSession(a.at))+' IST':E(fmt(a.at,'full'))+' ET'}</time></article>`).join('')}</div></section>`;}
function render(){const r=route();let body=r.page==='dashboard'?dashboard():r.page==='queue'?head('Your work queue','Choose the next member with a clear reason and a practical next action.',`<button class="btn" data-action="policy">${icon('help')}Priority policy</button><button class="btn primary" data-action="new-task">${icon('plus')}New task</button>`)+queuePanel(true):r.page==='member'?member(patient(r.id),r.tab):r.page==='outreach'?outreach(patient(r.id)):r.page==='team'?teamPage():r.page==='operations'?operationsPage():r.page==='tasks'?taskPage():r.page==='activity'?activityPage():dashboard();if(['member','outreach'].includes(r.page)&&!M.can(patient(r.id),state,'view'))body=accessPage(patient(r.id));if(r.page==='outreach'&&!M.can(patient(r.id),state,'write'))body=accessPage(patient(r.id));if(state.systems.loading&&['dashboard','queue'].includes(r.page))body=head('Loading evidence…','Simulated loading state; no member data has been replaced.')+'<section class="panel empty">Loading the work queue.<br><button class="btn" data-action="stop-loading">Finish loading</button></section>';document.getElementById('app').innerHTML=shell(body);document.title=(r.page==='member'||r.page==='outreach'?patient(r.id).name+' · ':'')+'Care Workbench · HiLabs';}
function toast(text,error=false){const el=document.getElementById('toast');el.textContent=text;el.className='visible'+(error?' error':'');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.className='',4500);}
function modal(title,sub,body){const d=document.getElementById('modal');d.innerHTML=`<div class="modal-head"><div><h2 id="dialog-title">${title}</h2><p>${sub}</p></div><button class="icon-button" data-action="close-modal" aria-label="Close dialog">${icon('close')}</button></div><div class="modal-content">${body}</div>`;d.showModal();}
function close(){document.getElementById('modal').close();}
function errorInModal(message){if(!document.getElementById('modal').open||!document.querySelector('.modal-content'))return toast(message,true);let el=document.getElementById('modal-error');if(!el){el=document.createElement('div');el.id='modal-error';el.className='error-message';document.querySelector('.modal-content').appendChild(el);}el.textContent=message;}
function scoreModal(p){const c=p.queue_components,d=M.deadlinePoints(p.due_at,state.now);modal('Why '+E(p.name)+' is here','Operational ordering points · reviewed by the care team.',`<div class="score-total">${M.score(p,state.now,state)}<span>/ 100 points</span></div>${[['Urgency',p.reason,c.urgency+' / 4'],['Deadline',M.deadlineBucket(p.due_at,state.now)+' · '+fmt(p.due_at,'full')+' ET',d+' / 3'],['Barriers',c.barrier===2?'Multiple barriers or an unresolved medication/support conflict.':'One material access barrier.',c.barrier+' / 2'],['New case',c.new_case?'Open transition awaiting completed assigned plan-RN review.':'Existing ongoing case.',c.new_case+' / 1']].map(([a,b,c])=>`<div class="score-factor"><strong>${a}</strong><span>${E(b)}</span><b>${c}</b></div>`).join('')}<div class="notice"><strong>10 × (urgency + deadline + barriers + new case)</strong><br>Band → overdue pin → BH verification floor → points → exact due time. Points are not a probability of harm. A serious safety concern follows the plan’s escalation procedure.</div><div class="modal-actions"><button class="btn" data-action="policy">View deadline rules</button><button class="btn primary" data-override="${p.member_id}">RN override</button></div>`);}
function policyModal(){modal('A priority you can explain','Calendar-day buckets · current demo clock is explicit.',`<p class="compact-info">An urgent safety concern follows the plan’s escalation procedure before queue sorting. The demo uses P1 for same-day review and P2 for action within three days.</p><table><thead><tr><th>Action due</th><th>Deadline points</th></tr></thead><tbody>${[['Within 1 day',3],['More than 1, up to 3 days',2],['More than 3, up to 5 days',1],['More than 5, up to 10 days',0]].map(([a,b])=>`<tr><td>${a}</td><td>${b}</td></tr>`).join('')}</tbody></table><p class="notice">Zero means no extra deadline boost. Work beyond ten days stays planned; missing deadlines require verification. Exact due times break ties. These are proposed plan rules, not a universal clinical standard.</p><div class="note-review">Pranav: 100 (BH floor) · Mmridul: 100 · Vraj: 90 · Shruti: 90 · Shlok: 50.<br>N means an open transition awaiting completed plan-RN review. Overdue is a separate pinned state; maximum score stays 100.</div>`);}
function recordModal(id){const f=findRecord(id);if(f&&!M.can(f.p,state,'view'))return toast('Source access is not permitted for this demo role.',true);if(!f)return toast('Source record not found.',true);const {p,group,r}=f;const skip=['record_id','member_id','source_observed_at','ingested_at','source_as_of','source','freshness_note','imperfection_id'];const labels=s=>s.replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase());modal(E(id)+' · '+E(p.name),E(group)+' · '+E(r.source),`${badge(r.evidence_state||'Unknown',r.evidence_state==='Conflicting'?'amber':'gray')}<div class="record-clocks"><div><small>Event / source observed</small>${E(fmt(r.source_observed_at,'full'))} ET</div><div><small>Received by workbench</small>${E(fmt(r.ingested_at,'full'))} ET</div></div><dl class="record-fields">${Object.entries(r).filter(([k])=>!skip.includes(k)).map(([k,v])=>`<div class="record-field ${String(v).length>75?'wide':''}"><dt>${E(labels(k))}</dt><dd>${E(v===''?'Unknown / not supplied':v)}</dd></div>`).join('')}</dl><p class="notice">Source snapshot: ${E(fmt(r.source_as_of,'full'))} ET. ${E(r.freshness_note||'')}<br>Fictional source record. Source-reported data is not automatically clinician-confirmed.</p>`);}
function newTaskModal(id){modal('Create a follow-up task','Give the next action a member, an owner and a due time.',`<form data-form="task"><div class="form-group"><label for="task-member">Member</label><select class="form-input" id="task-member" name="memberId">${P.map(p=>`<option value="${p.member_id}" ${p.member_id===id?'selected':''}>${E(p.name)} · ${E(p.member_id)}</option>`).join('')}</select></div><div class="form-group"><label for="task-label">Next action</label><input class="form-input" id="task-label" name="label" placeholder="e.g. Confirm the first home-health visit" required maxlength="240"></div><div class="form-group"><label for="task-due">Due date and time · Eastern time</label><input class="form-input" id="task-due" name="due" type="datetime-local" value="2026-11-03T10:00" min="2026-11-02T08:00" required></div><div class="form-group"><label for="task-owner">Owner</label><input class="form-input" id="task-owner" name="owner" value="${E(M.owner(patient(id),state)||'')}" readonly required maxlength="80"></div><div class="modal-actions"><button type="button" class="btn" data-action="close-modal">Cancel</button><button class="btn primary" type="submit">Create task</button></div></form>`);}
function completeModal(id){const t=state.tasks.find(t=>t.id===id);if(!t)return;modal('Confirm task completion',E(patient(t.memberId).name)+' · '+E(t.label),`<form data-form="complete" data-id="${E(id)}"><div class="form-group"><label for="task-outcome">What was completed, and how was it verified?</label><textarea class="form-input textarea" id="task-outcome" name="outcome" placeholder="Record the actual outcome and confirming source." required></textarea></div><label class="checkbox-label"><input type="checkbox" name="verified" required>I verified the completion evidence. An approval or referral alone does not establish delivery.</label><p class="form-hint">This completes the selected task. The clinical case and other unresolved needs stay open.</p><div class="modal-actions"><button type="button" class="btn" data-action="close-modal">Cancel</button><button class="btn primary" type="submit">Complete task</button></div></form>`);}

function reviewModal(){const p=patient(route().id),en=session(p);if(en.draftRevision!==en.revision||en.sourceVersion!==state.systems.sourceVersion||en.sourceVersion!==state.systems.sourceVersion)return toast('Inputs changed. Regenerate the draft before review.',true);const error=M.validateEncounter(p,en,state);if(error)return toast(error,true);modal('Review before saving','A signed demo note is saved locally. No external clinical record is changed.',`<form data-form="sign" data-id="${p.member_id}"><textarea class="draft-box" aria-label="Note for final review" readonly style="min-height:310px">${E(en.draftText)}</textarea><div class="divider"></div><label class="checkbox-label"><input type="checkbox" name="reviewed" required>I reviewed the source facts, unknowns, contact outcome and RN-entered findings.</label><label class="checkbox-label"><input type="checkbox" name="task">Also create the proposed follow-up as an owned task, due ${E(fmt(p.due_at,'full'))} ET.</label><div class="modal-actions"><button type="button" class="btn" data-action="close-modal">Keep editing</button><button class="btn primary">Sign demo note</button></div></form>`);}
function guide(){modal('V1 workflow guide','Five fictional stress cases · role-aware local demonstration.',`${[['1','Review the team queue','The initial role is Team lead. Pranav has the BH review floor. Click points to inspect the current policy.'],['2','Work as the assigned RN','Use the role selector: Maria owns Mmridul/Shruti, Rohan owns Shlok, Nia owns Vraj and Asha owns Pranav.'],['3','Inspect and assess','Open source records, then Assessment. Save current findings, the member goal and evidence; unknowns stay open.'],['4','Prepare truthful documentation','For Vraj, verify the facility setting first. Confirm contact scope, choose the real simulated outcome, then prepare a source template or manual note.'],['5','Sign and acknowledge','Review the note. Data & sync shows pending/failed artifacts, same-key retry and a simulated destination receipt.'],['6','Complete or transfer work','Tasks require evidence. Team review requests cover; switch to the receiving RN to accept it.'],['7','Check closure','Close / transition lists what still blocks completion. A phone call, signed note or service authorization alone is insufficient.'],['8','Try degraded states','Data & sync can advance the clock to 12:30, pause optional assistance, revise the source version or show loading. Try an empty search and unowned-P1 cover too.']].map(([n,t,b])=>`<div class="guide-step"><span class="step-num">${n}</span><div><h3>${t}</h3><p>${b}</p></div></div>`).join('')}<div class="guide-downloads"><a class="btn" href="#" data-action="save-html">${icon('download')}Standalone HTML V1</a></div><div class="guide-note">Template-first: no external LLM, call, message, identity merge or CM write occurs. Roles, receipts and failure controls are simulations. All data is fictional; browser-local roles are not production authorization. Unsaved forms stay in this tab. Clinical scenario times are Eastern; actual saved-action times display IST.</div><div class="modal-actions"><button class="btn danger" data-action="reset">Reset V1 demo</button><button class="btn primary" data-action="start-tour">Work as Maria · Mmridul ${icon('arrow')}</button></div>`);}
