<title>Care Workbench</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Clickable concept prototype for the HiLabs APM case 2026–27: an explained work queue, Member 360 with conflict resolution, and notes-to-assessment drafting for five fictional members.">

<style>
/* Layout: navy→indigo app bar (deck cover) + Decide/Know/Do tabs; 1240px column.
   Queue = triage rows with trigger + next action, "why" pane. Member 360 = issue → resolve → contact strip → evidence.
   Call = notes left, 40-field assessment right (yellow = pending until Approve & Submit). */
:root{
  --navy:#121957;--navy-deep:#0B0F3F;--indigo:#381E8C;
  --blue:#0053EF;--blue-ink:#0A3FB8;--blue-50:#EDF2FE;--blue-25:#F6F8FE;
  --violet:#603CE4;--violet-ink:#4A2BBE;--violet-50:#EFEBFD;
  --red:#981A1A;--red-50:#FDF1F1;--red-100:#FDE1E1;--red-line:#F2A7A7;
  --amber-50:#FDF2C6;--amber-ink:#5F3B00;--amber-line:#E7B53C;--amber-dot:#9A5B00;--pending:#FFF4B8;
  --green-50:#DBFBE6;--green-ink:#14532D;--green-line:#7AD69C;
  --ink:#0E1440;--ink-2:#3B4266;--line:#D6DDF3;--line-2:#AEB8DA;
  --bg:#F6F8FE;--surface:#FFFFFF;--on-dark:#FFFFFF;--on-dark-2:#C9D1F4;
  --display:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ring:0 0 0 3px var(--surface),0 0 0 6px var(--violet);
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--display)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--navy-deep)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
h1,h2,h3,h4{margin:0;text-wrap:balance}
table{font-size:inherit}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tnum{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}

/* ---------- App bar ---------- */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30}
.bar{background:linear-gradient(100deg,var(--navy-deep) 0%,var(--navy) 55%,var(--indigo) 100%);color:var(--on-dark)}
.bar .wrap{display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;color:var(--on-dark);text-decoration:none;margin-right:auto}
.brand b{font-weight:800;font-size:17px;letter-spacing:-.2px}
.brand small{display:block;font-size:11px;font-weight:600;color:var(--on-dark-2);letter-spacing:.3px}
.mark{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--blue);color:var(--on-dark);font-weight:800;font-size:13px}
.who{font-size:14px;color:var(--on-dark-2)}
.who strong{color:var(--on-dark)}
.clock{font-size:13px;font-weight:700;padding:5px 11px;border-radius:999px;border:1px solid var(--on-dark-2)}
.demo-btn{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--on-dark);color:var(--navy);font-weight:800;font-size:14px;padding:7px 14px;border-radius:999px}
.demo-btn:hover{background:var(--blue-50)}
.demo-btn i{font-style:normal;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--violet);color:var(--on-dark);font-size:11px}
.tabs{background:var(--surface);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:2px;overflow-x:auto}
.tab{display:flex;align-items:center;gap:8px;padding:12px 14px 10px;border-bottom:3px solid transparent;text-decoration:none;color:var(--ink-2);font-weight:700;white-space:nowrap}
.tab:hover{color:var(--ink);background:var(--blue-25)}
.tab.on{color:var(--ink);border-bottom-color:var(--blue)}
.tab .ctx{font-weight:600;color:var(--ink-2)}
.tag{font-size:11px;font-weight:800;letter-spacing:.8px;padding:2px 8px;border-radius:6px;color:var(--on-dark)}
.tag-decide{background:var(--violet)}.tag-know{background:var(--blue)}.tag-do{background:var(--navy)}

main{padding-block:22px 48px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 20px;flex-wrap:wrap;margin-bottom:18px}
.head h1{font-size:30px;line-height:1.15;letter-spacing:-.5px}
.head p{margin:6px 0 0;color:var(--ink-2);max-width:70ch}
.kicker{display:flex;gap:8px;align-items:center;font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--ink-2);margin-bottom:8px}

/* ---------- Shared pieces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0}
.ch{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px 10px;padding:13px 16px;border-radius:13px 13px 0 0;font-weight:800;font-size:16px}
.ch.navy{background:var(--navy);color:var(--on-dark)}
.ch.blue{background:var(--blue);color:var(--on-dark)}
.ch.violet{background:var(--violet);color:var(--on-dark)}
.ch.plain{border-bottom:1px solid var(--line)}
.ch small{font-size:12px;font-weight:700;color:var(--on-dark-2)}
.ch.blue small,.ch.violet small{color:var(--on-dark)}
.ch.plain small{color:var(--ink-2)}
.cb{padding:14px 16px 16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:700;font-size:14px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--navy);background:var(--blue-25)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--on-dark)}
.btn.primary:hover{background:var(--blue-ink)}
.btn.ai{background:var(--violet);border-color:var(--violet);color:var(--on-dark)}
.btn.ai:hover{background:var(--violet-ink)}
.btn.ok{background:var(--green-ink);border-color:var(--green-ink);color:var(--on-dark)}
.btn.big{padding:13px 22px;font-size:16px;border-radius:12px}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45}
.btn.primary:disabled:hover{background:var(--blue)}.btn.ai:disabled:hover{background:var(--violet)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hint{font-size:13px;color:var(--ink-2)}
.src{white-space:nowrap;display:inline-flex;align-items:center;gap:3px;font-family:var(--mono);font-size:12px;font-weight:600;color:var(--blue-ink);background:var(--surface);border:1px solid var(--line-2);border-radius:6px;padding:1px 7px;line-height:1.6}
.src::before{content:"↗";font-family:var(--display);font-weight:800}
.src:hover{background:var(--blue-50);border-color:var(--blue)}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;border-radius:6px;padding:1px 8px;white-space:nowrap;border:1px solid}
.st b{font-size:13px}
.st-ok{background:var(--green-50);color:var(--green-ink);border-color:var(--green-line)}
.st-single{background:var(--blue-50);color:var(--blue-ink);border-color:var(--line-2)}
.st-conflict{background:var(--amber-50);color:var(--amber-ink);border-color:var(--amber-line)}
.st-unknown{background:var(--surface);color:var(--ink);border-color:var(--line-2);border-style:dashed}
.fr{font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;white-space:nowrap;border:1px solid var(--line)}
.fr-fresh{color:var(--green-ink)}
.fr-lag{color:var(--ink-2)}
.fr-stale{color:var(--amber-ink);background:var(--amber-50);border-color:var(--amber-line)}
.fr-down,.fr-missing{color:var(--red);background:var(--red-50);border-color:var(--red-line)}
.prov{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:5px;font-size:12px;color:var(--ink-2)}
.prov b{color:var(--ink);font-weight:700}
.score{display:inline-grid;place-items:center;min-width:48px;padding:4px 9px;border-radius:9px;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;border:1px solid}
.sc-hi{background:var(--red-100);color:var(--red);border-color:var(--red-line)}
.sc-md{background:var(--amber-50);color:var(--amber-ink);border-color:var(--amber-line)}
.sc-lo{background:var(--blue-50);color:var(--navy);border-color:var(--line-2)}
.av{display:grid;place-items:center;flex-shrink:0;width:40px;height:40px;border-radius:50%;font-weight:800;color:var(--on-dark)}
.av-hi{background:var(--red)}.av-md{background:var(--amber-dot)}.av-lo{background:var(--violet)}
.av.lg{width:56px;height:56px;font-size:22px}
.pill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--blue-50);color:var(--navy)}
.spot{box-shadow:var(--ring)!important;border-radius:14px}
.trig{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;font-weight:800;border-radius:8px;padding:4px 9px;color:var(--on-dark);letter-spacing:.2px}
.trig-adt{background:var(--navy)}.trig-rx{background:var(--violet)}
.trig .k{font-size:11px;letter-spacing:.8px;color:var(--on-dark-2)}
.trig .age{font-weight:600;color:var(--on-dark-2)}
.trig-rx .k,.trig-rx .age{color:var(--on-dark)}
.flag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;border-radius:7px;padding:2px 8px;border:1px solid;white-space:nowrap}
.flag.risk{background:var(--red-50);color:var(--red);border-color:var(--red-line)}
.flag.warn{background:var(--amber-50);color:var(--amber-ink);border-color:var(--amber-line)}
.flag.ok{background:var(--green-50);color:var(--green-ink);border-color:var(--green-line)}
.nba{display:block;margin-top:6px;font-size:14px;font-weight:800;color:var(--blue-ink)}
.nba::before{content:"Next ▸ ";color:var(--violet)}

/* ---------- Queue ---------- */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.tile{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.tile .n{flex-shrink:0;display:grid;place-items:center;min-width:48px;height:48px;padding:0 8px;border-radius:999px;font-size:20px;font-weight:800;color:var(--on-dark);background:var(--blue);font-variant-numeric:tabular-nums}
.tile .l{font-size:14px;font-weight:600;line-height:1.3}
.tile.hot{background:var(--red-50);border-color:var(--red-line)}
.tile.hot .n{background:var(--red)}
.tile.v .n{background:var(--violet)}
.tile.k .n{background:var(--navy)}
.qgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:14px 16px 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.chip:hover{border-color:var(--navy)}
.chip span{margin-left:5px;font-variant-numeric:tabular-nums}
.chip.on{background:var(--navy);border-color:var(--navy);color:var(--on-dark)}
.search{display:flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:10px;padding:7px 10px;background:var(--surface);flex:0 1 230px;min-width:0}
.search input{border:0;outline:0;background:transparent;width:100%;min-width:0;font-size:14px}
.search input::placeholder{color:var(--ink-2)}
.sortnote{padding:0 16px 10px;font-size:13px;color:var(--ink-2)}
.sortnote b{color:var(--ink)}
.qhead,.qrow{display:grid;grid-template-columns:60px minmax(0,150px) minmax(0,1fr) 84px;gap:12px;align-items:center;padding:12px 16px}
.qhead{font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--on-dark);background:var(--navy)}
.qrow{width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:var(--surface);border-left:4px solid transparent;padding-left:12px}
.qrow:last-child{border-bottom:0;border-radius:0 0 14px 14px}
.qrow:hover{background:var(--blue-25)}
.qrow[aria-pressed="true"]{background:var(--blue-50);border-left-color:var(--blue)}
.qrow .score{align-self:start}
.qn strong{display:block;font-size:16px}
.qn small{display:block;font-size:13px;color:var(--ink-2);font-weight:500}
.qt{display:grid;gap:6px;min-width:0}
.qt .flags{display:flex;gap:5px;flex-wrap:wrap}
.qd{text-align:right;font-weight:800;font-variant-numeric:tabular-nums;align-self:start}
.qd small{display:block;font-size:12px;font-weight:600;color:var(--ink-2)}
.empty{padding:28px 16px;text-align:center;color:var(--ink-2)}
.pane{position:sticky;top:calc(env(safe-area-inset-top,0px) + 124px)}
.ptop{display:flex;gap:12px;align-items:center}
.ptop h2{font-size:20px}
.ptop .sub{font-size:13px;color:var(--on-dark-2)}
.sect{font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--ink-2);margin:16px 0 8px}
.bars{display:grid;gap:8px}
.bl{display:grid;grid-template-columns:96px minmax(0,1fr) 56px;gap:10px;align-items:center;font-size:13px;font-weight:700}
.bl .tr{height:10px;border-radius:5px;background:var(--blue-50);overflow:hidden}
.bl .fi{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--blue),var(--violet))}
.bl b{text-align:right;font-variant-numeric:tabular-nums}
.why{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:5px;font-size:13px;color:var(--ink-2)}
.why b{color:var(--ink)}
.tie{margin-top:10px;font-size:13px;font-weight:700;color:var(--violet-ink);background:var(--violet-50);border-radius:9px;padding:8px 10px}
.acts{display:grid;gap:8px}
.act{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.act-t{display:block;font-weight:700;font-size:14px}
.act-d{font-size:13px;color:var(--ink-2)}
.act .row{margin-top:8px}
.act.ok{background:var(--green-50);border-color:var(--green-line)}
.act.no{background:var(--blue-25)}
.act.no .act-t{text-decoration:line-through;color:var(--ink-2)}
.act-s{font-size:13px;font-weight:700;margin-top:6px}
.act.ok .act-s{color:var(--green-ink)}
.act input{width:100%;margin-top:6px;border:1px solid var(--line-2);border-radius:8px;padding:7px 9px;font-size:14px}

/* ---------- Member 360 ---------- */
.back{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px;text-decoration:none;margin-bottom:12px}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:14px 20px;flex-wrap:wrap;padding:16px}
.mid{display:flex;gap:14px;align-items:center;min-width:0}
.mid h1{font-size:26px;letter-spacing:-.3px}
.mid p{margin:2px 0 0;color:var(--ink-2);font-size:14px}
.mmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.explain{margin:12px 0 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--ink-2)}
.explain strong{color:var(--ink)}
.explain button{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:3px 11px;font-size:13px;font-weight:700;color:var(--blue-ink)}
.explain-box{flex-basis:100%;background:var(--blue-50);border:1px solid var(--line-2);border-radius:12px;padding:12px 14px;color:var(--ink)}
.explain-box ul{margin:6px 0 0;padding-left:18px}
.banner{display:flex;gap:12px;align-items:flex-start;border-radius:14px;padding:14px 16px;margin:14px 0;border:1px solid}
.banner.warn{background:var(--amber-50);border-color:var(--amber-line)}
.banner.risk{background:var(--red-50);border-color:var(--red-line)}
.banner.ok{background:var(--green-50);border-color:var(--green-line)}
.banner .ic{display:grid;place-items:center;flex-shrink:0;width:30px;height:30px;border-radius:50%;font-weight:800;color:var(--on-dark)}
.banner.warn .ic{background:var(--amber-dot)}.banner.risk .ic{background:var(--red)}.banner.ok .ic{background:var(--green-ink)}
.banner h2{font-size:17px;margin-bottom:4px}
.banner.risk h2{color:var(--red)}.banner.warn h2{color:var(--amber-ink)}.banner.ok h2{color:var(--green-ink)}
.banner p{margin:0 0 8px}
.never{font-size:13px;font-weight:700;margin-top:8px}
.stack{display:grid;gap:16px;margin-bottom:16px}
/* conflict resolution */
.cq{font-size:15px;font-weight:700;margin:0 0 10px}
.copts{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:stretch}
.vs{display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--ink-2)}
.copt{display:grid;gap:4px;border:2px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);cursor:pointer;text-align:left}
.copt:hover{border-color:var(--line-2)}
.copt[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-50)}
.copt .v{font-size:18px;font-weight:800}
.copt .pick{font-size:12px;font-weight:800;color:var(--blue-ink)}
.cctx{margin-top:10px;font-size:13px;color:var(--ink-2);background:var(--blue-25);border-radius:9px;padding:8px 10px}
.cform{display:grid;gap:10px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line-2)}
.cform label.fl{font-size:13px;font-weight:800}
.cform input[type=text]{width:100%;border:1px solid var(--line-2);border-radius:9px;padding:8px 10px;font-size:14px}
.toggle{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700}
.toggle[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--on-dark)}
.resolved{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;justify-content:space-between;background:var(--green-50);border:1px solid var(--green-line);border-radius:12px;padding:12px 14px}
.resolved b{color:var(--green-ink)}
/* lag chart */
.lane-wrap{overflow-x:auto}
.lane-wrap svg{display:block;width:100%;min-width:640px;height:auto}
.lc-text{fill:var(--ink);font:600 12px var(--display)}
.lc-lab{fill:var(--ink);font:800 12px var(--display)}
.lc-axis{stroke:var(--line-2);stroke-width:1}
.lc-grid{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.lc-a{fill:var(--blue)}.lc-c{fill:var(--violet)}
.lc-blind{fill:var(--amber-50);stroke:var(--amber-line);stroke-width:1.5}
.lc-blind-t{fill:var(--amber-ink);font:800 12px var(--display)}
.lc-today{stroke:var(--red);stroke-width:2}
.lc-today-t{fill:var(--red);font:800 12px var(--display)}
.lagmsg{font-size:15px;font-weight:700;margin:0 0 8px}
/* investigation */
.inv{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.inv li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;border:1px solid var(--line);border-radius:12px;padding:12px}
.inv li.done{background:var(--green-50);border-color:var(--green-line)}
.inv .num{width:28px;height:28px}
.inv h4{font-size:15px}
.inv .ph{font-family:var(--mono);font-weight:600}
.inv input[type=text]{border:1px solid var(--line-2);border-radius:9px;padding:7px 10px;font-size:14px;min-width:0;flex:1 1 200px}
.block{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:700;color:var(--red);background:var(--red-50);border:1px solid var(--red-line);border-radius:10px;padding:8px 10px;margin-top:10px}
/* contact strip */
.cstrip{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:0}
.cstrip>div{padding:14px 16px}
.cstrip>div+div{border-left:1px solid var(--line)}
.pstat{border-radius:12px;padding:10px 12px;border:1px solid}
.pstat.dead{background:var(--red-50);border-color:var(--red-line)}
.pstat.shared{background:var(--amber-50);border-color:var(--amber-line)}
.pstat.okk{background:var(--green-50);border-color:var(--green-line)}
.pstat .lbl{font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase}
.pstat.dead .lbl{color:var(--red)}.pstat.shared .lbl{color:var(--amber-ink)}.pstat.okk .lbl{color:var(--green-ink)}
.pstat .ph{font-family:var(--mono);font-size:16px;font-weight:600}
.pstat.dead .ph{text-decoration:line-through}
.alts{display:grid;gap:6px;margin-top:10px}
.alts .lead{font-size:13px;font-weight:800}
.alt{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:8px 10px;font-size:14px;font-weight:700}
.alt:hover{border-color:var(--blue);background:var(--blue-25)}
.alt span{font-family:var(--mono);font-size:13px;color:var(--blue-ink)}
.bars2{display:flex;flex-wrap:wrap;gap:8px}
.bchip{display:grid;gap:2px;border:1px solid var(--line);border-radius:10px;padding:7px 10px;min-width:0;max-width:100%}
.bchip .k{font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-2)}
.bchip .v{font-size:14px;font-weight:700}
.bchip.risk{background:var(--red-50);border-color:var(--red-line)}.bchip.risk .v{color:var(--red)}
.bchip.warn{background:var(--amber-50);border-color:var(--amber-line)}.bchip.warn .v{color:var(--amber-ink)}
.bchip .prov{margin-top:2px}
.mgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.col{display:grid;gap:16px;min-width:0}
.brief{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.brief li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px}
.num{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--blue);color:var(--on-dark);font-size:12px;font-weight:800;flex-shrink:0}
.paused{background:var(--blue-50);border-radius:10px;padding:10px 12px;font-size:14px}
.seg{display:inline-flex;background:var(--blue-50);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 12px;font-weight:700;font-size:13px;color:var(--navy)}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(18,25,87,.18)}
.legend{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--ink-2)}
.tscroll{overflow-x:auto}
.ev{width:100%;border-collapse:collapse;min-width:600px}
.ev th{font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-2);text-align:left;padding:8px 12px;background:var(--blue-25);border-block:1px solid var(--line)}
.ev td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
.ev tr:last-child td{border-bottom:0}
.ev td:first-child{font-weight:700;white-space:nowrap}
.ev .val{font-weight:600}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.steps li{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.steps .num{background:var(--navy)}
.kv{display:grid;gap:3px;font-size:14px}
.tl{list-style:none;margin:0;padding:0 0 0 4px}
.tl li{position:relative;padding:0 0 14px 22px;border-left:2px solid var(--line)}
.tl li:last-child{padding-bottom:0}
.tl li::before{content:"";position:absolute;left:-7px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--blue);border:2px solid var(--surface)}
.tl h3{font-size:14px}
.tl p{margin:2px 0 5px;font-size:13px;color:var(--ink-2)}

/* ---------- Call & assessment ---------- */
.ogrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px;align-items:start}
.routes{display:grid;gap:8px}
.route{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.route input{width:17px;height:17px;margin:3px 0 0;accent-color:var(--blue)}
.route.sel{border-color:var(--blue);background:var(--blue-50)}
.route.blocked{cursor:not-allowed;background:var(--red-50);border-color:var(--red-line)}
.route strong{display:block;font-size:14px}
.route .ph{font-family:var(--mono);font-size:15px;font-weight:600}
.route small{display:block;font-size:13px;color:var(--ink-2)}
.route.blocked small{color:var(--red);font-weight:700}
.route.blocked .ph{text-decoration:line-through}
.script{margin-top:10px;background:var(--blue-25);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px}
.outs{display:flex;flex-wrap:wrap;gap:6px}
.outs button{border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:700}
.outs button:hover{border-color:var(--navy)}
.outs button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--on-dark)}
.notes{width:100%;min-height:230px;border:1px solid var(--line-2);border-radius:12px;padding:12px;font-size:15px;line-height:1.6;resize:vertical;background:var(--surface)}
.notes::placeholder{color:var(--ink-2)}
.notes:disabled{background:var(--blue-25)}
.astat{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.k-src,.k-ai,.k-ed,.k-ok,.k-empty{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;padding:2px 8px;border-radius:6px;border:1px solid}
.k-src{background:var(--blue-50);color:var(--blue-ink);border-color:var(--line-2)}
.k-ai{background:var(--pending);color:var(--amber-ink);border-color:var(--amber-line)}
.k-ed{background:var(--violet-50);color:var(--violet-ink);border-color:#C4B6F6}
.k-ok{background:var(--green-50);color:var(--green-ink);border-color:var(--green-line)}
.k-empty{background:var(--surface);color:var(--ink-2);border-color:var(--line-2);border-style:dashed}
.alist{max-height:640px;overflow:auto;border:1px solid var(--line);border-radius:12px}
.asec{position:sticky;top:0;z-index:1;font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--on-dark);background:var(--navy);padding:6px 12px}
.arow{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) auto;gap:4px 12px;align-items:start;padding:9px 12px;border-bottom:1px solid var(--line);border-left:5px solid transparent}
.arow .al{font-size:13px;font-weight:800}
.arow .av2{font-size:14px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.arow .from{display:block;font-size:12px;font-weight:500;color:var(--ink-2);margin-top:3px}
.arow .from q{font-style:italic}
.aright{display:grid;gap:5px;justify-items:end}
.arow .acts2{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.arow .acts2 button{border:1px solid var(--line-2);background:var(--surface);border-radius:7px;padding:2px 8px;font-size:12px;font-weight:700}
.arow .acts2 button:hover{border-color:var(--navy)}
.arow input{width:100%;border:1px solid var(--blue);border-radius:7px;padding:5px 8px;font-size:14px}
.arow.fsrc{background:var(--blue-25);border-left-color:var(--blue)}
.arow.ai{background:var(--pending);border-left-color:var(--amber-line)}
.arow.ed{background:var(--violet-50);border-left-color:var(--violet)}
.arow.okr{background:var(--green-50);border-left-color:var(--green-ink)}
.arow.emp .av2{color:var(--ink-2);font-weight:500}
.arow.red{background:var(--red-50);border-left-color:var(--red)}
.arow.red .av2{color:var(--red);font-weight:800}
.arow.scan{animation:scan .7s ease-out}
@keyframes scan{from{background:var(--violet-50)}}
.esc{display:flex;gap:10px;align-items:flex-start;background:var(--red-50);border:1px solid var(--red-line);color:var(--red);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-weight:700;font-size:14px}
.approve{position:sticky;bottom:0;background:var(--surface);border-top:2px solid var(--line);padding:12px 16px;border-radius:0 0 13px 13px;display:grid;gap:10px}
.approve label{display:flex;gap:8px;align-items:flex-start;font-size:14px;font-weight:600}
.approve input{width:18px;height:18px;margin-top:2px;accent-color:var(--green-ink)}
.draft{white-space:pre-wrap;font-size:14px;line-height:1.6;background:var(--blue-25);border:1px solid var(--line);border-radius:12px;padding:12px 14px;max-height:520px;overflow:auto}
.writes{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.writes li{display:flex;justify-content:space-between;gap:10px;padding:6px 10px;border-radius:9px;font-size:14px;font-weight:700;background:var(--green-50);color:var(--green-ink)}
.writes li.p{background:var(--amber-50);color:var(--amber-ink)}
.writes li.r{background:var(--red-50);color:var(--red)}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:16px;font-size:13px;font-weight:700}
.flow span{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:4px 9px}
.flow i{font-style:normal;color:var(--ink-2)}

/* ---------- Footer, dialog, tour, toast ---------- */
footer{border-top:1px solid var(--line);background:var(--surface)}
footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px 20px;flex-wrap:wrap;padding-block:14px 110px;font-size:13px;color:var(--ink-2)}
.toggles{display:flex;gap:14px;flex-wrap:wrap;align-items:center;border-radius:12px;padding:4px}
.toggles label{display:flex;gap:6px;align-items:center;font-weight:700;color:var(--ink)}
.toggles input{width:17px;height:17px;accent-color:var(--blue)}
dialog{border:0;border-radius:16px;padding:0;width:min(560px,calc(100vw - 32px));max-height:85vh;color:var(--ink);background:var(--surface);box-shadow:0 24px 64px rgba(11,15,63,.4)}
dialog::backdrop{background:rgba(11,15,63,.55)}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 18px;background:var(--navy);color:var(--on-dark)}
.dh h2{font-family:var(--mono);font-size:18px}
.dh p{margin:2px 0 0;font-size:13px;color:var(--on-dark-2)}
.x{border:1px solid var(--on-dark-2);background:transparent;color:var(--on-dark);border-radius:8px;width:34px;height:34px;font-size:18px;line-height:1}
.db{padding:14px 18px 18px;overflow:auto}
.rf{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr);margin:0}
.rf dt,.rf dd{padding:7px 0;border-bottom:1px solid var(--line);margin:0}
.rf dt{font-size:12px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--ink-2)}
.rf dd{font-size:14px;overflow-wrap:anywhere}
.tour{position:fixed;z-index:35;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(390px,calc(100vw - 32px));background:var(--navy);color:var(--on-dark);border-radius:16px;padding:14px 16px;box-shadow:0 18px 50px rgba(11,15,63,.45)}
.tour .tt{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--on-dark-2)}
.tour h3{font-size:17px;margin:6px 0 4px}
.tour p{margin:0;font-size:14px;color:var(--on-dark-2)}
.tour .row{margin-top:12px;justify-content:space-between}
.tour .btn{border-color:var(--on-dark-2);background:transparent;color:var(--on-dark)}
.tour .btn:hover{background:var(--navy-deep)}
.tour .btn.primary{background:var(--blue);border-color:var(--blue)}
.tour .dots{display:flex;gap:4px}
.tour .dots i{width:7px;height:7px;border-radius:50%;background:var(--indigo)}
.tour .dots i.on{background:var(--on-dark)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);max-width:calc(100vw - 32px);background:var(--ink);color:var(--on-dark);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:50}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1060px){
  .qgrid,.mgrid,.ogrid{grid-template-columns:minmax(0,1fr)}
  .pane{position:static}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:760px){
  .cstrip{grid-template-columns:minmax(0,1fr)}
  .cstrip>div+div{border-left:0;border-top:1px solid var(--line)}
  .copts{grid-template-columns:minmax(0,1fr)}
  .vs{padding:2px 0}
}
@media (max-width:640px){
  .appbar{position:static}
  .who,.clock{display:none}
  .head h1{font-size:24px}
  .qhead{display:none}
  .qrow{grid-template-columns:54px minmax(0,1fr) auto;grid-template-areas:"s n d" "t t t"}
  .qrow .score{grid-area:s}.qrow .qn{grid-area:n}.qrow .qt{grid-area:t}.qrow .qd{grid-area:d}
  .search{flex:1 1 100%}
  .bl{grid-template-columns:84px minmax(0,1fr) 50px}
  .rf{grid-template-columns:minmax(0,1fr)}
  .rf dt{border-bottom:0;padding-bottom:0}
  .mid h1{font-size:22px}
  .tile .n{min-width:40px;height:40px;font-size:17px}
  .arow{grid-template-columns:minmax(0,1fr) auto}
  .arow .al{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
/* Calm, accessible workbench: one decision at a time. */
:root{
 --navy:#172B4D;--navy-deep:#10233F;--indigo:#172B4D;
 --blue:#164EC5;--blue-ink:#103C9A;--blue-50:#EDF3FD;--blue-25:#F6F8FC;
 --violet:#164EC5;--violet-ink:#103C9A;--violet-50:#EDF3FD;
 --ink:#172B4D;--ink-2:#475569;--line:#D7DFE9;--line-2:#8C9BB0;
 --bg:#F4F6FA;--on-dark-2:#E1E8F4;
 --display:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
 --mono:ui-monospace,SFMono-Regular,Consolas,monospace;
}
html{scroll-padding-top:140px;-webkit-text-size-adjust:100%}
body{font-size:16px;line-height:1.6}
button,a,input,select,textarea,summary{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button,.btn,.src,.chip,.toggle,.seg button,.outs button,.arow .acts2 button,.x{min-height:44px}
input[type=text],input[type=search],textarea,select,.arow input,.cform input[type=text],.inv input[type=text]{font-size:16px;min-height:44px}
button,.btn{white-space:normal;overflow-wrap:anywhere}
button:disabled{opacity:1;background:#E6EAF0!important;color:#596579!important;border-color:#A6B2C3!important}
.brand,.back{min-height:44px;align-items:center}
.skip-link{position:fixed;left:16px;top:-100px;z-index:100;background:white;color:var(--ink);padding:12px 20px;border:2px solid var(--blue)}
.skip-link:focus{top:8px}
#app:focus{outline:none}
.bar{background:var(--navy-deep)}
.brand small{font-size:12px;letter-spacing:0}
.bar .wrap{min-height:68px}
.brand b{font-size:18px}
.mark{border-radius:8px;background:#fff;color:var(--navy)}
.demo-btn{border-radius:8px;font-size:13px}
.tabs .wrap{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));overflow:visible;padding-block:0;gap:0}
.tab{justify-content:center;padding:10px 8px;min-height:52px;font-size:15px;white-space:normal}
.tab.on{background:var(--blue-50);color:var(--blue-ink)}
.tab .tag{display:none}
.tab .ctx{font-size:13px}
main{padding-top:24px}
.head h1{font-size:30px;letter-spacing:-.7px}
.head p{font-size:15px}
.head .kicker .tag{display:none}
.head .kicker{font-size:12px;letter-spacing:.5px}
.card{border-radius:12px;box-shadow:0 1px 2px #10233f05}
.ch{font-size:16px;border-radius:11px 11px 0 0}
.ch.blue,.ch.violet{background:white;color:var(--ink);border-bottom:1px solid var(--line)}
.ch.blue small,.ch.violet small{color:var(--ink-2)}
.ch.navy{background:#F0F4FA;color:var(--ink);border-bottom:1px solid var(--line)}
.ch.navy .sub,.ch.navy small{color:var(--ink-2)}
.btn{border-radius:8px;padding:10px 14px}
.btn.sm{padding:7px 11px}
.src{padding:6px 8px;font-size:12px}
.tiles{gap:10px}
.tile,.tile.hot{border-color:var(--line);background:var(--surface);padding:10px 14px;border-radius:10px;gap:10px}
.tile .n,.tile.hot .n,.tile.v .n,.tile.k .n{background:transparent;color:var(--ink);border-radius:0;min-width:32px;font-size:24px}
.tile.hot .n{color:var(--red)}
.tile .l{font-size:13px}
.qgrid{grid-template-columns:minmax(0,1.7fr) minmax(320px,1fr);gap:20px}
.tools{padding:16px;gap:12px;align-items:stretch}
.search{flex:1 1 100%;padding:0 12px}
.chips{gap:7px}
.chip{font-size:13px;padding:7px 10px;border-radius:8px}
.sortnote{font-size:12px;line-height:1.6}
.qhead,.qrow{grid-template-columns:50px minmax(0,1fr) 80px;grid-template-areas:"s n d" "t t t";gap:8px 12px;padding:18px}
.qhead{display:none}
.qrow{border-left-width:4px;transition:background .15s}
.qrow .score{grid-area:s;font-size:16px;min-height:40px}
.qrow .qn{grid-area:n}.qrow .qt{grid-area:t}.qrow .qd{grid-area:d}
.qn strong{font-size:17px}.qn small{display:inline;font-size:12px}.qn small+small::before{content:" · "}
.qrow .trig{padding:0;background:transparent;color:var(--ink-2);font-size:13px;font-weight:500}
.qrow .trig .k{display:none}.qrow .trig .age{color:var(--ink-2);font-weight:400}
.qrow .flags{gap:6px}.flag{white-space:normal;font-size:12px;padding:2px 7px;font-weight:600}
.qrow .nba{font-size:14px;margin-top:2px;font-weight:700}
.qrow[aria-pressed=true]{background:#F2F6FE;border-left-color:var(--blue)}
.qd{font-size:15px}.qd small{font-size:12px}.open-hint{display:block;font-size:12px;color:var(--blue-ink);margin-top:8px}
.pane{top:140px}.pane-cta{margin:16px 0}.pane-cta .btn{flex:1}
.pane .cb{padding:18px}.monday{font-size:15px;line-height:1.75;margin:0 0 14px}
summary{cursor:pointer;font-weight:700;min-height:48px;padding:12px 14px;color:var(--ink);overflow-wrap:anywhere}
summary::marker{color:var(--blue)}
.disclosure{border-block:1px solid var(--line);margin:16px 0}
.disclosure summary{padding-inline:0;font-size:14px}
.disclosure .hint{font-size:12px}
.why{line-height:1.7}.act{padding:12px}.act-t{font-size:14px}.act-d{font-size:13px}
.member-nav{display:flex;gap:12px;justify-content:space-between;align-items:center;margin:12px 0;color:var(--ink-2);font-size:13px}
.next-summary{margin-bottom:20px;border-left:4px solid var(--blue)}
.next-summary .cb{display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap}
.next-summary .sect{flex-basis:100%;margin-bottom:0}
.next-summary .monday{flex:1 1 420px;margin:0}
.mhead .mid{align-items:flex-start}.mid>div{min-width:0}.mid p{line-height:1.7}
.mhead .trig{background:transparent;color:var(--ink-2);padding:0}.mhead .trig .k{display:none}.mhead .trig .age{color:var(--ink-2)}
.banner{padding:18px;line-height:1.65}.banner h2{font-size:19px}.banner .row{gap:8px}
.history-details{border:1px solid var(--line);border-radius:12px;background:white}
.history-details .card{border:none;box-shadow:none}.mobile-events{display:none}
.record-directory{border-top:1px solid var(--line)}
.record-link{display:flex;align-items:center;gap:10px;margin-bottom:6px;font-size:13px}
.record-link .src{flex:0 0 112px}.record-link span{min-width:0}
.st,.fr{white-space:normal;font-size:12px}.prov{line-height:1.7}
.call-steps{display:flex;gap:8px;margin:20px 0;scroll-margin-top:140px}
.call-steps button{flex:1;border:1px solid var(--line-2);border-radius:9px;padding:12px;background:white;font-size:15px;font-weight:700}
.call-steps button.on{background:var(--blue-50);color:var(--blue-ink);border-color:var(--blue);box-shadow:inset 0 -3px var(--blue)}
.ogrid{display:block}.ogrid[data-step=notes] #assess{display:none}.ogrid[data-step=review] .call-inputs{display:none}
.call-inputs{grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);align-items:start;gap:20px}
.ogrid #assess{max-width:1000px;margin:0 auto}
.alist{max-height:none;overflow:visible;border:0;border-radius:0}
.assessment-group{border:1px solid var(--line);border-radius:8px;margin-bottom:10px;overflow:hidden}
.assessment-group summary{background:var(--blue-25);font-size:15px}
.assessment-group summary span{display:block;margin-left:18px;color:var(--ink-2);font-size:12px;font-weight:500}
.arow{grid-template-columns:minmax(0,180px) minmax(0,1fr) 120px;padding:14px}
.approve{position:static}.approve label{padding:8px 0;line-height:1.7}.approve input{flex:0 0 22px;width:22px;height:22px}

function extract(p,text){

 const meds=[];for(const s of sents){for(const m of s.matchAll(/\b([a-z]{4,})(?:\s+er)?\s+(\d+(?:\.\d+)?)\s*(mg|mcg)\b/gi)){const v=m[1].toLowerCase()+' '+m[2]+' '+m[3];if(!meds.find(x=>x.v===v))meds.push({v,from:s});}}
 if(meds.length)out.meds={v:meds.map(x=>x.v).join(', '),from:meds[0].from};
 const who=text.match(/\b(daughter riya|riya|charge nurse|nurse|son|wife|husband|caregiver)\b/i);
 if(who)out.person={v:cap(who[1]),from:sents.find(s=>s.toLowerCase().includes(who[1].toLowerCase()))||''};
 else if(/\b(pt|patient|member)\b/i.test(text)||text.toLowerCase().includes(p.name.toLowerCase()))out.person={v:'Member ('+p.name+')',from:sents[0]||''};
 if(out.mood&&/denies|feels safe/i.test(out.mood.v)&&!out.redflag)out.mood.v=out.mood.v;
 return out;
}

function field(p,s,k){
 const base=p.af[k];
 if(S.withdrawn&&p.key==='pranav'&&['consent','reason','event','facility','mood','bhvisit','bhprov','meds','taking','supply'].includes(k))return {v:'Restricted · consent withdrawn',st:'emp'};
 if(s.ed[k]!==undefined)return {v:s.ed[k],st:'ed',from:'Edited by Maria',was:base?base[0]:''};
 if(s.ai[k]&&!s.rej[k])return {v:s.ai[k].v,st:k==='redflag'?'red':'ai',from:s.ai[k].from,was:base&&base[0]!==s.ai[k].v?base[0]:'',wasSrc:base?base[1]:''};
 if(k==='outcome'&&s.out!=='prep')return {v:OUTC[s.out],st:'ed',from:'Selected by Maria'};
 if(base){if(base[2]&&!S.pbm)return {v:'Unknown · pharmacy feed down',st:'emp'};return {v:base[0],st:'src',src:base[1]};}
 return {v:'',st:'emp'};
}

function closure(p){const s=sess(p);const blocks=[];if(acts(p).some((x,i)=>x.s!=='no'&&!S.tasks[p.key+':'+i]))blocks.push('Open tasks need completion evidence or a documented dismissal.');if((p.conflicts||[]).some(c=>!resolved(p,c.cid)))blocks.push('Unresolved conflicting sources.');if(!s.submitted)blocks.push('Assessment has not been approved.');if(!s.ack)blocks.push('No CM receipt.');if(S.escalations[p.key]&&!S.escalations[p.key].notified)blocks.push('Urgent escalation has no accepted handoff.');if(!S.closureEvidence[p.key])blocks.push('Clinical closure criteria have not been attested.');return blocks;}

document.addEventListener('change',e=>{const t=e.target;if(t.id==='role-select'){S.role=t.value;S.sel=S.cur='pranav';S.filter='all';location.hash='queue';render();}if(t.id==='demo-clock'){S.clock=t.value;render();}if(t.id==='t-write'){S.writeFail=t.checked;render();}if(t.id==='consent-withdrawn'){S.withdrawn=t.checked;render();}if(t.dataset.checktask!==undefined){S.folds['jordan-check-'+t.dataset.checktask]=t.checked;toast(t.checked?'Checklist step marked reviewed; completion still needs evidence.':'Checklist step review cleared.');}laterPersist();},true);
document.addEventListener('visibilitychange',()=>{measure();lastTick=lastActivity=performance.now();persist();});
['pointerdown','keydown','scroll'].forEach(name=>document.addEventListener(name,active,{passive:true}));
window.addEventListener('pagehide',()=>{measure();persist();});
window.addEventListener('resize',positionTour);
window.addEventListener('scroll',()=>{if(S.tour>=0)requestAnimationFrame(positionTour);},{passive:true});
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable]')||document.querySelector('dialog[open]'))return;const key=e.key.toLowerCase(),r=route();if(key==='?'){document.querySelector('[data-extra=shortcuts]').click();e.preventDefault();}if(key==='/'&&r.v==='queue'){document.getElementById('q').focus();e.preventDefault();}if((key==='j'||key==='k')&&r.v==='queue'){const L=list();let i=L.findIndex(p=>p.key===S.sel);i=Math.max(0,Math.min(L.length-1,i+(key==='j'?1:-1)));if(L[i]){S.sel=L[i].key;render();document.querySelector(`[data-sel="${S.sel}"]`)?.focus();}e.preventDefault();}if(key==='enter'&&r.v==='queue'){location.hash='member-'+S.sel;e.preventDefault();}if(key==='c'){const p=r.p||P[S.sel];metrics(p).prepDone=true;location.hash='outreach-'+p.key;e.preventDefault();}});
setInterval(()=>{measure();const el=document.getElementById('session-panel');if(el?.open){const current=route().p,total=f=>Object.values(S.stats.members).reduce((n,x)=>n+x[f],0);const nums=el.querySelectorAll('.metric-grid b');if(nums[0])nums[0].textContent=elapsed(current?metrics(current).prep:total('prep'));if(nums[1])nums[1].textContent=elapsed(current?metrics(current).doc:total('doc'));}persist();},1000);

render();
setTimeout(welcome,0);
})();
</script>
