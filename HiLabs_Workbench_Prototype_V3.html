<title>Care Workbench</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Clickable concept prototype for the HiLabs APM case 2026–27: an explained work queue, Member 360 with conflict resolution, and notes-to-assessment drafting for five fictional members.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: navy→indigo app bar (deck cover) + Decide/Know/Do tabs; 1240px column.
   Queue = triage rows with trigger + next action, "why" pane. Member 360 = issue → resolve → contact strip → evidence.
   Call = notes left, 40-field assessment right (yellow = pending until Approve & Submit). */
:root{
  --navy:#121957;--navy-deep:#0B0F3F;--indigo:#381E8C;
  --blue:#0053EF;--blue-ink:#0A3FB8;--blue-50:#EDF2FE;--blue-25:#F6F8FE;
  --violet:#603CE4;--violet-ink:#4A2BBE;--violet-50:#EFEBFD;
  --red:#981A1A;--red-50:#FDF1F1;--red-100:#FDE1E1;--red-line:#F2A7A7;
  --amber-50:#FDF2C6;--amber-ink:#5F3B00;--amber-line:#E7B53C;--amber-dot:#9A5B00;--pending:#FFF4B8;
  --green-50:#DBFBE6;--green-ink:#14532D;--green-line:#7AD69C;
  --ink:#0E1440;--ink-2:#3B4266;--line:#D6DDF3;--line-2:#AEB8DA;
  --bg:#F6F8FE;--surface:#FFFFFF;--on-dark:#FFFFFF;--on-dark-2:#C9D1F4;
  --display:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ring:0 0 0 3px var(--surface),0 0 0 6px var(--violet);
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--display)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--navy-deep)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
h1,h2,h3,h4{margin:0;text-wrap:balance}
table{font-size:inherit}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tnum{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}

/* ---------- App bar ---------- */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30}
.bar{background:linear-gradient(100deg,var(--navy-deep) 0%,var(--navy) 55%,var(--indigo) 100%);color:var(--on-dark)}
.bar .wrap{display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;color:var(--on-dark);text-decoration:none;margin-right:auto}
.brand b{font-weight:800;font-size:17px;letter-spacing:-.2px}
.brand small{display:block;font-size:11px;font-weight:600;color:var(--on-dark-2);letter-spacing:.3px}
.mark{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--blue);color:var(--on-dark);font-weight:800;font-size:13px}
.who{font-size:14px;color:var(--on-dark-2)}
.who strong{color:var(--on-dark)}
.clock{font-size:13px;font-weight:700;padding:5px 11px;border-radius:999px;border:1px solid var(--on-dark-2)}
.demo-btn{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--on-dark);color:var(--navy);font-weight:800;font-size:14px;padding:7px 14px;border-radius:999px}
.demo-btn:hover{background:var(--blue-50)}
.demo-btn i{font-style:normal;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--violet);color:var(--on-dark);font-size:11px}
.tabs{background:var(--surface);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:2px;overflow-x:auto}
.tab{display:flex;align-items:center;gap:8px;padding:12px 14px 10px;border-bottom:3px solid transparent;text-decoration:none;color:var(--ink-2);font-weight:700;white-space:nowrap}
.tab:hover{color:var(--ink);background:var(--blue-25)}
.tab.on{color:var(--ink);border-bottom-color:var(--blue)}
.tab .ctx{font-weight:600;color:var(--ink-2)}
.tag{font-size:11px;font-weight:800;letter-spacing:.8px;padding:2px 8px;border-radius:6px;color:var(--on-dark)}
.tag-decide{background:var(--violet)}.tag-know{background:var(--blue)}.tag-do{background:var(--navy)}

main{padding-block:22px 48px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 20px;flex-wrap:wrap;margin-bottom:18px}
.head h1{font-size:30px;line-height:1.15;letter-spacing:-.5px}
.head p{margin:6px 0 0;color:var(--ink-2);max-width:70ch}
.kicker{display:flex;gap:8px;align-items:center;font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--ink-2);margin-bottom:8px}

/* ---------- Shared pieces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0}
.ch{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px 10px;padding:13px 16px;border-radius:13px 13px 0 0;font-weight:800;font-size:16px}
.ch.navy{background:var(--navy);color:var(--on-dark)}
.ch.blue{background:var(--blue);color:var(--on-dark)}
.ch.violet{background:var(--violet);color:var(--on-dark)}
.ch.plain{border-bottom:1px solid var(--line)}
.ch small{font-size:12px;font-weight:700;color:var(--on-dark-2)}
.ch.blue small,.ch.violet small{color:var(--on-dark)}
.ch.plain small{color:var(--ink-2)}
.cb{padding:14px 16px 16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:700;font-size:14px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--navy);background:var(--blue-25)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--on-dark)}
.btn.primary:hover{background:var(--blue-ink)}
.btn.ai{background:var(--violet);border-color:var(--violet);color:var(--on-dark)}
.btn.ai:hover{background:var(--violet-ink)}
.btn.ok{background:var(--green-ink);border-color:var(--green-ink);color:var(--on-dark)}
.btn.big{padding:13px 22px;font-size:16px;border-radius:12px}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45}
.btn.primary:disabled:hover{background:var(--blue)}.btn.ai:disabled:hover{background:var(--violet)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hint{font-size:13px;color:var(--ink-2)}
.src{white-space:nowrap;display:inline-flex;align-items:center;gap:3px;font-family:var(--mono);font-size:12px;font-weight:600;color:var(--blue-ink);background:var(--surface);border:1px solid var(--line-2);border-radius:6px;padding:1px 7px;line-height:1.6}
.src::before{content:"↗";font-family:var(--display);font-weight:800}
.src:hover{background:var(--blue-50);border-color:var(--blue)}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;border-radius:6px;padding:1px 8px;white-space:nowrap;border:1px solid}
.st b{font-size:13px}
.st-ok{background:var(--green-50);color:var(--green-ink);border-color:var(--green-line)}
.st-single{background:var(--blue-50);color:var(--blue-ink);border-color:var(--line-2)}
.st-conflict{background:var(--amber-50);color:var(--amber-ink);border-color:var(--amber-line)}
.st-unknown{background:var(--surface);color:var(--ink);border-color:var(--line-2);border-style:dashed}
.fr{font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;white-space:nowrap;border:1px solid var(--line)}
.fr-fresh{color:var(--green-ink)}
.fr-lag{color:var(--ink-2)}
.fr-stale{color:var(--amber-ink);background:var(--amber-50);border-color:var(--amber-line)}
.fr-down,.fr-missing{color:var(--red);background:var(--red-50);border-color:var(--red-line)}
.prov{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:5px;font-size:12px;color:var(--ink-2)}
.prov b{color:var(--ink);font-weight:700}
.score{display:inline-grid;place-items:center;min-width:48px;padding:4px 9px;border-radius:9px;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;border:1px solid}
.sc-hi{background:var(--red-100);color:var(--red);border-color:var(--red-line)}
.sc-md{background:var(--amber-50);color:var(--amber-ink);border-color:var(--amber-line)}
.sc-lo{background:var(--blue-50);color:var(--navy);border-color:var(--line-2)}
.av{display:grid;place-items:center;flex-shrink:0;width:40px;height:40px;border-radius:50%;font-weight:800;color:var(--on-dark)}
.av-hi{background:var(--red)}.av-md{background:var(--amber-dot)}.av-lo{background:var(--violet)}
.av.lg{width:56px;height:56px;font-size:22px}
.pill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--blue-50);color:var(--navy)}
.spot{box-shadow:var(--ring)!important;border-radius:14px}
.trig{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;font-weight:800;border-radius:8px;padding:4px 9px;color:var(--on-dark);letter-spacing:.2px}
.trig-adt{background:var(--navy)}.trig-rx{background:var(--violet)}
.trig .k{font-size:11px;letter-spacing:.8px;color:var(--on-dark-2)}
.trig .age{font-weight:600;color:var(--on-dark-2)}
.trig-rx .k,.trig-rx .age{color:var(--on-dark)}
.flag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;border-radius:7px;padding:2px 8px;border:1px solid;white-space:nowrap}
.flag.risk{background:var(--red-50);color:var(--red);border-color:var(--red-line)}
.flag.warn{background:var(--amber-50);color:var(--amber-ink);border-color:var(--amber-line)}
.flag.ok{background:var(--green-50);color:var(--green-ink);border-color:var(--green-line)}
.nba{display:block;margin-top:6px;font-size:14px;font-weight:800;color:var(--blue-ink)}
.nba::before{content:"Next ▸ ";color:var(--violet)}

/* ---------- Queue ---------- */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.tile{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.tile .n{flex-shrink:0;display:grid;place-items:center;min-width:48px;height:48px;padding:0 8px;border-radius:999px;font-size:20px;font-weight:800;color:var(--on-dark);background:var(--blue);font-variant-numeric:tabular-nums}
.tile .l{font-size:14px;font-weight:600;line-height:1.3}
.tile.hot{background:var(--red-50);border-color:var(--red-line)}
.tile.hot .n{background:var(--red)}
.tile.v .n{background:var(--violet)}
.tile.k .n{background:var(--navy)}
.qgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:14px 16px 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.chip:hover{border-color:var(--navy)}
.chip span{margin-left:5px;font-variant-numeric:tabular-nums}
.chip.on{background:var(--navy);border-color:var(--navy);color:var(--on-dark)}
.search{display:flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:10px;padding:7px 10px;background:var(--surface);flex:0 1 230px;min-width:0}
.search input{border:0;outline:0;background:transparent;width:100%;min-width:0;font-size:14px}
.search input::placeholder{color:var(--ink-2)}
.sortnote{padding:0 16px 10px;font-size:13px;color:var(--ink-2)}
.sortnote b{color:var(--ink)}
.qhead,.qrow{display:grid;grid-template-columns:60px minmax(0,150px) minmax(0,1fr) 84px;gap:12px;align-items:center;padding:12px 16px}
.qhead{font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--on-dark);background:var(--navy)}
.qrow{width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:var(--surface);border-left:4px solid transparent;padding-left:12px}
.qrow:last-child{border-bottom:0;border-radius:0 0 14px 14px}
.qrow:hover{background:var(--blue-25)}
.qrow[aria-pressed="true"]{background:var(--blue-50);border-left-color:var(--blue)}
.qrow .score{align-self:start}
.qn strong{display:block;font-size:16px}
.qn small{display:block;font-size:13px;color:var(--ink-2);font-weight:500}
.qt{display:grid;gap:6px;min-width:0}
.qt .flags{display:flex;gap:5px;flex-wrap:wrap}
.qd{text-align:right;font-weight:800;font-variant-numeric:tabular-nums;align-self:start}
.qd small{display:block;font-size:12px;font-weight:600;color:var(--ink-2)}
.empty{padding:28px 16px;text-align:center;color:var(--ink-2)}
.pane{position:sticky;top:calc(env(safe-area-inset-top,0px) + 124px)}
.ptop{display:flex;gap:12px;align-items:center}
.ptop h2{font-size:20px}
.ptop .sub{font-size:13px;color:var(--on-dark-2)}
.sect{font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--ink-2);margin:16px 0 8px}
.bars{display:grid;gap:8px}
.bl{display:grid;grid-template-columns:96px minmax(0,1fr) 56px;gap:10px;align-items:center;font-size:13px;font-weight:700}
.bl .tr{height:10px;border-radius:5px;background:var(--blue-50);overflow:hidden}
.bl .fi{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--blue),var(--violet))}
.bl b{text-align:right;font-variant-numeric:tabular-nums}
.why{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:5px;font-size:13px;color:var(--ink-2)}
.why b{color:var(--ink)}
.tie{margin-top:10px;font-size:13px;font-weight:700;color:var(--violet-ink);background:var(--violet-50);border-radius:9px;padding:8px 10px}
.acts{display:grid;gap:8px}
.act{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.act-t{display:block;font-weight:700;font-size:14px}
.act-d{font-size:13px;color:var(--ink-2)}
.act .row{margin-top:8px}
.act.ok{background:var(--green-50);border-color:var(--green-line)}
.act.no{background:var(--blue-25)}
.act.no .act-t{text-decoration:line-through;color:var(--ink-2)}
.act-s{font-size:13px;font-weight:700;margin-top:6px}
.act.ok .act-s{color:var(--green-ink)}
.act input{width:100%;margin-top:6px;border:1px solid var(--line-2);border-radius:8px;padding:7px 9px;font-size:14px}

/* ---------- Member 360 ---------- */
.back{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px;text-decoration:none;margin-bottom:12px}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:14px 20px;flex-wrap:wrap;padding:16px}
.mid{display:flex;gap:14px;align-items:center;min-width:0}
.mid h1{font-size:26px;letter-spacing:-.3px}
.mid p{margin:2px 0 0;color:var(--ink-2);font-size:14px}
.mmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.explain{margin:12px 0 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--ink-2)}
.explain strong{color:var(--ink)}
.explain button{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:3px 11px;font-size:13px;font-weight:700;color:var(--blue-ink)}
.explain-box{flex-basis:100%;background:var(--blue-50);border:1px solid var(--line-2);border-radius:12px;padding:12px 14px;color:var(--ink)}
.explain-box ul{margin:6px 0 0;padding-left:18px}
.banner{display:flex;gap:12px;align-items:flex-start;border-radius:14px;padding:14px 16px;margin:14px 0;border:1px solid}
.banner.warn{background:var(--amber-50);border-color:var(--amber-line)}
.banner.risk{background:var(--red-50);border-color:var(--red-line)}
.banner.ok{background:var(--green-50);border-color:var(--green-line)}
.banner .ic{display:grid;place-items:center;flex-shrink:0;width:30px;height:30px;border-radius:50%;font-weight:800;color:var(--on-dark)}
.banner.warn .ic{background:var(--amber-dot)}.banner.risk .ic{background:var(--red)}.banner.ok .ic{background:var(--green-ink)}
.banner h2{font-size:17px;margin-bottom:4px}
.banner.risk h2{color:var(--red)}.banner.warn h2{color:var(--amber-ink)}.banner.ok h2{color:var(--green-ink)}
.banner p{margin:0 0 8px}
.never{font-size:13px;font-weight:700;margin-top:8px}
.stack{display:grid;gap:16px;margin-bottom:16px}
/* conflict resolution */
.cq{font-size:15px;font-weight:700;margin:0 0 10px}
.copts{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:stretch}
.vs{display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--ink-2)}
.copt{display:grid;gap:4px;border:2px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);cursor:pointer;text-align:left}
.copt:hover{border-color:var(--line-2)}
.copt[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-50)}
.copt .v{font-size:18px;font-weight:800}
.copt .pick{font-size:12px;font-weight:800;color:var(--blue-ink)}
.cctx{margin-top:10px;font-size:13px;color:var(--ink-2);background:var(--blue-25);border-radius:9px;padding:8px 10px}
.cform{display:grid;gap:10px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line-2)}
.cform label.fl{font-size:13px;font-weight:800}
.cform input[type=text]{width:100%;border:1px solid var(--line-2);border-radius:9px;padding:8px 10px;font-size:14px}
.toggle{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700}
.toggle[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--on-dark)}
.resolved{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;justify-content:space-between;background:var(--green-50);border:1px solid var(--green-line);border-radius:12px;padding:12px 14px}
.resolved b{color:var(--green-ink)}
/* lag chart */
.lane-wrap{overflow-x:auto}
.lane-wrap svg{display:block;width:100%;min-width:640px;height:auto}
.lc-text{fill:var(--ink);font:600 12px var(--display)}
.lc-lab{fill:var(--ink);font:800 12px var(--display)}
.lc-axis{stroke:var(--line-2);stroke-width:1}
.lc-grid{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.lc-a{fill:var(--blue)}.lc-c{fill:var(--violet)}
.lc-blind{fill:var(--amber-50);stroke:var(--amber-line);stroke-width:1.5}
.lc-blind-t{fill:var(--amber-ink);font:800 12px var(--display)}
.lc-today{stroke:var(--red);stroke-width:2}
.lc-today-t{fill:var(--red);font:800 12px var(--display)}
.lagmsg{font-size:15px;font-weight:700;margin:0 0 8px}
/* investigation */
.inv{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.inv li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;border:1px solid var(--line);border-radius:12px;padding:12px}
.inv li.done{background:var(--green-50);border-color:var(--green-line)}
.inv .num{width:28px;height:28px}
.inv h4{font-size:15px}
.inv .ph{font-family:var(--mono);font-weight:600}
.inv input[type=text]{border:1px solid var(--line-2);border-radius:9px;padding:7px 10px;font-size:14px;min-width:0;flex:1 1 200px}
.block{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:700;color:var(--red);background:var(--red-50);border:1px solid var(--red-line);border-radius:10px;padding:8px 10px;margin-top:10px}
/* contact strip */
.cstrip{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:0}
.cstrip>div{padding:14px 16px}
.cstrip>div+div{border-left:1px solid var(--line)}
.pstat{border-radius:12px;padding:10px 12px;border:1px solid}
.pstat.dead{background:var(--red-50);border-color:var(--red-line)}
.pstat.shared{background:var(--amber-50);border-color:var(--amber-line)}
.pstat.okk{background:var(--green-50);border-color:var(--green-line)}
.pstat .lbl{font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase}

 ['equipment',/\b(?:walker|wheelchair|cane)\b[^.;\n]*/i,m=>cap(m[0])],
 ['referrals',/\b(?:housing navigator|referral|mail order)\b[^.;\n]*/i,m=>cap(m[0])],

 ['language',/\b(?:spanish|interpreter)\b[^,.;\n]*/i,m=>cap(m[0])]
];
const cap=s=>{s=String(s).trim();return s.charAt(0).toUpperCase()+s.slice(1);};
function extract(p,text){
 const sents=text.split(/(?<=[.;!?])\s+|\n+/).map(s=>s.trim()).filter(Boolean),out={};
 for(const [k,re,fmt] of RULES){for(const s of sents){const m=s.match(re);if(m){out[k]={v:fmt(m),from:s};break;}}}
 const meds=[];for(const s of sents){for(const m of s.matchAll(/\b([a-z]{4,})(?:\s+er)?\s+(\d+(?:\.\d+)?)\s*(mg|mcg)\b/gi)){const v=m[1].toLowerCase()+' '+m[2]+' '+m[3];if(!meds.find(x=>x.v===v))meds.push({v,from:s});}}
 if(meds.length)out.meds={v:meds.map(x=>x.v).join(', '),from:meds[0].from};
 const who=text.match(/\b(daughter riya|riya|charge nurse|nurse|son|wife|husband|caregiver)\b/i);
 if(who)out.person={v:cap(who[1]),from:sents.find(s=>s.toLowerCase().includes(who[1].toLowerCase()))||''};
 else if(/\b(pt|patient|member)\b/i.test(text)||text.toLowerCase().includes(p.name.toLowerCase()))out.person={v:'Member ('+p.name+')',from:sents[0]||''};
 if(out.mood&&/denies|feels safe/i.test(out.mood.v)&&!out.redflag)out.mood.v=out.mood.v;
 return out;
}

function field(p,s,k){
 const base=p.af[k];
 if(s.ed[k]!==undefined)return {v:s.ed[k],st:'ed',from:'Edited by Maria',was:base?base[0]:''};
 if(s.ai[k]&&!s.rej[k])return {v:s.ai[k].v,st:k==='redflag'?'red':'ai',from:s.ai[k].from,was:base&&base[0]!==s.ai[k].v?base[0]:'',wasSrc:base?base[1]:''};
 if(k==='outcome'&&s.out!=='prep')return {v:OUTC[s.out],st:'ed',from:'Selected by Maria'};
 if(base){if(base[2]&&!S.pbm)return {v:'Unknown · pharmacy feed down',st:'emp'};return {v:base[0],st:'src',src:base[1]};}
 return {v:'',st:'emp'};
}
function counts(p,s){const c={src:0,ai:0,ed:0,emp:0,red:0};FKEYS.forEach(k=>{const f=field(p,s,k);c[f.st]=(c[f.st]||0)+1;});return c;}
function arow(p,s,k){
 const f=field(p,s,k),lbl=FLABEL[k],cls=s.submitted&&f.st!=='emp'?(f.st==='red'?'red':'okr'):(f.st==='src'?'fsrc':f.st);
 const chip=s.submitted&&f.st!=='emp'?'<span class="k-ok">✓ Approved</span>':{src:'<span class="k-src">From records</span>',ai:'<span class="k-ai">AI · pending</span>',red:'<span class="k-ai">AI · pending</span>',ed:'<span class="k-ed">Maria</span>',emp:'<span class="k-empty">Not captured</span>'}[f.st];
 let val;
 if(s.editing===k)val=`<label class="sr" for="fe-${k}">${esc(lbl)}</label><input id="fe-${k}" value="${esc(f.st==='emp'?'':f.v)}"><div class="row" style="margin-top:6px"><button type="button" class="btn sm primary" data-fsave="${k}">Save</button><button type="button" class="btn sm" data-fcancel="${k}">Cancel</button></div>`;
 else val=`${f.st==='emp'?(k==='reason'&&p.missing?'Blank in the alert · ask the facility':'Not captured · ask, or leave unknown'):esc(f.v)}${f.st==='src'?`<span class="from">From ${src(f.src)} · confirm on the call</span>`:''}${(f.st==='ai'||f.st==='red')?`<span class="from">From your note: <q>${esc(f.from)}</q>${f.was?` · records said “${esc(f.was)}”`:''}</span>`:''}${f.st==='ed'&&f.from?`<span class="from">${esc(f.from)}</span>`:''}`;
 const btns=s.submitted||s.editing===k?'':`<span class="acts2"><button type="button" data-fedit="${k}" aria-label="Edit ${esc(lbl)}">Edit</button>${(f.st==='ai'||f.st==='red')?`<button type="button" data-frej="${k}" aria-label="Reject ${esc(lbl)}">Reject</button>`:''}</span>`;
 return `<div class="arow ${cls}${s.scan&&(f.st==='ai'||f.st==='red')?' scan':''}" id="ar-${k}"><span class="al">${esc(lbl)}</span><span class="av2">${val}</span><span class="aright">${chip}${btns}</span></div>`;
}
function noteText(p,s){
 const r=p.routes[s.route],L=['CARE COORDINATION NOTE · '+(s.submitted?'APPROVED':'DRAFT FOR RN REVIEW'),`${p.name}, ${p.age} · ${p.id} · ${p.plan}`,'Mon 2 Nov 2026 · Maria, RN',`Contact: ${r.l} (${r.ph}) · ${OUTC[s.out]}`,''];
 if(s.out==='prep')L.push('Preparation only. No successful contact documented.','');
 FIELDS.forEach(([sec,fs])=>{const rows=fs.map(([k,l])=>[l,field(p,s,k),k]).filter(([,f])=>f.st!=='emp');if(rows.length){L.push(sec.toUpperCase());rows.forEach(([l,f])=>L.push(`- ${l}: ${f.v}${f.st==='src'?' ['+f.src+']':f.st==='ai'||f.st==='red'?' [from call notes]':''}`));L.push('');}});
 const unk=FKEYS.filter(k=>field(p,s,k).st==='emp').map(k=>FLABEL[k]);
 if(unk.length)L.push('STILL UNKNOWN ('+unk.length+'): '+unk.join('; '),'');
 L.push(s.submitted?'Approved by Maria, RN. Every value is from her notes, her edits or a linked source record.':'Not saved. Values stay pending until Maria approves.');
 return L.join('\n');
}

 const writes=[['Identity & consent','✓ saved'],['Assessment (40 fields)',s.out==='connected'&&c.emp<14?'✓ saved':'Saved as partial'],['Goal & barrier',field(p,s,'goal').st!=='emp'?'✓ saved':'Still open'],['Care plan','✓ updated'],['Tasks · owner · due','✓ Maria'],['Signed note','✓ signed'],['CM system & audit',s.ack?'✓ received · '+s.rcpt:'Sending…']];

  </div></section>

   ${red.st==='red'?`<div class="esc">! ${esc(red.v)}. Follow the plan’s urgent procedure now; this does not wait for approval.</div>`:''}

   ${s.submitted?`<div class="sect">One approval, saved to every place it belongs</div><ul class="writes">${writes.map(([l,v])=>`<li class="${/Escalation/.test(l)?'r':/✓/.test(v)?'':'p'}"><span>${l}</span><span>${esc(v)}</span></li>`).join('')}</ul><div class="row" style="margin-top:12px"><button type="button" class="btn" data-act="newnote">Start a new call</button><a class="btn primary" href="#queue">Back to the queue</a></div>`:''}

 tabs(r);
 document.getElementById('app').innerHTML=r.v==='member'?vMember(r.p):r.v==='outreach'?vCall(r.p):vQueue();

   if(d.inv==='s2-undo'){v.s2.done=false;render();return;}
   if(d.inv==='s3'){if(!/\d{3}-?\d{3}-?\d{4}/.test(v.s3.num)){toast('Enter a 10-digit number, like 216-555-0188.');return;}v.s3.done=true;render();toast('Saved as unverified. Member calling is unblocked.');return;}
   if(d.inv==='s3-undo'){v.s3.done=false;render();return;}
  }
 }
 if(r.v==='outreach'){
  const p=r.p,s=sess(p);
  if(d.out){s.out=d.out;render();return;}
  if(d.atab){s.tab=d.atab;render();return;}
  if(d.copy){const num=d.copy;const ok=()=>toast('Copied '+num);try{navigator.clipboard.writeText(num).then(ok,()=>toast('Number: '+num));}catch(_){toast('Number: '+num);}return;}
  if(d.act==='sample'){s.notes=p.sample;s.route=p.sampleRoute;s.out='connected';render();toast('Sample notes added. Now click Auto-draft assessment.');return;}
  if(d.act==='autodraft'){if(!S.ai){toast('AI assist is paused.');return;}const x=extract(p,s.notes);s.ai=x;s.rej={};s.drafted=true;s.scan=true;s.tab='a';if(s.out==='prep'&&x.outcome)s.out='connected';render();s.scan=false;const n=Object.keys(x).length;toast(n?`Drafted ${n} fields from your notes. Review the yellow ones.`:'No fields recognised. Add more detail, or fill fields with Edit.');return;}
  if(d.fedit){s.editing=d.fedit;render();const f=document.getElementById('fe-'+d.fedit);if(f)f.focus();return;}
  if(d.fcancel){s.editing=null;render();return;}
  if(d.fsave){const v=(document.getElementById('fe-'+d.fsave)||{}).value||'';if(v.trim())s.ed[d.fsave]=v.trim();else delete s.ed[d.fsave];s.editing=null;render();return;}
  if(d.frej){s.rej[d.frej]=true;render();toast('AI value rejected. The field falls back to records or unknown.');return;}
  if(d.act==='approve'){if(!s.ok){toast('Tick the review box first.');return;}s.submitted=true;s.tab='a';render();toast('Approved. Saving to the CM system…');setTimeout(()=>{s.ack=true;s.rcpt='#'+p.id.slice(4)+'-'+(1000+Math.floor(Math.random()*8999));if(route().p===p)render();toast('The CM system received the assessment and note.');},1400);return;}
  if(d.act==='newnote'){delete S.sess[p.key];render();return;}
 }
});
document.addEventListener('change',e=>{
 const t=e.target,r=route();
 if(t.id==='t-ai'){S.ai=!t.checked;render();toast(S.ai?'AI assist is back on.':'AI paused. Maria can still fill and approve the form.');return;}
 if(t.id==='t-pbm'){S.pbm=!t.checked;render();toast(S.pbm?'Pharmacy feed restored.':'Pharmacy feed down. Fill facts now show as unknown.');return;}
 if(r.v!=='outreach')return;
 const s=sess(r.p);
 if(t.id==='ok-chk'){s.ok=t.checked;const b=document.getElementById('approve-btn');if(b)b.disabled=!t.checked;return;}
 if(t.name==='route'){s.route=+t.value;if(!outs(r.p,s).includes(s.out))s.out='prep';render();return;}
});
document.addEventListener('input',e=>{
 const t=e.target,r=route();
 if(t.id==='q'){S.q=t.value;keep('q',render);return;}
 if(r.v==='member'){
  if(t.dataset.what){const x=res(r.p,t.dataset.what);x.what=t.value;const b=document.getElementById('confirm-'+t.dataset.what);if(b)b.disabled=!(x.pick&&x.what.trim()&&Object.values(x.who).some(Boolean));return;}
  if(t.id==='inv-reason'){inv(r.p).s1.reason=t.value;return;}
  if(t.id==='inv-num'){inv(r.p).s3.num=t.value;return;}
 }
 if(r.v==='outreach'&&t.id==='notes'){const s=sess(r.p);s.notes=t.value;const b=document.getElementById('draft-btn');if(b)b.disabled=!S.ai||!t.value.trim();}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id&&e.target.id.startsWith('fe-')){e.preventDefault();const b=document.querySelector(`[data-fsave="${e.target.id.slice(3)}"]`);if(b)b.click();}});
document.getElementById('dlg').addEventListener('click',e=>{if(e.target.id==='dlg')e.target.close();});
window.addEventListener('hashchange',()=>{const d=document.getElementById('dlg');if(d.open)d.close();render();
 if(S.tour>=0){const tg=document.querySelector(TOUR[S.tour].el);if(tg)tg.scrollIntoView({block:'center',behavior:'smooth'});}else window.scrollTo(0,0);});
render();
})();
</script>
