<title>HiLabs Care Workbench</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Clickable prototype of the HiLabs Case Management Workbench: work queue, member 360 and outreach with fictional members.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: sticky navy app bar + Decide→Know→Do step tabs; content column of 1240px.
   Queue = list + explanation pane. Member 360 = brief/evidence + actions/context. Outreach = route | assessment | note. */
:root{
  --bg:#F3F5FA;--surface:#FFFFFF;--surface-2:#F7F8FC;
  --ink:#0B1533;--ink-2:#3A4563;--line:#D3D9E8;--line-2:#AEB8D0;
  --navy:#0E1A4F;--navy-2:#1B2A6B;--on-navy:#FFFFFF;--on-navy-2:#C9D3F5;
  --blue:#1D4ED8;--blue-ink:#1E3A8A;--blue-bg:#E3ECFF;
  --violet:#5B21B6;--violet-bg:#EDE7FB;
  --green:#166534;--green-bg:#DCFCE7;--green-line:#4ADE80;
  --warn-ink:#78350F;--warn-bg:#FEF3C7;--warn-line:#F59E0B;
  --risk-ink:#991B1B;--risk-bg:#FEE2E2;--risk-line:#EF4444;
  --gray-bg:#E8EBF2;--focus:#2563EB;--shadow:0 1px 2px rgba(11,21,51,.06),0 4px 16px rgba(11,21,51,.06);
  --font:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--font)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--navy)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
table{font-size:inherit}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono,.src{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tnum{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}

/* App bar */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;box-shadow:0 1px 0 var(--line)}
.bar{background:var(--navy);color:var(--on-navy)}
.bar .wrap{display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;color:var(--on-navy);text-decoration:none;font-weight:800;font-size:17px;letter-spacing:-.2px;margin-right:auto}
.logo{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--on-navy);color:var(--navy);font-weight:800;font-size:14px}
.who{font-size:14px;color:var(--on-navy-2)}
.who strong{color:var(--on-navy);font-weight:700}
.clock{font-size:13px;font-weight:700;border:1px solid var(--navy-2);background:var(--navy-2);color:var(--on-navy);padding:4px 10px;border-radius:999px}
.steps{background:var(--surface)}
.steps .wrap{display:flex;gap:4px;overflow-x:auto}
.step{display:flex;align-items:center;gap:8px;padding:12px 14px 10px;border-bottom:3px solid transparent;text-decoration:none;color:var(--ink-2);font-weight:700;font-size:15px;white-space:nowrap}
.step:hover{color:var(--ink);background:var(--surface-2)}
.step.on{color:var(--ink);border-bottom-color:var(--blue)}
.step small{font-size:11px;font-weight:800;letter-spacing:.8px;padding:2px 7px;border-radius:5px}
.step .who-ctx{font-weight:600;color:var(--ink-2)}
.t-decide{background:var(--violet-bg);color:var(--violet)}
.t-know{background:var(--blue-bg);color:var(--blue-ink)}
.t-do{background:var(--green-bg);color:var(--green)}

/* Walkthrough strip */
.tour{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-block:12px 0;font-size:13px;color:var(--ink-2)}
.tour b{color:var(--ink);font-weight:700;margin-right:2px}
.tour a{display:inline-flex;gap:6px;align-items:center;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);padding:4px 10px;border-radius:999px;font-weight:600}
.tour a:hover{border-color:var(--blue)}
.tour a.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tour a span{font-family:var(--mono);font-size:12px;opacity:.85}

main{padding-block:20px 40px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 20px;flex-wrap:wrap;margin-bottom:18px}
.head h1{font-size:28px;line-height:1.2;letter-spacing:-.4px}
.head p{margin:6px 0 0;color:var(--ink-2);max-width:68ch}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--ink-2);margin-bottom:6px;display:flex;gap:8px;align-items:center}

/* Generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.card>h2,.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:16px;font-weight:800;padding:14px 16px 0}
.card-b{padding:12px 16px 16px}
.sub{font-size:13px;color:var(--ink-2);font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 14px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:700;font-size:14px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--on-navy)}
.btn.primary:hover{background:var(--blue-ink)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:7px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.src{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line-2);background:var(--surface);color:var(--blue-ink);border-radius:6px;padding:1px 7px;font-size:12px;font-weight:600;line-height:1.6}
.src::before{content:"↗";font-family:var(--font);font-weight:700}
.src:hover{background:var(--blue-bg);border-color:var(--blue)}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:6px;padding:1px 8px;white-space:nowrap;border:1px solid transparent}
.st b{font-size:13px}
.st-ok{background:var(--green-bg);color:var(--green);border-color:var(--green-line)}
.st-single{background:var(--blue-bg);color:var(--blue-ink);border-color:#9DB6F5}
.st-conflict{background:var(--warn-bg);color:var(--warn-ink);border-color:var(--warn-line)}
.st-unknown{background:var(--gray-bg);color:var(--ink);border-color:var(--line-2)}
.fr{font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;white-space:nowrap;border:1px solid var(--line)}
.fr-fresh{color:var(--green);background:var(--surface)}
.fr-lag{color:var(--ink-2);background:var(--surface)}
.fr-stale{color:var(--warn-ink);background:var(--warn-bg);border-color:var(--warn-line)}
.fr-down,.fr-missing{color:var(--risk-ink);background:var(--risk-bg);border-color:#FCA5A5}
.legend{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--ink-2)}
.score{display:inline-grid;place-items:center;min-width:46px;padding:4px 8px;border-radius:8px;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.sc-hi{background:var(--risk-bg);color:var(--risk-ink);border:1px solid #FCA5A5}
.sc-md{background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--warn-line)}
.sc-lo{background:var(--gray-bg);color:var(--ink);border:1px solid var(--line-2)}
.avatar{display:grid;place-items:center;flex-shrink:0;width:40px;height:40px;border-radius:50%;font-weight:800;color:var(--on-navy)}
.av-risk{background:#9F1239}.av-warn{background:#B45309}.av-gray{background:#475569}.av-blue{background:var(--blue-ink)}
.av-lg{width:56px;height:56px;font-size:22px}

/* Queue */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.tile .n{font-size:28px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .l{font-size:13px;color:var(--ink-2);font-weight:600}
.tile.hot{border:2px solid var(--risk-line)}
.tile.hot .n{color:var(--risk-ink)}
.qgrid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:16px;align-items:start}
.tools{display:flex;gap:10px 12px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:14px 16px 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700}
.chip span{margin-left:5px;font-variant-numeric:tabular-nums;opacity:.8}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.search{display:flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:9px;padding:6px 10px;background:var(--surface);min-width:0;flex:0 1 220px}
.search input{border:0;outline:0;background:transparent;width:100%;font-size:14px;min-width:0}
.search input::placeholder{color:var(--ink-2)}
.qhead,.qrow{display:grid;grid-template-columns:62px minmax(0,1fr) minmax(0,1.5fr) 92px;gap:12px;align-items:center;padding:10px 16px}
.qhead{font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-2);background:var(--surface-2);border-block:1px solid var(--line)}
.qrow{width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:var(--surface);border-left:4px solid transparent;padding-left:12px}
.qrow:last-child{border-bottom:0;border-radius:0 0 12px 12px}
.qrow:hover{background:var(--surface-2)}
.qrow[aria-pressed="true"]{background:var(--blue-bg);border-left-color:var(--blue)}
.qname{display:flex;align-items:center;gap:10px;min-width:0}
.qname strong{display:block;font-size:16px}
.qname small{display:block;font-size:13px;color:var(--ink-2)}
.qwhy{font-size:14px;font-weight:600}
.qwhy.warn{color:var(--warn-ink)}
.qwhy small{display:block;font-weight:500;color:var(--ink-2);font-size:13px}
.qdue{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.qdue small{display:block;font-weight:600;font-size:12px;color:var(--ink-2)}
.empty{padding:28px 16px;text-align:center;color:var(--ink-2)}
.pane{position:sticky;top:calc(env(safe-area-inset-top,0px) + 118px)}
.pane-top{display:flex;gap:12px;align-items:center;padding:16px 16px 4px}
.pane-top h2{font-size:20px}
.bars{display:grid;gap:8px;margin:6px 0 10px}
.barl{display:grid;grid-template-columns:112px minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:13px}
.barl .tr{height:10px;border-radius:5px;background:var(--gray-bg);overflow:hidden}
.barl .fi{height:100%;background:var(--violet);border-radius:5px}
.barl b{text-align:right;font-variant-numeric:tabular-nums}
.barl span{font-weight:700}
.why-list{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:13px;color:var(--ink-2)}
.why-list b{color:var(--ink)}
.note-box{font-size:13px;background:var(--violet-bg);color:var(--violet);border-radius:8px;padding:8px 10px;font-weight:600;margin-top:10px}
.sec-t{font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--ink-2);margin:16px 0 8px}
.acts{display:grid;gap:8px}
.act{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.act-t{font-weight:700;font-size:14px}
.act-d{font-size:13px;color:var(--ink-2)}
.act .btnrow{margin-top:8px}
.act.accepted{border-color:var(--green-line);background:var(--green-bg)}
.act.dismissed{background:var(--surface-2)}
.act.dismissed .act-t{text-decoration:line-through;color:var(--ink-2)}
.act-s{font-size:13px;font-weight:700;margin-top:6px}
.act.accepted .act-s{color:var(--green)}
.act input{width:100%;border:1px solid var(--line-2);border-radius:8px;padding:6px 9px;font-size:14px;margin-top:6px}
.reasons{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

/* Member 360 */
.back{display:inline-flex;gap:6px;font-weight:700;font-size:14px;text-decoration:none;margin-bottom:12px}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:14px 20px;flex-wrap:wrap;padding:16px}
.mid{display:flex;gap:14px;align-items:center;min-width:0}
.mid h1{font-size:26px;letter-spacing:-.3px}
.mid p{margin:2px 0 0;color:var(--ink-2);font-size:14px}
.mmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.pill{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--gray-bg);color:var(--ink)}
.banner{display:flex;gap:12px;align-items:flex-start;border-radius:12px;padding:14px 16px;margin:14px 0;border:1px solid;border-left-width:6px}
.banner.warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn-ink)}
.banner.risk{background:var(--risk-bg);border-color:var(--risk-line);color:var(--risk-ink)}
.banner .ic{font-size:22px;line-height:1;font-weight:800}
.banner h2{font-size:17px;margin-bottom:4px}
.banner p{margin:0 0 8px;color:var(--ink)}
.banner .never{font-size:13px;font-weight:700;color:var(--ink)}
.mgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.col{display:grid;gap:16px;min-width:0}
.brief{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.brief li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:start}
.brief .num{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--blue-bg);color:var(--blue-ink);font-size:12px;font-weight:800}
.brief .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.ai-tag{font-size:11px;font-weight:800;letter-spacing:.6px;color:var(--blue-ink);background:var(--blue-bg);padding:2px 8px;border-radius:5px}
.paused{font-size:14px;background:var(--gray-bg);border-radius:8px;padding:10px 12px}
.tscroll{overflow-x:auto}
.ev{width:100%;border-collapse:collapse;min-width:560px}
.ev th{font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-2);text-align:left;padding:8px 10px;background:var(--surface-2);border-block:1px solid var(--line)}
.ev td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
.ev tr:last-child td{border-bottom:0}
.ev td:first-child{font-weight:700;white-space:nowrap}
.ev .asof{font-size:13px;color:var(--ink-2);white-space:nowrap}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.checks li{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.checks .n{display:grid;place-items:center;flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--green);color:var(--on-navy);font-size:12px;font-weight:800}
.kv{font-size:14px;display:grid;gap:3px}
.kv .w{font-size:13px;font-weight:700;color:var(--warn-ink);background:var(--warn-bg);border-radius:6px;padding:4px 8px;margin-top:6px}
.tl{list-style:none;margin:0;padding:0 0 0 4px}
.tl li{position:relative;padding:0 0 14px 22px;border-left:2px solid var(--line)}
.tl li:last-child{padding-bottom:0}
.tl li::before{content:"";position:absolute;left:-7px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--blue);border:2px solid var(--surface)}
.tl h3{font-size:14px}
.tl p{margin:2px 0 4px;font-size:13px;color:var(--ink-2)}
.dup{font-size:12px;font-weight:700;background:var(--gray-bg);border-radius:5px;padding:1px 7px;margin-left:6px}

/* Outreach */
.ogrid{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.1fr) minmax(0,1.15fr);gap:16px;align-items:start}
.routes{display:grid;gap:8px}
.route{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:var(--surface)}
.route input{margin:3px 0 0;accent-color:var(--blue);width:16px;height:16px}
.route.sel{border-color:var(--blue);background:var(--blue-bg)}
.route.blocked{background:var(--risk-bg);border-color:#FCA5A5;cursor:not-allowed}
.route strong{display:block;font-size:14px}
.route .num{font-family:var(--mono);font-size:15px;font-weight:600}
.route small{display:block;font-size:13px;color:var(--ink-2)}
.route.blocked small{color:var(--risk-ink);font-weight:700}
.script{font-size:14px;background:var(--surface-2);border:1px solid var(--line);border-left:4px solid var(--ink-2);border-radius:8px;padding:10px 12px;margin-top:10px}
.field{display:grid;gap:5px;margin-top:12px}
.field label,.flabel{font-size:13px;font-weight:800}
.field select,.field textarea,.field input{width:100%;border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;background:var(--surface);font-size:14px}
.field textarea{min-height:70px;resize:vertical}
.hint{font-size:13px;color:var(--ink-2)}
.counter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.pf{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.pf:last-child{border-bottom:0}
.pf .lab{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-2)}
.pf .val{font-size:14px;font-weight:600}
.pf .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cfm{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;white-space:nowrap}
.cfm input{width:16px;height:16px;accent-color:var(--green)}
.unc{font-size:11px;font-weight:800;color:var(--warn-ink);background:var(--warn-bg);border-radius:5px;padding:1px 6px}
.okc{font-size:11px;font-weight:800;color:var(--green);background:var(--green-bg);border-radius:5px;padding:1px 6px}
.draft{white-space:pre-wrap;font-size:14px;line-height:1.6;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;max-height:420px;overflow:auto}
.draft-ta{width:100%;min-height:300px;border:1px solid var(--line-2);border-radius:10px;padding:12px;font-size:14px;line-height:1.6}
.review{border:2px solid var(--blue);border-radius:10px;padding:12px;margin-top:12px;background:var(--blue-bg)}
.review label{display:flex;gap:8px;align-items:flex-start;font-size:14px;font-weight:600}
.review input{width:18px;height:18px;margin-top:2px;accent-color:var(--blue)}
.writes{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.writes li{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:6px 10px;border-radius:8px;background:var(--green-bg);color:var(--green);font-weight:700}
.writes li.pending{background:var(--warn-bg);color:var(--warn-ink)}
.writes li.partial{background:var(--warn-bg);color:var(--warn-ink)}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:16px;font-size:13px;font-weight:700}
.flow span{border:1px solid var(--line-2);border-radius:8px;padding:4px 9px;background:var(--surface)}
.flow i{font-style:normal;color:var(--ink-2)}

/* Footer, dialog, toast */
footer{border-top:1px solid var(--line);background:var(--surface)}
footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px 20px;flex-wrap:wrap;padding-block:14px;font-size:13px;color:var(--ink-2)}
.toggles{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.toggles label{display:flex;gap:6px;align-items:center;font-weight:700;color:var(--ink)}
.toggles input{width:16px;height:16px;accent-color:var(--blue)}
dialog{border:0;border-radius:14px;padding:0;width:min(560px,calc(100vw - 32px));max-height:85vh;color:var(--ink);background:var(--surface);box-shadow:0 24px 64px rgba(11,21,51,.35)}
dialog::backdrop{background:rgba(11,21,51,.55)}
.dh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:16px 18px;border-bottom:1px solid var(--line)}
.dh h2{font-size:18px}
.dh p{margin:2px 0 0;font-size:13px;color:var(--ink-2)}
.db{padding:14px 18px 18px;overflow:auto}
.rf{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr);gap:4px 12px;margin:0}
.rf dt{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-2);padding:6px 0;border-bottom:1px solid var(--line)}
.rf dd{margin:0;font-size:14px;padding:6px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.x{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;width:34px;height:34px;font-size:18px;line-height:1}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);max-width:calc(100vw - 32px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:50}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1060px){
  .ogrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .ogrid>.card:last-child{grid-column:1/-1}
}
@media (max-width:900px){
  .qgrid,.mgrid{grid-template-columns:minmax(0,1fr)}
  .pane{position:static}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  .head h1{font-size:23px}
  .appbar{position:static}
  .who{display:none}
  .qhead{display:none}
  .qrow{grid-template-columns:54px minmax(0,1fr) auto;grid-template-areas:"s n d" "s w w"}
  .qrow .score{grid-area:s;align-self:start}
  .qrow .qname{grid-area:n}.qrow .qwhy{grid-area:w}.qrow .qdue{grid-area:d}
  .qname .avatar{display:none}
  .ogrid{grid-template-columns:minmax(0,1fr)}
  .ogrid>.card:last-child{grid-column:auto}
  .barl{grid-template-columns:90px minmax(0,1fr) 48px}
  .rf{grid-template-columns:minmax(0,1fr)}
  .rf dt{border-bottom:0;padding-bottom:0}
  .mid h1{font-size:22px}
  .search{flex:1 1 100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

 const L=[];

 if(uc.length){L.push('FROM SOURCES, NOT YET CONFIRMED');uc.forEach(f=>L.push(`- ${f.l}: ${f.v} [${f.src}]`));L.push('');}
 const answered=p.ask.filter((a,i)=>conn&&(s.ans[i]||'').trim());
 if(answered.length){L.push(r.s==='ok'&&/Caregiver|team|agency|supplier/i.test(r.l)?'REPORTED BY CONTACT':'MEMBER REPORTED');p.ask.forEach((a,i)=>{const v=(s.ans[i]||'').trim();if(conn&&v)L.push(`- ${a.l}: ${v}`);});L.push('');}
 if(conn&&s.findings.trim()){L.push('RN FINDINGS');L.push(s.findings.trim());L.push('');}
 const unk=p.ask.filter((a,i)=>!(conn&&(s.ans[i]||'').trim())).map(a=>a.l);
 if(unk.length){L.push('STILL UNKNOWN');unk.forEach(u=>L.push(`- ${u}`));L.push('');}
 const a=acts(p).filter(x=>x.s==='accepted').map(x=>x.t);
 L.push('NEXT STEPS');(a.length?a:p.steps.slice(0,3)).forEach(x=>L.push(`- ${x}`));
 L.push('');
 L.push('Every line above comes from an entry Maria made or a linked source record. Nothing is inferred.');
 return L.join('\n');
}
function vOutreach(p){
 const s=sess(p),r=p.routes[s.route],conn=s.outcome==='connected',locked=s.signed;
 const nConf=p.prefill.filter((f,i)=>s.conf[i]).length,nAns=p.ask.filter((a,i)=>(s.ans[i]||'').trim()).length;
 const routes=p.routes.map((x,i)=>`<label class="route${i===s.route?' sel':''}${x.s==='blocked'?' blocked':''}" for="rt-${i}"><input type="radio" name="route" id="rt-${i}" value="${i}" ${i===s.route?'checked':''} ${x.s==='blocked'||locked?'disabled':''}><span><strong>${i+1}. ${esc(x.l)}</strong><span class="num">${esc(x.num)}</span><small>${x.s==='blocked'?'✕ ':''}${esc(x.note)}</small></span></label>`).join('');
 const partial=s.outcome!=='connected'||nAns<p.ask.length;
 const writes=[['Identity & consent','✓'],['Assessment',partial?'Saved as PARTIAL':'Complete'],['Goal & barrier',(s.ans[p.ask.length-1]||'').trim()&&conn?'✓':'Open'],['Care plan','✓ updated'],['Task · owner · due','✓ Maria'],['Signed note','✓ signed'],['Audit + CM writeback',s.ack?'✓ Acknowledged · '+s.receipt:'Pending…']];
 let noteArea;
 if(s.signed){
  noteArea=`<div class="draft" tabindex="0" aria-label="Signed note">${esc(S.ai?draftNote(p,s):s.manual)}</div>
  <div class="sec-t">Captured once, written to all seven</div>
  <ul class="writes">${writes.map(([l,v])=>`<li class="${/Pending/.test(v)?'pending':/PARTIAL|Open/.test(v)?'partial':''}"><span>${l}</span><span>${esc(v)}</span></li>`).join('')}</ul>
  <div class="btnrow" style="margin-top:12px"><button type="button" class="btn" data-act="newnote">Start a new note</button><a class="btn" href="#queue">Back to queue</a></div>`;
 }else{
  const draft=S.ai?`<div class="draft" id="draft" tabindex="0" aria-label="Draft note">${esc(draftNote(p,s))}</div>`:`<label class="sr" for="manual">Manual note</label><textarea class="draft-ta" id="manual" placeholder="AI drafting is paused. Write the note yourself; the fields and sources on this page are unchanged.">${esc(s.manual)}</textarea>`;
  const can=S.ai||s.manual.trim();
  noteArea=draft+(s.review?`<div class="review"><label for="rev"><input type="checkbox" id="rev"> I read every line. It matches what happened and nothing is invented.</label><div class="btnrow" style="margin-top:10px"><button type="button" class="btn primary" id="sign" data-act="sign" disabled>Sign and save</button><button type="button" class="btn" data-act="unreview">Keep editing</button></div></div>`:`<div class="btnrow" style="margin-top:12px"><button type="button" class="btn primary" data-act="review" ${can?'':'disabled'}>Review and sign</button></div>`);
 }
 return mHead(p,'#member-'+p.key)+
 `<div class="banner ${p.banner.tone}" style="margin-top:14px"><span class="ic" aria-hidden="true">${p.banner.icon}</span><div><h2 style="font-size:15px;margin:0">${esc(p.banner.title)}</h2></div></div>
 <div class="ogrid">
  <section class="card"><h2>1 · Contact plan</h2><div class="card-b">
   <div class="sec-t" style="margin-top:0">Permitted routes, in order</div>
   <div class="routes" role="radiogroup" aria-label="Contact route">${routes}</div>
   ${r.s==='gated'||p.script&&s.route===0?`<div class="script"><strong>Neutral script</strong><br>${esc(p.script)}</div>`:''}
   <div class="btnrow" style="margin-top:10px"><button type="button" class="btn sm" data-copy="${esc(r.num.replace(/[^0-9-]/g,''))}">Copy number</button></div>
   <div class="field"><label for="outcome">Contact outcome</label><select id="outcome" ${locked?'disabled':''}>${outcomes(p,s).map(o=>`<option value="${o}" ${o===s.outcome?'selected':''}>${OUT[o]}</option>`).join('')}</select><span class="hint">“Preparation only” never records a completed contact or assessment.</span></div>
  </div></section>
  <section class="card"><h2>2 · Assessment</h2><div class="card-b">
   <div class="counter"><span class="pill">${p.prefill.length} pre-filled here</span><span class="pill">${nConf} confirmed</span><span class="pill">${nAns} of ${p.ask.length} asked</span></div>
   <p class="hint" style="margin:0 0 6px">Full form: about 22 of 40 fields pre-filled from sources; about 18 need the conversation. Showing the ones that matter for this call.</p>
   ${p.prefill.map((f,i)=>`<div class="pf"><div><div class="lab">${esc(f.l)}</div><div class="val">${esc(f.v)}</div><div class="meta">${src(f.src)} ${s.conf[i]&&conn?'<span class="okc">CONFIRMED</span>':'<span class="unc">UNCONFIRMED</span>'}</div></div><label class="cfm" for="cf-${i}"><input type="checkbox" id="cf-${i}" data-conf="${i}" ${s.conf[i]?'checked':''} ${!conn||locked?'disabled':''}> Confirmed</label></div>`).join('')}
   <div class="sec-t">Ask on the call</div>
   ${p.ask.map((a,i)=>`<div class="field" style="margin-top:8px"><label for="ans-${i}">${esc(a.l)}</label><input id="ans-${i}" data-ans="${i}" value="${esc(s.ans[i]||'')}" placeholder="${esc(a.ph)}" ${locked?'disabled':''}></div>`).join('')}
   <div class="field"><label for="findings">RN findings</label><textarea id="findings" placeholder="What you verified. Leave unknowns unresolved." ${locked?'disabled':''}>${esc(s.findings)}</textarea></div>
   <p class="hint" style="margin:8px 0 0">${conn?'Answers and confirmations go into the note.':'Set the outcome to Connected to confirm fields; answers are kept but not written to the note until then.'}</p>
  </div></section>
  <section class="card"><h2>3 · Note <span class="ai-tag">${S.ai?'AI DRAFT · RN SIGNS':'MANUAL · AI PAUSED'}</span></h2><div class="card-b">${noteArea}</div></section>
 </div>
 <div class="flow" aria-label="Capture once"><span>Identity &amp; consent</span><i>→</i><span>Assessment</span><i>→</i><span>Goal &amp; barrier</span><i>→</i><span>Care plan</span><i>→</i><span>Task · owner · due</span><i>→</i><span>Signed note</span><i>→</i><span>Audit · CM writeback</span></div>`;
}

/* ---------------- Render ---------------- */
function render(keepFocus){
 const r=route();
 if(r.p)S.cur=r.p.key;
 chrome(r);
 const app=document.getElementById('app');
 const act=document.activeElement,id=act&&act.id,pos=act&&act.selectionStart;
 app.innerHTML=r.v==='member'?vMember(r.p):r.v==='outreach'?vOutreach(r.p):vQueue();
 document.title=(r.p?r.p.name+' · ':'')+'HiLabs Care Workbench';
 if(keepFocus&&id){const el=document.getElementById(id);if(el){el.focus();try{if(pos!=null)el.setSelectionRange(pos,pos);}catch(_){}}}
}
function openSrc(id){
 const r=R[id],d=document.getElementById('dlg');if(!r)return;
 d.innerHTML=`<div class="dh"><div><h2 id="dlg-t" class="mono">${id}</h2><p>${esc(r[0])} · ${esc(r[1])} · fictional record</p></div><button type="button" class="x" data-act="close" aria-label="Close">×</button></div><div class="db"><dl class="rf">${r[2].map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl><p class="hint" style="margin:12px 0 0">Source-reported data is shown as received. It is not clinician-confirmed until Maria confirms it.</p></div>`;
 d.showModal();
}

/* ---------------- Events ---------------- */
document.addEventListener('click',e=>{
 const t=e.target.closest('button,a');if(!t)return;
 const d=t.dataset,r=route(),p=r.p||P[S.sel];
 if(d.src){openSrc(d.src);return;}
 if(d.act==='close'){document.getElementById('dlg').close();return;}
 if(d.filter){S.filter=d.filter;render();return;}
 if(d.sel){S.sel=d.sel;render();return;}
 if(d.act==='clear'){S.filter='all';S.q='';render();return;}
 const a=r.v==='queue'?acts(P[S.sel]):null;
 if(a){
  if(d.accept){a[+d.accept].s='accepted';render();toast('Accepted. Task created for Maria.');return;}
  if(d.edit){a[+d.edit].s='editing';render();return;}
  if(d.save){const v=document.getElementById(`edit-${S.sel}-${d.save}`).value.trim();if(v)a[+d.save].t=v;a[+d.save].s='accepted';render();toast('Edited and accepted.');return;}
  if(d.dismiss){a[+d.dismiss].s='dismissing';render();return;}
  if(d.reason){a[+d.reason].s='dismissed';a[+d.reason].reason=d.r;render();toast('Dismissed. Reason logged for rule tuning.');return;}
  if(d.undo){const i=+d.undo;a[i].s='open';a[i].t=P[S.sel].actions[i].t;render();return;}
 }
 if(r.v==='outreach'){
  const s=sess(p);
  if(d.copy){const num=d.copy;const done=()=>toast('Copied '+num);if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(num).then(done,()=>toast('Number: '+num));}else toast('Number: '+num);return;}
  if(d.act==='review'){s.review=true;render();return;}
  if(d.act==='unreview'){s.review=false;render();return;}
  if(d.act==='sign'){s.signed=true;s.review=false;render();toast('Signed. Writing back to the CM system…');setTimeout(()=>{s.ack=true;s.receipt='DEMO-'+p.id.slice(4)+'-'+Math.floor(1000+Math.random()*8999);if(route().p===p)render();toast('CM system acknowledged the note.');},1400);return;}
  if(d.act==='newnote'){delete S.sess[p.key];render();return;}
 }
});
document.addEventListener('change',e=>{
 const t=e.target,r=route();
 if(t.id==='t-ai'){S.ai=!t.checked;render();toast(S.ai?'AI assist on.':'AI paused. Manual path stays available.');return;}
 if(t.id==='t-pbm'){S.pbm=!t.checked;render();toast(S.pbm?'Pharmacy feed restored.':'Pharmacy feed down: fill facts now show “unknown”.');return;}
 if(t.id==='rev'){const b=document.getElementById('sign');if(b)b.disabled=!t.checked;return;}
 if(r.v!=='outreach')return;
 const s=sess(r.p);
 if(t.name==='route'){s.route=+t.value;if(!outcomes(r.p,s).includes(s.outcome))s.outcome='prep';render();return;}
 if(t.id==='outcome'){s.outcome=t.value;render();return;}
 if(t.dataset.conf){s.conf[+t.dataset.conf]=t.checked;render();return;}
});
document.addEventListener('input',e=>{
 const t=e.target,r=route();
 if(t.id==='q'){S.q=t.value;render(true);return;}
 if(r.v!=='outreach')return;
 const s=sess(r.p);
 if(t.dataset.ans){s.ans[+t.dataset.ans]=t.value;}
 else if(t.id==='findings'){s.findings=t.value;}
 else if(t.id==='manual'){s.manual=t.value;const b=document.querySelector('[data-act="review"]');if(b)b.disabled=!t.value.trim();return;}
 else return;
 s.review=false;
 const dr=document.getElementById('draft');if(dr)dr.textContent=draftNote(r.p,s);
 const rv=document.querySelector('.review');if(rv){render(true);}
});
document.getElementById('reset').addEventListener('click',()=>{S=fresh();document.getElementById('t-ai').checked=false;document.getElementById('t-pbm').checked=false;location.hash='queue';render();toast('Demo reset.');});
document.getElementById('dlg').addEventListener('click',e=>{if(e.target.id==='dlg')e.target.close();});
window.addEventListener('hashchange',()=>{const d=document.getElementById('dlg');if(d.open)d.close();render();window.scrollTo(0,0);});
render();
})();
</script>
