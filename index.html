<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Care Workbench</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Clickable concept prototype for the HiLabs APM case 2026–27: work queue, Member 360 and outreach for five fictional members.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: navy→indigo app bar (deck cover) + Decide/Know/Do tabs; 1240px column.
   Queue = ranked list + "why" pane. Member 360 = issue → brief/evidence → actions/context. Call = steps left, live note right. */
:root{
  --navy:#121957;--navy-deep:#0B0F3F;--indigo:#381E8C;
  --blue:#0053EF;--blue-ink:#0A3FB8;--blue-50:#EDF2FE;--blue-25:#F6F8FE;
  --violet:#603CE4;--violet-50:#EFEBFD;
  --red:#981A1A;--red-50:#FDF1F1;--red-100:#FDE1E1;--red-line:#F2A7A7;
  --amber-50:#FDF2C6;--amber-ink:#5F3B00;--amber-line:#E7B53C;--amber-dot:#9A5B00;
  --green-50:#DBFBE6;--green-ink:#14532D;--green-line:#7AD69C;
  --ink:#0E1440;--ink-2:#3B4266;--line:#D6DDF3;--line-2:#AEB8DA;
  --bg:#F6F8FE;--surface:#FFFFFF;--on-dark:#FFFFFF;--on-dark-2:#C9D1F4;
  --display:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ring:0 0 0 3px var(--surface),0 0 0 6px var(--violet);
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--display)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--navy-deep)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
table{font-size:inherit}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tnum{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}

/* ---------- App bar ---------- */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30}
.bar{background:linear-gradient(100deg,var(--navy-deep) 0%,var(--navy) 55%,var(--indigo) 100%);color:var(--on-dark)}
.bar .wrap{display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;color:var(--on-dark);text-decoration:none;margin-right:auto}
.brand b{font-weight:800;font-size:17px;letter-spacing:-.2px}
.brand small{display:block;font-size:11px;font-weight:600;color:var(--on-dark-2);letter-spacing:.3px}
.mark{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--blue);color:var(--on-dark);font-weight:800;font-size:13px}
.who{font-size:14px;color:var(--on-dark-2)}
.who strong{color:var(--on-dark)}
.clock{font-size:13px;font-weight:700;padding:5px 11px;border-radius:999px;border:1px solid var(--on-dark-2)}
.demo-btn{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--on-dark);color:var(--navy);font-weight:800;font-size:14px;padding:7px 14px;border-radius:999px}
.demo-btn:hover{background:var(--blue-50)}
.demo-btn i{font-style:normal;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--violet);color:var(--on-dark);font-size:11px}
.tabs{background:var(--surface);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:2px;overflow-x:auto}
.tab{display:flex;align-items:center;gap:8px;padding:12px 14px 10px;border-bottom:3px solid transparent;text-decoration:none;color:var(--ink-2);font-weight:700;white-space:nowrap}
.tab:hover{color:var(--ink);background:var(--blue-25)}
.tab.on{color:var(--ink);border-bottom-color:var(--blue)}
.tab .ctx{font-weight:600;color:var(--ink-2)}
.tag{font-size:11px;font-weight:800;letter-spacing:.8px;padding:2px 8px;border-radius:6px;color:var(--on-dark)}
.tag-decide{background:var(--violet)}.tag-know{background:var(--blue)}.tag-do{background:var(--navy)}

main{padding-block:22px 48px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 20px;flex-wrap:wrap;margin-bottom:18px}
.head h1{font-size:30px;line-height:1.15;letter-spacing:-.5px}
.head p{margin:6px 0 0;color:var(--ink-2);max-width:66ch}
.kicker{display:flex;gap:8px;align-items:center;font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--ink-2);margin-bottom:8px}

/* ---------- Shared pieces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0}
.ch{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px 10px;padding:13px 16px;border-radius:13px 13px 0 0;font-weight:800;font-size:16px}
.ch.navy{background:var(--navy);color:var(--on-dark)}
.ch.blue{background:var(--blue);color:var(--on-dark)}
.ch.plain{border-bottom:1px solid var(--line)}
.ch small{font-size:12px;font-weight:700;color:var(--on-dark-2)}
.ch.blue small{color:var(--on-dark)}
.cb{padding:14px 16px 16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:700;font-size:14px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--navy);background:var(--blue-25)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--on-dark)}
.btn.primary:hover{background:var(--blue-ink)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45}
.btn.primary:disabled:hover{background:var(--blue)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hint{font-size:13px;color:var(--ink-2)}
.src{white-space:nowrap;display:inline-flex;align-items:center;gap:3px;font-family:var(--mono);font-size:12px;font-weight:600;color:var(--blue-ink);background:var(--surface);border:1px solid var(--line-2);border-radius:6px;padding:1px 7px;line-height:1.6}
.src::before{content:"↗";font-family:var(--display);font-weight:800}
.src:hover{background:var(--blue-50);border-color:var(--blue)}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;border-radius:6px;padding:1px 8px;white-space:nowrap;border:1px solid}
.st b{font-size:13px}
.st-ok{background:var(--green-50);color:var(--green-ink);border-color:var(--green-line)}
.st-single{background:var(--blue-50);color:var(--blue-ink);border-color:var(--line-2)}
.st-conflict{background:var(--amber-50);color:var(--amber-ink);border-color:var(--amber-line)}
.st-unknown{background:var(--surface);color:var(--ink);border-color:var(--line-2);border-style:dashed}
.fr{font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;white-space:nowrap;border:1px solid var(--line)}
.fr-fresh{color:var(--green-ink)}
.fr-lag{color:var(--ink-2)}
.fr-stale{color:var(--amber-ink);background:var(--amber-50);border-color:var(--amber-line)}
.fr-down,.fr-missing{color:var(--red);background:var(--red-50);border-color:var(--red-line)}
.score{display:inline-grid;place-items:center;min-width:48px;padding:4px 9px;border-radius:9px;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;border:1px solid}
.sc-hi{background:var(--red-100);color:var(--red);border-color:var(--red-line)}
.sc-md{background:var(--amber-50);color:var(--amber-ink);border-color:var(--amber-line)}
.sc-lo{background:var(--blue-50);color:var(--navy);border-color:var(--line-2)}
.av{display:grid;place-items:center;flex-shrink:0;width:40px;height:40px;border-radius:50%;font-weight:800;color:var(--on-dark)}
.av-hi{background:var(--red)}.av-md{background:var(--amber-dot)}.av-lo{background:var(--violet)}
.av.lg{width:56px;height:56px;font-size:22px}
.pill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--blue-50);color:var(--navy)}
.spot{box-shadow:var(--ring)!important;border-radius:14px}

/* ---------- Queue ---------- */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.tile{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.tile .n{flex-shrink:0;display:grid;place-items:center;min-width:48px;height:48px;padding:0 8px;border-radius:999px;font-size:20px;font-weight:800;color:var(--on-dark);background:var(--blue);font-variant-numeric:tabular-nums}
.tile .l{font-size:14px;font-weight:600;line-height:1.3}
.tile.hot{background:var(--red-50);border-color:var(--red-line)}
.tile.hot .n{background:var(--red)}
.tile.v .n{background:var(--violet)}
.tile.k .n{background:var(--navy)}
.qgrid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:16px;align-items:start}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:14px 16px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.chip:hover{border-color:var(--navy)}
.chip span{margin-left:5px;font-variant-numeric:tabular-nums}
.chip.on{background:var(--navy);border-color:var(--navy);color:var(--on-dark)}
.search{display:flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:10px;padding:7px 10px;background:var(--surface);flex:0 1 230px;min-width:0}
.search input{border:0;outline:0;background:transparent;width:100%;min-width:0;font-size:14px}
.search input::placeholder{color:var(--ink-2)}
.qhead,.qrow{display:grid;grid-template-columns:64px minmax(0,1fr) minmax(0,1.5fr) 96px;gap:12px;align-items:center;padding:11px 16px}
.qhead{font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--on-dark);background:var(--navy)}
.qrow{width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:var(--surface);border-left:4px solid transparent;padding-left:12px}
.qrow:last-child{border-bottom:0;border-radius:0 0 14px 14px}
.qrow:hover{background:var(--blue-25)}
.qrow[aria-pressed="true"]{background:var(--blue-50);border-left-color:var(--blue)}
.qn{display:flex;align-items:center;gap:10px;min-width:0}
.qn strong{display:block;font-size:16px}
.qn small,.qw small{display:block;font-size:13px;color:var(--ink-2);font-weight:500}
.qw{font-size:14px;font-weight:700}
.qw.warn{color:var(--amber-ink)}
.qd{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.qd small{display:block;font-size:12px;font-weight:600;color:var(--ink-2)}
.empty{padding:28px 16px;text-align:center;color:var(--ink-2)}
.pane{position:sticky;top:calc(env(safe-area-inset-top,0px) + 124px)}
.ptop{display:flex;gap:12px;align-items:center}
.ptop h2{font-size:20px}
.ptop .sub{font-size:13px;color:var(--on-dark-2)}
.sect{font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--ink-2);margin:16px 0 8px}
.bars{display:grid;gap:8px}
.bl{display:grid;grid-template-columns:96px minmax(0,1fr) 56px;gap:10px;align-items:center;font-size:13px;font-weight:700}
.bl .tr{height:10px;border-radius:5px;background:var(--blue-50);overflow:hidden}
.bl .fi{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--blue),var(--violet))}
.bl b{text-align:right;font-variant-numeric:tabular-nums}
.why{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:5px;font-size:13px;color:var(--ink-2)}
.why b{color:var(--ink)}
.tie{margin-top:10px;font-size:13px;font-weight:700;color:var(--violet);background:var(--violet-50);border-radius:9px;padding:8px 10px}
.acts{display:grid;gap:8px}
.act{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.act-t{display:block;font-weight:700;font-size:14px}
.act-d{font-size:13px;color:var(--ink-2)}
.act .row{margin-top:8px}
.act.ok{background:var(--green-50);border-color:var(--green-line)}
.act.no{background:var(--blue-25)}
.act.no .act-t{text-decoration:line-through;color:var(--ink-2)}
.act-s{font-size:13px;font-weight:700;margin-top:6px}
.act.ok .act-s{color:var(--green-ink)}
.act input{width:100%;margin-top:6px;border:1px solid var(--line-2);border-radius:8px;padding:7px 9px;font-size:14px}

/* ---------- Member 360 ---------- */
.back{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px;text-decoration:none;margin-bottom:12px}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:14px 20px;flex-wrap:wrap;padding:16px}
.mid{display:flex;gap:14px;align-items:center;min-width:0}
.mid h1{font-size:26px;letter-spacing:-.3px}
.mid p{margin:2px 0 0;color:var(--ink-2);font-size:14px}
.mmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.explain{margin:12px 0 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--ink-2)}
.explain strong{color:var(--ink)}
.explain button{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:3px 11px;font-size:13px;font-weight:700;color:var(--blue-ink)}
.explain-box{flex-basis:100%;background:var(--blue-50);border:1px solid var(--line-2);border-radius:12px;padding:12px 14px;color:var(--ink)}
.explain-box ul{margin:6px 0 0;padding-left:18px}
.banner{display:flex;gap:12px;align-items:flex-start;border-radius:14px;padding:14px 16px;margin:14px 0;border:1px solid}
.banner.warn{background:var(--amber-50);border-color:var(--amber-line)}
.banner.risk{background:var(--red-50);border-color:var(--red-line)}
.banner .ic{display:grid;place-items:center;flex-shrink:0;width:30px;height:30px;border-radius:50%;font-weight:800;color:var(--on-dark)}
.banner.warn .ic{background:var(--amber-dot)}.banner.risk .ic{background:var(--red)}
.banner h2{font-size:17px;margin-bottom:4px}
.banner.risk h2{color:var(--red)}.banner.warn h2{color:var(--amber-ink)}
.banner p{margin:0 0 8px}
.never{font-size:13px;font-weight:700;margin-top:8px}
.mgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.col{display:grid;gap:16px;min-width:0}
.brief{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.brief li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px}
.num{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--blue);color:var(--on-dark);font-size:12px;font-weight:800}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.paused{background:var(--blue-50);border-radius:10px;padding:10px 12px;font-size:14px}
.seg{display:inline-flex;background:var(--blue-50);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 12px;font-weight:700;font-size:13px;color:var(--navy)}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(18,25,87,.18)}
.legend{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--ink-2)}
.tscroll{overflow-x:auto}
.ev{width:100%;border-collapse:collapse;min-width:580px}
.ev th{font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-2);text-align:left;padding:8px 12px;background:var(--blue-25);border-block:1px solid var(--line)}
.ev td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
.ev tr:last-child td{border-bottom:0}
.ev td:first-child{font-weight:700;white-space:nowrap}
.ev .ao{display:block;font-size:12px;color:var(--ink-2);margin-top:3px;white-space:nowrap}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.steps li{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.steps .num{background:var(--navy);flex-shrink:0}
.kv{display:grid;gap:3px;font-size:14px}
.warnline{font-size:13px;font-weight:700;color:var(--amber-ink);background:var(--amber-50);border-radius:8px;padding:5px 9px;margin-top:8px}
.tl{list-style:none;margin:0;padding:0 0 0 4px}
.tl li{position:relative;padding:0 0 14px 22px;border-left:2px solid var(--line)}
.tl li:last-child{padding-bottom:0}
.tl li::before{content:"";position:absolute;left:-7px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--blue);border:2px solid var(--surface)}
.tl h3{font-size:14px}
.tl p{margin:2px 0 5px;font-size:13px;color:var(--ink-2)}

/* ---------- Call screen ---------- */
.ogrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
.note-col{position:sticky;top:calc(env(safe-area-inset-top,0px) + 124px)}
.routes{display:grid;gap:8px}
.route{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.route input{width:17px;height:17px;margin:3px 0 0;accent-color:var(--blue)}
.route.sel{border-color:var(--blue);background:var(--blue-50)}
.route.blocked{cursor:not-allowed;background:var(--red-50);border-color:var(--red-line)}
.route strong{display:block;font-size:14px}
.route .ph{font-family:var(--mono);font-size:15px;font-weight:600}
.route small{display:block;font-size:13px;color:var(--ink-2)}
.route.blocked small{color:var(--red);font-weight:700}
.script{margin-top:10px;background:var(--blue-25);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px}
.outs{display:flex;flex-wrap:wrap;gap:6px}
.outs button{border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:700}
.outs button:hover{border-color:var(--navy)}
.outs button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--on-dark)}
.pf{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.pf .lab{font-size:12px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-2)}
.pf .val{font-weight:600;font-size:14px}
.cf{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;white-space:nowrap}
.cf input{width:17px;height:17px;accent-color:var(--green-ink)}
.u{font-size:11px;font-weight:800;padding:1px 6px;border-radius:5px;color:var(--amber-ink);background:var(--amber-50)}
.c{font-size:11px;font-weight:800;padding:1px 6px;border-radius:5px;color:var(--green-ink);background:var(--green-50)}
.field{display:grid;gap:5px;margin-top:10px}
.field label{font-size:13px;font-weight:800}
.field input,.field textarea{width:100%;border:1px solid var(--line-2);border-radius:9px;padding:8px 10px;font-size:14px;background:var(--surface)}
.field textarea{min-height:68px;resize:vertical}
.field input:disabled,.field textarea:disabled{background:var(--blue-25)}
.field input::placeholder,.field textarea::placeholder{color:var(--ink-2)}
.draft{white-space:pre-wrap;font-size:14px;line-height:1.6;background:var(--blue-25);border:1px solid var(--line);border-radius:12px;padding:12px 14px;max-height:430px;overflow:auto}
.draft-ta{width:100%;min-height:280px;border:1px solid var(--line-2);border-radius:12px;padding:12px;font-size:14px;line-height:1.6}
.review{margin-top:12px;border:2px solid var(--blue);border-radius:12px;padding:12px;background:var(--blue-50)}
.review label{display:flex;gap:8px;align-items:flex-start;font-weight:600;font-size:14px}
.review input{width:18px;height:18px;margin-top:2px;accent-color:var(--blue)}
.writes{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.writes li{display:flex;justify-content:space-between;gap:10px;padding:6px 10px;border-radius:9px;font-size:14px;font-weight:700;background:var(--green-50);color:var(--green-ink)}
.writes li.p{background:var(--amber-50);color:var(--amber-ink)}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:16px;font-size:13px;font-weight:700}
.flow span{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:4px 9px}
.flow i{font-style:normal;color:var(--ink-2)}

/* ---------- Footer, dialog, tour, toast ---------- */
footer{border-top:1px solid var(--line);background:var(--surface)}
footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px 20px;flex-wrap:wrap;padding-block:14px 96px;font-size:13px;color:var(--ink-2)}
.toggles{display:flex;gap:14px;flex-wrap:wrap;align-items:center;border-radius:12px;padding:4px}
.toggles label{display:flex;gap:6px;align-items:center;font-weight:700;color:var(--ink)}
.toggles input{width:17px;height:17px;accent-color:var(--blue)}
dialog{border:0;border-radius:16px;padding:0;width:min(560px,calc(100vw - 32px));max-height:85vh;color:var(--ink);background:var(--surface);box-shadow:0 24px 64px rgba(11,15,63,.4)}
dialog::backdrop{background:rgba(11,15,63,.55)}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 18px;background:var(--navy);color:var(--on-dark)}
.dh h2{font-family:var(--mono);font-size:18px}
.dh p{margin:2px 0 0;font-size:13px;color:var(--on-dark-2)}
.x{border:1px solid var(--on-dark-2);background:transparent;color:var(--on-dark);border-radius:8px;width:34px;height:34px;font-size:18px;line-height:1}
.db{padding:14px 18px 18px;overflow:auto}
.rf{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr);margin:0}
.rf dt,.rf dd{padding:7px 0;border-bottom:1px solid var(--line);margin:0}
.rf dt{font-size:12px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--ink-2)}
.rf dd{font-size:14px;overflow-wrap:anywhere}
.tour{position:fixed;z-index:35;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(380px,calc(100vw - 32px));background:var(--navy);color:var(--on-dark);border-radius:16px;padding:14px 16px;box-shadow:0 18px 50px rgba(11,15,63,.45)}
.tour .tt{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--on-dark-2)}
.tour h3{font-size:17px;margin:6px 0 4px}
.tour p{margin:0;font-size:14px;color:var(--on-dark-2)}
.tour .row{margin-top:12px;justify-content:space-between}
.tour .btn{border-color:var(--on-dark-2);background:transparent;color:var(--on-dark)}
.tour .btn:hover{background:var(--navy-deep)}
.tour .btn.primary{background:var(--blue);border-color:var(--blue)}
.tour .dots{display:flex;gap:4px}
.tour .dots i{width:7px;height:7px;border-radius:50%;background:var(--indigo)}
.tour .dots i.on{background:var(--on-dark)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);max-width:calc(100vw - 32px);background:var(--ink);color:var(--on-dark);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:50}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:980px){
  .qgrid,.mgrid,.ogrid{grid-template-columns:minmax(0,1fr)}
  .pane,.note-col{position:static}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  .appbar{position:static}
  .who,.clock{display:none}
  .head h1{font-size:24px}
  .qhead{display:none}
  .qrow{grid-template-columns:56px minmax(0,1fr) auto;grid-template-areas:"s n d" "s w w"}
  .qrow .score{grid-area:s;align-self:start}.qrow .qn{grid-area:n}.qrow .qw{grid-area:w}.qrow .qd{grid-area:d}
  .qn .av{display:none}
  .search{flex:1 1 100%}
  .bl{grid-template-columns:84px minmax(0,1fr) 50px}
  .rf{grid-template-columns:minmax(0,1fr)}
  .rf dt{border-bottom:0;padding-bottom:0}
  .mid h1{font-size:22px}
  .tile .n{min-width:40px;height:40px;font-size:17px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

 const t=(v,href,tag,label,ctx)=>`<a class="tab${r.v===v?' on':''}" href="${href}"${r.v===v?' aria-current="page"':''}><span class="tag tag-${tag}">${tag.toUpperCase()}</span>${label}${ctx?` <span class="ctx">· ${ctx}</span>`:''}</a>`;
 document.getElementById('tabs').innerHTML=t('queue','#queue','decide','Work queue')+t('member','#member-'+c.key,'know','Member 360',c.name)+t('outreach','#outreach-'+c.key,'do','Call & note',c.name);
}

/* ================= Screen 1: Work queue ================= */
function list(){const q=S.q.trim().toLowerCase();return ORDER.map(k=>P[k]).filter(p=>{const f=S.filter;const okF=f==='all'||(f==='now'&&p.today)||(f==='scheduled'&&!p.today)||p.tags.includes(f);return okF&&(!q||[p.name,p.id,p.cond,p.plan,p.why].join(' ').toLowerCase().includes(q));});}
function vQueue(){
 const L=list();if(L.length&&!L.find(p=>p.key===S.sel))S.sel=L[0].key;
 const n={now:4,barriers:2,meds:2,scheduled:1,all:5};
 const chips=[['now','Work now'],['barriers','Contact barriers'],['meds','Medication'],['scheduled','Later this week'],['all','All']];
 const rows=L.length?L.map(p=>`<button type="button" class="qrow" data-sel="${p.key}" aria-pressed="${p.key===S.sel}"><span class="score ${sc(tot(p))}">${tot(p)}</span><span class="qn">${av(p)}<span><strong>${p.name}, ${p.age}</strong><small>${p.plan}</small></span></span><span class="qw${p.warn?' warn':''}">${esc(p.why)}<small>${esc(p.whyS)}</small></span><span class="qd">${p.due}<small>${p.dueL}</small></span></button>`).join(''):`<div class="empty">No members match.<br><button type="button" class="btn sm" data-act="clear" style="margin-top:8px">Clear search and filters</button></div>`;
 return `<div class="head"><div><div class="kicker"><span class="tag tag-decide">DECIDE</span>Who needs Maria first</div><h1>Good morning, Maria. 4 members need you today.</h1><p>Ranked by urgency, deadline, barriers and new events. Select a member to see why they are where they are, and what to do first.</p></div></div>
 <div class="tiles"><div class="tile"><span class="n">5</span><span class="l">members in this demo</span></div><div class="tile hot"><span class="n">4</span><span class="l">due today</span></div><div class="tile k"><span class="n">0</span><span class="l">overdue at 08:00</span></div><div class="tile v"><span class="n tnum">5→4</span><span class="l">hospital alerts → events (1 duplicate merged)</span></div></div>
 <div class="qgrid"><section class="card" id="qlist" aria-label="Work queue">
  <div class="tools"><div class="chips" role="group" aria-label="Filter">${chips.map(([k,l])=>`<button type="button" class="chip${S.filter===k?' on':''}" data-filter="${k}" aria-pressed="${S.filter===k}">${l}<span>${n[k]}</span></button>`).join('')}</div><label class="search" for="q"><span aria-hidden="true">⌕</span><input id="q" type="search" placeholder="Search name or condition" value="${esc(S.q)}" autocomplete="off"></label></div>
  <div class="qhead" aria-hidden="true"><span>Score</span><span>Member</span><span>Why now</span><span style="text-align:right">Due</span></div>${rows}</section>
  ${L.length?pane(P[S.sel]):''}</div>`;
}
function pane(p){
 const s=p.score,rank=ORDER.indexOf(p.key)+1,a=acts(p);
 const bar=(l,v,m)=>`<div class="bl"><span>${l}</span><div class="tr" role="img" aria-label="${l}: ${v} of ${m}"><div class="fi" style="width:${v/m*100}%"></div></div><b>${v} / ${m}</b></div>`;
 return `<aside class="card pane" id="pane" aria-label="Why ${p.name} is ranked here"><div class="ch navy"><div class="ptop">${av(p,true)}<div><h2>${p.name}, ${p.age}</h2><div class="sub">${p.plan} · ${p.cond}</div></div></div><span class="score ${sc(tot(p))}">${tot(p)}</span></div>
 <div class="cb"><div class="sect" style="margin-top:0">Why #${rank} · ${tot(p)} of 100 points</div><div class="bars">${bar('Urgency',s.u,40)}${bar('Deadline',s.d,30)}${bar('Barriers',s.b,20)}${bar('New event',s.n,10)}</div>
 <ul class="why"><li><b>Urgency:</b> ${esc(p.sw.u)}</li><li><b>Deadline:</b> ${esc(p.sw.d)}</li><li><b>Barriers:</b> ${esc(p.sw.b)}</li><li><b>New event:</b> ${esc(p.sw.n)}</li></ul>${p.tie?`<div class="tie">${esc(p.tie)}</div>`:''}
 <div class="sect">Next actions · at most 3</div><div class="acts">${a.map((x,i)=>act(p,x,i)).join('')}</div>
 <div class="row" style="margin-top:14px"><a class="btn" href="#member-${p.key}">Open Member 360</a><a class="btn primary" href="#outreach-${p.key}">Start the call →</a></div>
 <p class="hint" style="margin:10px 0 0">Rules, not a black box. The medical director signs off the weights, and dismiss reasons are used to tune them.</p></div></aside>`;
}
function act(p,x,i){
 const d=p.actions[i].d;
 if(x.s==='ok')return `<div class="act ok"><div class="act-t">${esc(x.t)}</div><div class="act-s">✓ Added to Maria’s tasks · due ${p.due} ${p.dueL.toLowerCase()}</div><div class="row"><button type="button" class="btn sm" data-undo="${i}">Undo</button></div></div>`;
 if(x.s==='no')return `<div class="act no"><div class="act-t">${esc(x.t)}</div><div class="act-s">Dismissed · ${esc(x.r)}</div><div class="row"><button type="button" class="btn sm" data-undo="${i}">Undo</button></div></div>`;
 if(x.s==='edit')return `<div class="act"><label class="act-t" for="ed-${i}">Edit this action</label><input id="ed-${i}" value="${esc(x.t)}"><div class="row"><button type="button" class="btn sm primary" data-save="${i}">Save and accept</button><button type="button" class="btn sm" data-undo="${i}">Cancel</button></div></div>`;
 if(x.s==='why')return `<div class="act"><div class="act-t">${esc(x.t)}</div><div class="act-d">Why dismiss it? The reason helps tune the rules.</div><div class="row">${['Already done','Not right for this member','Data looks wrong','Member declined'].map(r=>`<button type="button" class="btn sm" data-reason="${i}" data-r="${r}">${r}</button>`).join('')}<button type="button" class="btn sm" data-undo="${i}">Cancel</button></div></div>`;
 return `<div class="act"><div class="act-t">${esc(x.t)}</div><div class="act-d">${esc(d)}</div><div class="row"><button type="button" class="btn sm primary" data-accept="${i}">Accept</button><button type="button" class="btn sm" data-edit="${i}">Edit</button><button type="button" class="btn sm" data-dismiss="${i}">Dismiss</button></div></div>`;
}

/* ================= Screen 2: Member 360 ================= */
function head(p,back){
 return `<a class="back" href="${back}">← ${back==='#queue'?'Back to work queue':'Back to Member 360'}</a>
 <section class="card mhead"><div class="mid">${av(p,true)}<div><h1>${p.name}, ${p.age}</h1><p>${p.id} · ${p.plan} · ${p.cond} · ${esc(p.owner)}</p><div class="mmeta"><span class="score ${sc(tot(p))}">${tot(p)}</span><span class="pill">Due ${p.dueL.toLowerCase()} ${p.due} ET</span></div></div></div>${back==='#queue'?`<a class="btn primary" href="#outreach-${p.key}">Start the call →</a>`:''}</section>`;
}
function vMember(p){
 const b=p.banner,bx=!S.pbm&&b.xd?b.xd:b.x,view=S.view[p.key]||'ev';
 const brief=S.ai?`<ol class="brief">${p.brief.map((l,i)=>{const d=down(l);return `<li><span class="num">${i+1}</span><div>${esc(d?l.td:l.t)}<div class="meta">${d?st('unknown')+fr('down'):st(l.st)+l.src.map(src).join('')}</div></div></li>`;}).join('')}</ol><p class="hint" style="margin:12px 0 0">The brief only restates source records. It draws no clinical conclusions.</p>`:`<div class="paused"><strong>AI brief paused.</strong> Nothing below has changed: every sourced fact is still in the evidence table.</div>`;
 const rows=p.ev.map(e=>{const d=down(e);return `<tr><td>${e.d}</td><td>${d?'Unknown · pharmacy feed down since 06:00':esc(e.f)}</td><td>${d?st('unknown'):st(e.st)}</td><td>${d?fr('down'):fr(e.fr)}<span class="ao">${d?'Last success 06:00':esc(e.ao)}</span></td><td>${e.src.length?e.src.map(src).join(' '):'<span class="hint">—</span>'}</td></tr>`;}).join('');
 const lower=view==='ev'?`<div class="cb" style="padding-bottom:8px"><div class="legend">${st('ok')}${st('single')}${st('conflict')}${st('unknown')}<span>Freshness is judged against what is normal for each source.</span></div></div><div class="tscroll"><table class="ev"><thead><tr><th>Topic</th><th>What the source says</th><th>Evidence</th><th>Freshness</th><th>Record</th></tr></thead><tbody>${rows}</tbody></table></div>`:`<div class="cb"><ol class="tl">${p.tl.map(t=>`<li><h3>${esc(t.t)}</h3><p><span class="tnum">${esc(t.at)}</span> · ${esc(t.p)}</p>${src(t.src)}</li>`).join('')}</ol></div>`;
 return head(p,'#queue')+
 `<div class="explain"><span><strong>Member 360</strong> is one screen with everything Maria needs about ${p.name}, pulled from every source, with where each fact came from.</span><button type="button" data-act="explain" aria-expanded="${S.explain}">${S.explain?'Hide':'What does that mean?'}</button>${S.explain?`<div class="explain-box"><strong>Why “360”:</strong> it is the full circle around one member. Today Maria opens 6–7 systems (claims, pharmacy, hospital alerts, notes, her own spreadsheet) to rebuild this picture. Here it is in one place:<ul><li><b>Top:</b> the one issue that changes today’s action.</li><li><b>What changed:</b> a 3-line AI brief, each line linked to its source record.</li><li><b>Evidence:</b> every fact, how sure we are, and how fresh it is.</li><li><b>Right side:</b> next steps, contact rules, care team and social needs.</li></ul></div>`:''}</div>
 <section class="banner ${b.tone}" id="banner" aria-label="Top issue"><span class="ic" aria-hidden="true">${b.ic}</span><div><h2>${esc(b.t)}</h2><p>${bx}</p><div class="row">${b.src.map(src).join('')}</div><div class="never">${esc(b.never)}</div></div></section>
 <div class="mgrid"><div class="col">
  <section class="card" id="brief"><div class="ch blue">What changed<small>${S.ai?'AI brief · every line linked':'AI paused'}</small></div><div class="cb">${brief}</div></section>
  <section class="card"><div class="ch plain"><span>${view==='ev'?'Evidence and freshness':'Timeline'}</span><span class="seg" role="group" aria-label="View"><button type="button" data-view="ev" aria-pressed="${view==='ev'}">Evidence</button><button type="button" data-view="tl" aria-pressed="${view==='tl'}">Timeline</button></span></div>${lower}</section>
 </div><div class="col">
  <section class="card"><div class="ch navy">Next steps</div><div class="cb"><ol class="steps">${p.steps.map((s,i)=>`<li><span class="num">${i+1}</span><span>${esc(s)}</span></li>`).join('')}</ol><div class="row" style="margin-top:14px"><a class="btn primary" href="#outreach-${p.key}">Start the call →</a></div></div></section>
  ${p.cards.map(c=>`<section class="card"><div class="ch plain">${c.h}</div><div class="cb kv">${c.l.map(l=>`<div>${l}</div>`).join('')}<div style="margin-top:6px">${src(c.src)}</div>${c.w?`<div class="warnline">${esc(c.w)}</div>`:''}</div></section>`).join('')}
 </div></div>`;
}

/* ================= Screen 3: Call & note ================= */
const outs=(p,s)=>p.routes[s.route].s==='gated'?['prep','callback','noanswer']:['prep','connected','noanswer','voicemail'];
function note(p,s){
 const r=p.routes[s.route],c=s.out==='connected',L=[];
 L.push('CARE COORDINATION NOTE · DRAFT FOR RN REVIEW',`${p.name}, ${p.age} · ${p.id} · ${p.plan}`,'Mon 2 Nov 2026 · Maria, RN','',`CONTACT: ${r.l} (${r.ph}) · ${OUTC[s.out]}`);
 if(OUTX[s.out])L.push(OUTX[s.out]);
 L.push('');
 const cf=p.pre.filter((f,i)=>c&&s.conf[i]),uc=p.pre.filter((f,i)=>!(c&&s.conf[i]));
 if(cf.length){L.push('CONFIRMED ON THIS CALL');cf.forEach(f=>L.push(`- ${f.l}: ${f.v} [${f.src}]`));L.push('');}
 if(uc.length){L.push('FROM SOURCES, NOT YET CONFIRMED');uc.forEach(f=>L.push(`- ${f.l}: ${f.v} [${f.src}]`));L.push('');}
 const ans=p.ask.map((a,i)=>[a.l,(s.ans[i]||'').trim()]).filter(([,v])=>c&&v);
 if(ans.length){L.push('REPORTED ON THIS CALL');ans.forEach(([l,v])=>L.push(`- ${l}: ${v}`));L.push('');}
 if(c&&s.find.trim()){L.push('RN FINDINGS',s.find.trim(),'');}
 const unk=p.ask.filter((a,i)=>!(c&&(s.ans[i]||'').trim())).map(a=>a.l);
 if(unk.length){L.push('STILL UNKNOWN');unk.forEach(u=>L.push(`- ${u}`));L.push('');}
 const acc=acts(p).filter(x=>x.s==='ok').map(x=>x.t);
 L.push('NEXT STEPS');(acc.length?acc:p.steps.slice(0,3)).forEach(x=>L.push(`- ${x}`));
 L.push('','Every line comes from Maria’s entries or a linked source record.');
 return L.join('\n');
}
function vCall(p){
 const s=sess(p),r=p.routes[s.route],c=s.out==='connected',lk=s.signed;
 const nC=p.pre.filter((f,i)=>s.conf[i]&&c).length,nA=p.ask.filter((a,i)=>(s.ans[i]||'').trim()).length;
 const routes=p.routes.map((x,i)=>`<label class="route${i===s.route?' sel':''}${x.s==='blocked'?' blocked':''}" for="rt-${i}"><input type="radio" name="route" id="rt-${i}" value="${i}" ${i===s.route?'checked':''} ${x.s==='blocked'||lk?'disabled':''}><span><strong>${esc(x.l)}</strong><span class="ph">${x.ph}</span><small>${x.s==='blocked'?'✕ ':''}${esc(x.n)}</small></span></label>`).join('');
 const partial=!c||nA<p.ask.length;
 const writes=[['Identity & consent','✓ saved'],['Assessment',partial?'Saved as partial':'✓ complete'],['Goal & barrier',c&&(s.ans[p.ask.length-1]||'').trim()?'✓ saved':'Still open'],['Care plan','✓ updated'],['Task · owner · due','✓ Maria'],['Signed note','✓ signed'],['CM system & audit',s.ack?'✓ received · '+s.rcpt:'Sending…']];
 let n;
 if(s.signed)n=`<div class="draft" tabindex="0" aria-label="Signed note">${esc(S.ai||!s.manual?note(p,s):s.manual)}</div><div class="sect">One entry, saved to all seven places</div><ul class="writes">${writes.map(([l,v])=>`<li class="${/✓/.test(v)?'':'p'}"><span>${l}</span><span>${esc(v)}</span></li>`).join('')}</ul><div class="row" style="margin-top:12px"><button type="button" class="btn" data-act="newnote">Start a new note</button><a class="btn primary" href="#queue">Back to the queue</a></div>`;
 else{
  const body=S.ai?`<div class="draft" id="draft" tabindex="0" aria-label="Draft note">${esc(note(p,s))}</div>`:`<label class="sr" for="manual">Write the note</label><textarea class="draft-ta" id="manual" placeholder="AI drafting is paused. Write the note here; every field and source on the left is unchanged.">${esc(s.manual)}</textarea>`;
  const can=S.ai||s.manual.trim();
  n=body+(s.review?`<div class="review"><label for="rev"><input type="checkbox" id="rev"> I read every line. It matches what happened, and nothing is invented.</label><div class="row" style="margin-top:10px"><button type="button" class="btn primary" id="sign" data-act="sign" disabled>Sign and save</button><button type="button" class="btn" data-act="unreview">Keep editing</button></div></div>`:`<div class="row" style="margin-top:12px"><button type="button" class="btn primary" data-act="review" ${can?'':'disabled'}>Review and sign</button><span class="hint">${S.ai?'Nothing is saved until Maria signs.':'Write the note to continue.'}</span></div>`);
 }
 return head(p,'#member-'+p.key)+
 `<section class="banner ${p.banner.tone}" style="padding:10px 14px"><span class="ic" aria-hidden="true">${p.banner.ic}</span><div><h2 style="margin:3px 0 0;font-size:15px">${esc(p.banner.t)}</h2></div></section>
 <div class="ogrid"><div class="col">
  <section class="card" id="routes"><div class="ch navy">1 · Who to call<small>${p.routes.length} permitted routes, in order</small></div><div class="cb"><div class="routes" role="radiogroup" aria-label="Who to call">${routes}</div>
   ${r.s==='gated'?`<div class="script"><strong>Say only this:</strong><br>${esc(p.script)}</div>`:''}
   <div class="row" style="margin-top:10px"><button type="button" class="btn sm" data-copy="${r.ph}">Copy ${r.ph}</button><span class="hint">Maria dials from her own phone; this demo calls no one.</span></div></div></section>
  <section class="card"><div class="ch navy">2 · What happened<small>${p.pre.length} pre-filled · ${nC} confirmed · ${nA}/${p.ask.length} asked</small></div><div class="cb">
   <div class="outs" role="group" aria-label="Call outcome">${outs(p,s).map(o=>`<button type="button" data-out="${o}" aria-pressed="${o===s.out}" ${lk?'disabled':''}>${OUTC[o]}</button>`).join('')}</div>
   <p class="hint" style="margin:8px 0 4px">${c?'Confirm what the member verified, and type what you learned.':'“Preparation only” never records a call or an assessment. Choose Connected to confirm fields.'}</p>
   <div class="sect">Already known · confirm on the call</div>
   ${p.pre.map((f,i)=>`<div class="pf"><div><div class="lab">${esc(f.l)}</div><div class="val">${esc(f.v)}</div><div class="meta">${src(f.src)}${s.conf[i]&&c?'<span class="c">CONFIRMED</span>':'<span class="u">NOT YET CONFIRMED</span>'}</div></div><label class="cf" for="cf-${i}"><input type="checkbox" id="cf-${i}" data-conf="${i}" ${s.conf[i]&&c?'checked':''} ${!c||lk?'disabled':''}>Confirmed</label></div>`).join('')}
   <div class="sect">Ask on the call</div>
   ${p.ask.map((a,i)=>`<div class="field"><label for="ans-${i}">${esc(a.l)}</label><input id="ans-${i}" data-ans="${i}" value="${esc(s.ans[i]||'')}" placeholder="${esc(c?a.ph:'Choose Connected first')}" ${!c||lk?'disabled':''}></div>`).join('')}
   <div class="field"><label for="find">Maria’s findings</label><textarea id="find" placeholder="${c?'What you verified. Leave unknowns unresolved.':'Choose Connected first'}" ${!c||lk?'disabled':''}>${esc(s.find)}</textarea></div>
   <p class="hint" style="margin:10px 0 0">The full assessment has 40 fields. About 22 come pre-filled from sources; about 18 need the conversation. This screen shows the ones that matter for ${p.name}.</p>
  </div></section>
 </div>
 <div class="note-col"><section class="card" id="notecard"><div class="ch blue">3 · Note<small>${S.ai?'AI draft · Maria signs':'Manual · AI paused'}</small></div><div class="cb">${n}</div></section></div></div>
 <div class="flow" aria-label="Capture once"><span>Identity &amp; consent</span><i>→</i><span>Assessment</span><i>→</i><span>Goal &amp; barrier</span><i>→</i><span>Care plan</span><i>→</i><span>Task · owner · due</span><i>→</i><span>Signed note</span><i>→</i><span>CM system &amp; audit</span></div>`;
}

/* ================= Render ================= */
function render(){
 const r=route();if(r.p)S.cur=r.p.key;
 tabs(r);
 document.getElementById('app').innerHTML=r.v==='member'?vMember(r.p):r.v==='outreach'?vCall(r.p):vQueue();
 document.title=(r.p?r.p.name+' · ':'')+'Care Workbench';
 drawTour();
}
function refreshNote(p){const s=sess(p);if(s.review){s.review=false;render();return;}const d=document.getElementById('draft');if(d)d.textContent=note(p,s);}
function openSrc(id){
 const r=R[id];if(!r){toast('Record '+id+' is not in this demo.');return;}const d=document.getElementById('dlg');
 d.innerHTML=`<div class="dh"><div><h2 id="dlg-t">${id}</h2><p>${esc(r[0])} · ${esc(r[1])} · fictional</p></div><button type="button" class="x" data-act="close" aria-label="Close">×</button></div><div class="db"><dl class="rf"><dt>Happened</dt><dd>${esc(r[2])}</dd><dt>Received</dt><dd>${esc(r[3])}</dd>${r[4].map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl><p class="hint" style="margin:12px 0 0">Shown exactly as the source sent it. It is not clinician-confirmed until Maria confirms it.</p></div>`;
 d.showModal();
}
/* Guided demo */
function drawTour(){
 const el=document.getElementById('tour');document.querySelectorAll('.spot').forEach(e=>e.classList.remove('spot'));
 if(S.tour<0){el.hidden=true;return;}
 const t=TOUR[S.tour];el.hidden=false;
 el.innerHTML=`<div class="tt"><span>Guided demo · ${S.tour+1} of ${TOUR.length}</span><button type="button" class="x" data-act="tour-end" aria-label="Close guided demo" style="width:28px;height:28px;font-size:15px">×</button></div><h3>${esc(t.t)}</h3><p>${esc(t.x)}</p><div class="row"><span class="dots">${TOUR.map((_,i)=>`<i class="${i===S.tour?'on':''}"></i>`).join('')}</span><span class="row" style="margin:0"><button type="button" class="btn sm" data-act="tour-back" ${S.tour===0?'disabled':''}>Back</button><button type="button" class="btn sm primary" data-act="tour-next">${S.tour===TOUR.length-1?'Finish':'Next'}</button></span></div>`;
 const tg=document.querySelector(t.el);if(tg)tg.classList.add('spot');
}
function goTour(i){
 S.tour=i;const t=TOUR[i];if(t.sel){S.sel=t.sel;S.filter='now';S.q='';}
 if(t.go&&location.hash!==t.go&&!(t.go==='#queue'&&!location.hash)){location.hash=t.go;return;}
 render();const tg=document.querySelector(t.el);if(tg)tg.scrollIntoView({block:'center',behavior:'smooth'});
}

/* ================= Events ================= */
document.addEventListener('click',e=>{
 const b=e.target.closest('button,a');if(!b)return;
 const d=b.dataset,r=route();
 if(b.tagName==='A'){const h=b.getAttribute('href')||'';if(h===(location.hash||'#queue')){e.preventDefault();window.scrollTo({top:0,behavior:'smooth'});toast('You’re on '+({queue:'the work queue',member:'Member 360',outreach:'the call screen'})[r.v]+(r.p?' for '+r.p.name:'')+'.');return;}}
 if(d.src){openSrc(d.src);return;}
 switch(d.act){
  case'close':document.getElementById('dlg').close();return;
  case'tour':goTour(0);return;
  case'tour-next':if(S.tour>=TOUR.length-1){S.tour=-1;drawTour();toast('Demo finished. Explore any member on your own.');}else goTour(S.tour+1);return;
  case'tour-back':if(S.tour>0)goTour(S.tour-1);return;
  case'tour-end':S.tour=-1;drawTour();return;
  case'reset':S=fresh();document.getElementById('t-ai').checked=false;document.getElementById('t-pbm').checked=false;if(location.hash&&location.hash!=='#queue')location.hash='queue';else render();toast('Demo reset.');return;
  case'clear':S.filter='all';S.q='';render();return;
  case'explain':S.explain=!S.explain;render();return;
 }
 if(d.filter){S.filter=d.filter;render();return;}
 if(d.sel){S.sel=d.sel;render();return;}
 if(d.view&&r.p){S.view[r.p.key]=d.view;render();return;}
 if(r.v==='queue'){
  const p=P[S.sel],a=acts(p);
  if(d.accept){a[+d.accept].s='ok';render();toast('Added to Maria’s tasks.');return;}
  if(d.edit){a[+d.edit].s='edit';render();const f=document.getElementById('ed-'+d.edit);if(f)f.focus();return;}
  if(d.save){const v=(document.getElementById('ed-'+d.save)||{}).value;if(v&&v.trim())a[+d.save].t=v.trim();a[+d.save].s='ok';render();toast('Edited and added to Maria’s tasks.');return;}
  if(d.dismiss){a[+d.dismiss].s='why';render();return;}
  if(d.reason){a[+d.reason].s='no';a[+d.reason].r=d.r;render();toast('Dismissed. Reason recorded.');return;}
  if(d.undo){const i=+d.undo;a[i]={s:'open',t:p.actions[i].t,r:''};render();return;}
 }
 if(r.v==='outreach'){
  const p=r.p,s=sess(p);
  if(d.out){s.out=d.out;s.review=false;render();return;}
  if(d.copy){const num=d.copy;const ok=()=>toast('Copied '+num);try{navigator.clipboard.writeText(num).then(ok,()=>toast('Number: '+num));}catch(_){toast('Number: '+num);}return;}
  if(d.act==='review'){s.review=true;render();const c=document.getElementById('rev');if(c)c.focus();return;}
  if(d.act==='unreview'){s.review=false;render();return;}
  if(d.act==='sign'){s.signed=true;s.review=false;render();toast('Signed. Sending to the CM system…');setTimeout(()=>{s.ack=true;s.rcpt='#'+p.id.slice(4)+'-'+(1000+Math.floor(Math.random()*8999));if(route().p===p)render();toast('The CM system received the note.');},1400);return;}
  if(d.act==='newnote'){delete S.sess[p.key];render();return;}
 }
});
document.addEventListener('change',e=>{
 const t=e.target,r=route();
 if(t.id==='t-ai'){S.ai=!t.checked;render();toast(S.ai?'AI assist is back on.':'AI paused. Maria can still write and sign notes.');return;}
 if(t.id==='t-pbm'){S.pbm=!t.checked;render();toast(S.pbm?'Pharmacy feed restored.':'Pharmacy feed down. Fill facts now show as unknown.');return;}
 if(t.id==='rev'){const b=document.getElementById('sign');if(b)b.disabled=!t.checked;return;}
 if(r.v!=='outreach')return;
 const s=sess(r.p);
 if(t.name==='route'){s.route=+t.value;if(!outs(r.p,s).includes(s.out))s.out='prep';s.review=false;render();return;}
 if(t.dataset.conf){s.conf[+t.dataset.conf]=t.checked;s.review=false;render();return;}
});
document.addEventListener('input',e=>{
 const t=e.target,r=route();
 if(t.id==='q'){S.q=t.value;const pos=t.selectionStart;render();const q=document.getElementById('q');if(q){q.focus();try{q.setSelectionRange(pos,pos);}catch(_){}}return;}
 if(r.v!=='outreach')return;
 const s=sess(r.p);
 if(t.dataset.ans!==undefined){s.ans[+t.dataset.ans]=t.value;refreshNote(r.p);}
 else if(t.id==='find'){s.find=t.value;refreshNote(r.p);}
 else if(t.id==='manual'){s.manual=t.value;const b=document.querySelector('[data-act="review"]');if(b)b.disabled=!t.value.trim();}
});
document.getElementById('dlg').addEventListener('click',e=>{if(e.target.id==='dlg')e.target.close();});
window.addEventListener('hashchange',()=>{const d=document.getElementById('dlg');if(d.open)d.close();render();
 if(S.tour>=0){const tg=document.querySelector(TOUR[S.tour].el);if(tg)tg.scrollIntoView({block:'center',behavior:'smooth'});}else window.scrollTo(0,0);});
render();
})();
</script>
</body>
</html>
